  const C=new Int32Array(cx*cy*cz).fill(-1);const P=[];const v=new Float32Array(8);
  for(let k=0;k<cz;k++)for(let j=0;j<cy;j++)for(let i=0;i<cx;i++){
    const base=i+j*sy+k*sz;let mask=0;
    for(let c=0;c<8;c++){v[c]=F[base+CO[c][0]+CO[c][1]*sy+CO[c][2]*sz];if(v[c]<0)mask|=1<<c;}
    if(mask===0||mask===255)continue;
    let ax=0,ay=0,az=0,cnt=0;
    for(const e of ED){const a=e[0],b=e[1];if((v[a]<0)!==(v[b]<0)){const t=v[a]/(v[a]-v[b]);ax+=CO[a][0]+(CO[b][0]-CO[a][0])*t;ay+=CO[a][1]+(CO[b][1]-CO[a][1])*t;az+=CO[a][2]+(CO[b][2]-CO[a][2])*t;cnt++;}}
    C[i+j*cx+k*cx*cy]=P.length/3;P.push(min[0]+(i+ax/cnt)*step,min[1]+(j+ay/cnt)*step,min[2]+(k+az/cnt)*step);
  }
  const cid=(i,j,k)=>C[i+j*cx+k*cx*cy];const I=[];
  const quad=(a,b,c,d)=>{I.push(a,b,c,a,c,d);};
  for(let k=0;k<cz;k++)for(let j=0;j<cy;j++)for(let i=0;i<cx;i++){
    if(cid(i,j,k)<0)continue;const s0=F[i+j*sy+k*sz]<0;
    if(j>0&&k>0&&s0!==(F[i+1+j*sy+k*sz]<0))quad(cid(i,j,k),cid(i,j-1,k),cid(i,j-1,k-1),cid(i,j,k-1));
    if(i>0&&k>0&&s0!==(F[i+(j+1)*sy+k*sz]<0))quad(cid(i,j,k),cid(i,j,k-1),cid(i-1,j,k-1),cid(i-1,j,k));
    if(i>0&&j>0&&s0!==(F[i+j*sy+(k+1)*sz]<0))quad(cid(i,j,k),cid(i-1,j,k),cid(i-1,j-1,k),cid(i,j-1,k));
  }
  const nv=P.length/3,N=new Float32Array(nv*3),e=step*0.5;
  for(let q=0;q<nv;q++){const x=P[3*q],y=P[3*q+1],z=P[3*q+2];
    let gx=f(x+e,y,z)-f(x-e,y,z),gy=f(x,y+e,z)-f(x,y-e,z),gz=f(x,y,z+e)-f(x,y,z-e);const l=Math.hypot(gx,gy,gz)||1;
    N[3*q]=gx/l;N[3*q+1]=gy/l;N[3*q+2]=gz/l;}
  for(let t=0;t<I.length;t+=3){const a=I[t],b=I[t+1],c=I[t+2];
    const ux=P[3*b]-P[3*a],uy=P[3*b+1]-P[3*a+1],uz=P[3*b+2]-P[3*a+2],wx=P[3*c]-P[3*a],wy=P[3*c+1]-P[3*a+1],wz=P[3*c+2]-P[3*a+2];
    const fx=uy*wz-uz*wy,fy=uz*wx-ux*wz,fz=ux*wy-uy*wx;
    const sx=N[3*a]+N[3*b]+N[3*c],sy2=N[3*a+1]+N[3*b+1]+N[3*c+1],sz2=N[3*a+2]+N[3*b+2]+N[3*c+2];
    if(fx*sx+fy*sy2+fz*sz2<0){I[t+1]=c;I[t+2]=b;}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.BufferAttribute(N,3));
  g.setIndex(new THREE.Uint32BufferAttribute(I,1));
  g.userData.nets=true;
  return g;
}

/* ============ Sweep ============ */
const CIRCLE=[];for(let j=0;j<16;j++){const a=j/16*Math.PI*2;CIRCLE.push([Math.cos(a),Math.sin(a)]);}
const MENSHAPE=[[1,-0.45],[1.08,0],[1,0.45],[0.6,0.42],[0.1,0.2],[-0.5,-0.05],[-1,-0.3],[-0.9,-0.45],[0,-0.45]];
const P=arr=>t=>{if(t<=arr[0][0])return arr[0][1];for(let i=1;i<arr.length;i++){if(t<=arr[i][0]){const a=arr[i-1],b=arr[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);}}return arr[arr.length-1][1];};
const fnv=x=>typeof x==='function'?x:()=>x;
function sweep(pts,o){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],p[2])),false,'centripetal');
  const L=curve.getLength(),Nseg=o.seg||Math.max(18,Math.min(160,Math.round(L*5)));
  const shape=o.shape||CIRCLE,M=shape.length,wf=fnv(o.w),hf=o.h?fnv(o.h):null,rf=fnv(o.ratio??1);
  const hasCol=!!o.colorFn;
  const pos=[],uv=[],col=[],idx=[],rings=[];let prevB=null;
  const pushV=(p,u,vv,c)=>{pos.push(p.x,p.y,p.z);uv.push(u,vv);if(hasCol)col.push(c.r,c.g,c.b);return pos.length/3-1;};
  for(let i=0;i<=Nseg;i++){
    const t=i/Nseg,p=curve.getPointAt(t),T=curve.getTangentAt(t).normalize();
    let B=null;
    if(o.wdir){const W=typeof o.wdir==='function'?o.wdir(p,t):V(o.wdir[0],o.wdir[1],o.wdir[2]);B=W.clone().addScaledVector(T,-W.dot(T));if(B.lengthSq()<1e-4)B=null;}
    if(!B){if(prevB)B=prevB.clone().addScaledVector(T,-prevB.dot(T));else B=new THREE.Vector3().crossVectors(T,Math.abs(T.y)<0.9?V(0,1,0):V(1,0,0));}
    B.normalize();prevB=B;const Nn=new THREE.Vector3().crossVectors(T,B).normalize();
    const w=wf(t),h=hf?hf(t):w*rf(t),c=hasCol?o.colorFn(t):null;const ring=[];
    for(let j=0;j<=M;j++){const s=shape[j%M];ring.push(pushV(V(p.x+B.x*s[0]*w+Nn.x*s[1]*h,p.y+B.y*s[0]*w+Nn.y*s[1]*h,p.z+B.z*s[0]*w+Nn.z*s[1]*h),j/M*(o.urep||1),t*L*0.25,c));}
    rings.push({p,T,B,Nn,ring,t,w,h});
  }
  const vp=i=>V(pos[3*i],pos[3*i+1],pos[3*i+2]);
  const tri=(a,b,c,out)=>{const A=vp(a),Bv=vp(b),Cv=vp(c);const n=new THREE.Vector3().subVectors(Bv,A).cross(new THREE.Vector3().subVectors(Cv,A));if(n.dot(out)<0)idx.push(a,c,b);else idx.push(a,b,c);};
  for(let i=0;i<Nseg;i++){const r0=rings[i],r1=rings[i+1];
    for(let j=0;j<M;j++){const a=r0.ring[j],b=r0.ring[j+1],c=r1.ring[j],d=r1.ring[j+1];
      const out=vp(a).sub(r0.p);tri(a,c,b,out);tri(b,c,d,out);}}
  [[rings[0],-1],[rings[Nseg],1]].forEach(([r,sg])=>{
    let cc=null;if(hasCol)cc=(o.capColorFn&&o.capColorFn(r.p,r.t))||o.colorFn(r.t);
    const vv=r.t*L*0.25;const ctr=pushV(r.p,0.5,vv,cc);const cp=[];
    for(let j=0;j<M;j++){const s=shape[j];cp.push(pushV(vp(r.ring[j]),0.5+s[0]*0.08,vv+s[1]*0.08,cc));}
    const out=r.T.clone().multiplyScalar(sg);for(let j=0;j<M;j++)tri(ctr,cp[j],cp[(j+1)%M],out);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(hasCol)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  const nr=g.attributes.normal;
  rings.forEach(r=>{const a=r.ring[0],b=r.ring[M];const x=nr.getX(a)+nr.getX(b),y=nr.getY(a)+nr.getY(b),z=nr.getZ(a)+nr.getZ(b);const l=Math.hypot(x,y,z)||1;nr.setXYZ(a,x/l,y/l,z/l);nr.setXYZ(b,x/l,y/l,z/l);});
  return g;
}
function ellGeo(c,r){return new THREE.SphereGeometry(1,40,24).scale(r[0],r[1],r[2]).translate(c[0],c[1],c[2]);}

/* muscolo: ventre con lievi irregolarità, tendine argenteo, sezione di taglio scura */
const TENDON=lin('#e3ddcd'),CUTM=lin('#5e1914'),CUTT=lin('#d9ceb6');
function muscle(pts,wp,o={}){
  const belly=lin(o.col||'#a33f37').multiplyScalar(0.62).lerp(lin('#6b2a22'),0.18);const ranges=o.tendon||[];
  const seed=Math.abs(pts[0][0]*13.1+pts[0][1]*7.7+pts[0][2]*3.3)%50;
  const tw=t=>{let m=0;for(const [a,b] of ranges){m=Math.max(m,sstep(a-0.035,a+0.01,t)*(1-sstep(b-0.01,b+0.035,t)));}return m;};
  const base=P(wp),rat=o.ratio??0.75;
  const w=t=>base(t)*(1+0.16*(vnoise(t*6+seed,seed,1.3)-0.5)*(1-tw(t)));
  const r=t=>rat*(1+0.22*(vnoise(t*4+seed,2.1,seed)-0.5)*(1-tw(t)));
  return sweep(pts,{w,ratio:r,wdir:o.wdir,urep:1.5,
    colorFn:t=>{const c=belly.clone().lerp(TENDON,tw(t));return c.multiplyScalar(0.88+0.22*vnoise(t*9+seed,seed*.5,4.2));},
    capColorFn:(p,t)=>Math.abs(p.y)>19.7?(tw(t)>0.5?CUTT:CUTM):null});
}
/* tubo (vasi e nervi): r0/r1 raggio all'inizio/alla fine, raccordato al raggio r sui primi l0 / ultimi l1 cm (biforcazioni, rami) */
const tube=(pts,r,o={})=>{let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1],pts[i][2]-pts[i-1][2]);
  const e=u=>{u=clamp(u,0,1);return u*u*(3-2*u);},w=(o.r0||o.r1)?t=>r+(o.r0?(o.r0-r)*(1-e(t*L/(o.l0||1.5))):0)+(o.r1?(o.r1-r)*(1-e((1-t)*L/(o.l1||1.5))):0):r;
  return sweep(pts,Object.assign({urep:2},o,{w}));};
const band=(pts,w,ratio,wdir,o={})=>sweep(pts,Object.assign({w,ratio,wdir,urep:2},o));
function arc(c,rx,rz,a0,a1,n=26){const out=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;out.push([c[0]+rx*Math.cos(a),c[1],c[2]+rz*Math.sin(a)]);}return out;}
function meniscus(c,rx,rz,a0,a1,wp,hp){
  return sweep(arc(c,rx,rz,a0,a1),{shape:MENSHAPE,w:P(wp),h:P(hp),urep:3,wdir:p=>V(p.x-c[0],0,p.z-c[2]).normalize(),seg:90});
}

 {id:'vmed',cat:'mus',name:'Vasto mediale',info:'Le fibre oblique distali (VMO) si inseriscono sul margine mediale della rotula e ne contrastano la lateralizzazione.',o:'Parte inferiore della linea intertrocanterica, linea spirale, labbro mediale della linea aspra, linea sopracondiloidea mediale, setto intermuscolare mediale e tendine dell\u2019adduttore magno (fibre oblique, VMO).',ins:'Margine mediale della rotula e tendine quadricipitale; retinacolo rotuleo mediale; tramite il tendine rotuleo, tuberosità tibiale.',fn:'Estende il ginocchio; il VMO è il principale stabilizzatore dinamico mediale della rotula.',
  b:()=>[REAL('vmed')]},
 {id:'vlat',cat:'mus',name:'Vasto laterale',info:'Il capo più voluminoso del quadricipite. Le fibre distali, più oblique, arrivano al margine supero-laterale della rotula; la sua lamina tendinea confluisce nel margine laterale del tendine quadricipitale.',o:'Parte superiore della linea intertrocanterica, margini anteriore e inferiore del grande trocantere, tuberosità glutea, labbro laterale della linea aspra, setto intermuscolare laterale.',ins:'Margine laterale della base della rotula e tendine quadricipitale; retinacolo rotuleo laterale; tramite il tendine rotuleo, tuberosità tibiale.',fn:'Estende il ginocchio.',
  b:()=>[REAL('vlat')]},
 {id:'sart',cat:'mus',name:'Sartorio',info:'Con gracile e semitendinoso forma la zampa d\u2019oca (pes anserinus), inserzione comune sulla tibia antero-mediale circa 4 cm sotto l\u2019interlinea: il sartorio ne è la componente più anteriore e superficiale e con la sua espansione copre gli altri due tendini.',o:'Spina iliaca anteriore superiore.',ins:'Faccia mediale della tibia prossimale (zampa d\u2019oca), anteriormente a gracile e semitendinoso; espansione alla fascia crurale.',fn:'Flette il ginocchio e, a ginocchio flesso, ruota internamente la tibia; flette, abduce e ruota esternamente l\u2019anca.',
  b:()=>[REAL('sart')]},
 {id:'grac',cat:'mus',name:'Gracile',info:'Con sartorio e semitendinoso forma la zampa d\u2019oca (pes anserinus), sulla tibia antero-mediale: il gracile vi si inserisce tra sartorio (davanti) e semitendinoso (sotto). Prelevato con il semitendinoso per la ricostruzione del LCA.',o:'Corpo del pube (metà inferiore, presso la sinfisi) e branca ischio-pubica.',ins:'Faccia mediale della tibia prossimale (zampa d\u2019oca), tra sartorio e semitendinoso.',fn:'Adduce l\u2019anca; flette il ginocchio e ruota internamente la tibia.',
  b:()=>[REAL('grac')]},
 {id:'semit',cat:'mus',name:'Semitendinoso',info:'Con sartorio e gracile forma la zampa d\u2019oca (pes anserinus), sulla tibia antero-mediale; il suo lungo tendine distale ne è la componente più inferiore.',o:'Tuberosità ischiatica, con tendine comune al capo lungo del bicipite femorale.',ins:'Faccia mediale della tibia prossimale (zampa d\u2019oca), posteriormente e distalmente al gracile.',fn:'Flette il ginocchio e ruota internamente la tibia; estende l\u2019anca.',
  b:()=>[REAL('semit')]},
 {id:'semim',cat:'mus',name:'Semimembranoso',info:'',o:'Tuberosità ischiatica (impronta supero-laterale).',ins:'Principale: faccia postero-mediale del condilo tibiale mediale. Espansioni: braccio anteriore sotto il LCM, legamento popliteo obliquo, capsula postero-mediale e fascia del popliteo.',fn:'Flette il ginocchio e ruota internamente la tibia; estende l\u2019anca; tende la capsula posteriore e stabilizza l\u2019angolo postero-mediale.',
  b:()=>[REAL('semim')]},
 {id:'biclong',cat:'mus',name:'Bicipite femorale, capo lungo',info:'Tendine comune con il capo breve sulla testa del perone, insieme al LCL.',o:'Tuberosità ischiatica, con tendine comune al semitendinoso; legamento sacrotuberoso.',ins:'Testa del perone (faccia laterale, davanti all\u2019apice), con tendine comune al capo breve; espansioni al condilo tibiale laterale e alla fascia crurale.',fn:'Flette il ginocchio e ruota esternamente la tibia; estende l\u2019anca.',
  b:()=>[REAL('biclong')]},
 {id:'bicbrev',cat:'mus',name:'Bicipite femorale, capo breve',info:'',o:'Labbro laterale della linea aspra, linea sopracondiloidea laterale e setto intermuscolare laterale.',ins:'Testa del perone, con tendine comune al capo lungo.',fn:'Flette il ginocchio e ruota esternamente la tibia (monoarticolare: non agisce sull\u2019anca).',
  b:()=>[REAL('bicbrev')]},
 {id:'addmag',cat:'mus',name:'Adduttore magno (porzione distale)',info:'L\u2019iato degli adduttori è attraversato dai vasi femorali, che diventano poplitei.',o:'Porzione adduttoria: branca ischio-pubica. Porzione ischiocondiloidea: tuberosità ischiatica.',ins:'Porzione adduttoria: tuberosità glutea, linea aspra e linea sopracondiloidea mediale. Porzione ischiocondiloidea: tubercolo adduttorio del femore, con tendine distale.',fn:'Adduce l\u2019anca; la porzione adduttoria la flette, la porzione ischiocondiloidea la estende.',
  b:()=>[REAL('addmag')]},
 {id:'gmed',cat:'mus',name:'Gastrocnemio, capo mediale',info:'Tra il suo tendine e il semimembranoso la borsa della cisti di Baker. Sede tipica di strappo (tennis leg).',o:'Faccia posteriore del femore sopra il condilo mediale e capsula articolare adiacente.',ins:'Faccia posteriore del calcagno, tramite il tendine calcaneale (d\u2019Achille) comune con capo laterale e soleo.',fn:'Flessione plantare della caviglia; flette il ginocchio (biarticolare).',
  b:()=>[REAL('gmed')]},
 {id:'glat',cat:'mus',name:'Gastrocnemio, capo laterale',info:'Nel tendine d\u2019origine può essere presente la fabella (sesamoide).',o:'Faccia laterale del condilo femorale laterale, parte inferiore della linea sopracondiloidea laterale e capsula articolare adiacente.',ins:'Faccia posteriore del calcagno, tramite il tendine calcaneale (d\u2019Achille).',fn:'Flessione plantare della caviglia; flette il ginocchio (biarticolare).',
  b:()=>[REAL('glat')]},
 {id:'plant',cat:'mus',name:'Plantare',info:'Piccolo ventre sopra il capo laterale del gastrocnemio; lungo tendine sottile tra gastrocnemio e soleo fino al calcagno.',o:'Parte inferiore della linea sopracondiloidea laterale del femore e legamento popliteo obliquo.',ins:'Faccia posteriore del calcagno, medialmente al tendine d\u2019Achille o fuso con esso.',fn:'Azione trascurabile: coadiuva il gastrocnemio nella flessione plantare della caviglia e nella flessione del ginocchio.',

 {id:'sol',cat:'mus',name:'Soleo',info:'L\u2019arcata tendinea del soleo, tra perone e tibia, è attraversata dai vasi poplitei e dal nervo tibiale; profondo al gastrocnemio, forma con esso il tricipite surale.',o:'Faccia posteriore della testa e del terzo prossimale del perone, linea del soleo e terzo medio del margine mediale della tibia, arcata tendinea del soleo.',ins:'Faccia posteriore del calcagno, tramite il tendine calcaneale (d\u2019Achille).',fn:'Flessione plantare della caviglia (monoarticolare); stabilizza la gamba nella stazione eretta e agisce da pompa muscolare venosa.',

 {id:'tibant',cat:'mus',name:'Tibiale anteriore',info:'Loggia anteriore.',o:'Condilo laterale e metà superiore della faccia laterale della tibia, membrana interossea e fascia crurale.',ins:'Faccia mediale e plantare del cuneiforme mediale e base del I metatarso.',fn:'Dorsiflessione della caviglia e inversione del piede; sostiene l\u2019arco longitudinale mediale.',

 {id:'extdig',cat:'mus',name:'Estensore lungo delle dita',info:'Loggia anteriore.',o:'Condilo laterale della tibia, tre quarti superiori della faccia mediale (anteriore) del perone, membrana interossea.',ins:'Con quattro tendini sull\u2019aponeurosi dorsale delle dita II–V, fino alle falangi media e distale.',fn:'Estende le dita II–V; coadiuva la dorsiflessione della caviglia e l\u2019eversione del piede.',

 {id:'perlong',cat:'mus',name:'Peroneo lungo',info:'Loggia laterale; il nervo peroneo comune passa tra il muscolo e il collo del perone.',o:'Testa e due terzi superiori della faccia laterale del perone; setti intermuscolari.',ins:'Base del I metatarso e cuneiforme mediale (lato plantare), dopo aver attraversato la pianta nel solco del cuboide.',fn:'Everte il piede e flette plantarmente la caviglia; sostiene l\u2019arco trasverso e longitudinale.',

 {id:'tibpost',cat:'mus',name:'Tibiale posteriore',info:'Il muscolo più profondo della loggia posteriore; il tendine passa dietro al malleolo mediale.',o:'Membrana interossea e facce posteriori contigue di tibia (sotto la linea del soleo) e perone.',ins:'Tuberosità del navicolare e cuneiforme mediale; espansioni plantari agli altri cuneiformi, al cuboide e alle basi del II–IV metatarso.',fn:'Inversione del piede e flessione plantare; principale stabilizzatore dinamico dell\u2019arco plantare mediale.',

 {id:'fdl',cat:'mus',name:'Flessore lungo delle dita',info:'Loggia posteriore profonda: decorre medialmente al tibiale posteriore e passa dietro al malleolo mediale.',o:'Faccia posteriore della tibia, medialmente, sotto la linea del soleo.',ins:'Basi delle falangi distali delle dita II–V.',fn:'Flette le ultime quattro dita; coadiuva flessione plantare e inversione del piede.',

/* ============ Texture fibrose (colore + normal map) ============ */
function fiberTextures(){
  const W=512,H=256,prof=new Float32Array(W);
  let x=0;while(x<W){const bw=9+Math.floor(Math.random()*16),base=0.72+Math.random()*0.28;
    for(let i=0;i<bw&&x<W;i++,x++){const e=Math.min(i,bw-1-i),edge=Math.min(1,e/2.2);prof[x]=base*(0.5+0.5*edge)+(Math.random()-0.5)*0.1;}}
  const hgt=new Float32Array(W*H);
  const at=xx=>{xx=((xx%W)+W)%W;const i=Math.floor(xx),f=xx-i;return prof[i]*(1-f)+prof[(i+1)%W]*f;};
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const wv=3*Math.sin(y/H*Math.PI*4+xx*0.025)+1.5*Math.sin(y/H*Math.PI*10+xx*0.07);
    hgt[y*W+xx]=at(xx+wv)+0.035*Math.sin(y*0.9+xx*0.3);}
  const c1=document.createElement('canvas'),c2=document.createElement('canvas');c1.width=c2.width=W;c1.height=c2.height=H;
  const g1=c1.getContext('2d'),g2=c2.getContext('2d'),d1=g1.createImageData(W,H),d2=g2.createImageData(W,H);
  const hv=(xx,y)=>hgt[((y+H)%H)*W+((xx+W)%W)];
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4,h=hv(xx,y);
    const k=Math.round(clamp(0.87+0.13*h,0,1)*255);d1.data[i]=k;d1.data[i+1]=k;d1.data[i+2]=k;d1.data[i+3]=255;
    let nx=(hv(xx-1,y)-hv(xx+1,y))*2.2,ny=(hv(xx,y-1)-hv(xx,y+1))*2.2,nz=1;const l=Math.hypot(nx,ny,nz);
    d2.data[i]=Math.round((nx/l*0.5+0.5)*255);d2.data[i+1]=Math.round((ny/l*0.5+0.5)*255);d2.data[i+2]=Math.round((nz/l*0.5+0.5)*255);d2.data[i+3]=255;}
  g1.putImageData(d1,0,0);g2.putImageData(d2,0,0);
  const t1=new THREE.CanvasTexture(c1),t2=new THREE.CanvasTexture(c2);
  [t1,t2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;});t1.encoding=THREE.sRGBEncoding;
  return {map:t1,normal:t2};
}

const NOISE_GLSL=`

            mix(mix(fbH(i+vec3(0,0,1)),fbH(i+vec3(1,0,1)),f.x),mix(fbH(i+vec3(0,1,1)),fbH(i+vec3(1,1,1)),f.x),f.y),f.z);}

function shaderize(m,o){

        .replace('#include <begin_vertex>','#include <begin_vertex>\nvFd=fdir;vOP=position;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vFd;\nvarying vec3 vOP;\n'+NOISE_GLSL)
        .replace('#include <color_fragment>',`#include <color_fragment>
  vec3 fF=normalize(vFd+vec3(1e-4,2e-4,-1e-4));vec3 fU=abs(fF.y)<0.9?vec3(0.,1.,0.):vec3(1.,0.,0.);
  vec3 fB1=normalize(cross(fF,fU));vec3 fB2=cross(fF,fB1);float fA=dot(vOP,fF);vec2 fP=vec2(dot(vOP,fB1),dot(vOP,fB2));
  float fH=fbF(fP,fA);diffuseColor.rgb*=0.84+0.3*fH;`)
        .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  {float fe=0.025;float fhx=fbF(fP+vec2(fe,0.),fA),fhy=fbF(fP+vec2(0.,fe),fA);
   vec3 fg=((fhx-fH)*fB1+(fhy-fH)*fB2)/fe;vec3 fgv=(viewMatrix*vec4(fg,0.)).xyz;
   normal=normalize(normal-${o.fiber.toFixed(3)}*(fgv-dot(fgv,normal)*normal));}`);
    }
    if(o.film){ /* membrana sottile: pieghe morbide in rilievo (solo sulle normali, la geometria non cambia) */
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vOP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvOP=position;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vOP;\n'+NOISE_GLSL+'float fbW(vec3 p){return 0.7*fbN(p*1.2)+0.3*fbN(p*3.1+11.0);}\n')

  {float we=0.02;float w0=fbW(vOP);vec3 wg=vec3(fbW(vOP+vec3(we,0.,0.))-w0,fbW(vOP+vec3(0.,we,0.))-w0,fbW(vOP+vec3(0.,0.,we))-w0)/we;
   vec3 wv=(viewMatrix*vec4(wg,0.)).xyz;normal=normalize(normal-${o.film.toFixed(3)}*(wv-dot(wv,normal)*normal));}`);
    }
    if(o.fresnel)sh.fragmentShader=sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',

/* ============ Finitura superfici: rilievo, colore, sezioni di taglio ============ */
const BONE_A=lin('#dfd0ab'),BONE_B=lin('#bf9f6a'),CORTEX=lin('#f2ead8'),MARROW=lin('#c38f4e'),SPONGY=lin('#dcc08e');
const SECTION={femore:{c:[0,-0.3],sx:1.1,sz:0.9,r:1.3,m:0.6},tibia:{c:[0,-0.3],sx:1.1,sz:0.85,r:1.3,m:0.58},perone:{c:[-2.9,-1.0],sx:1,sz:1,r:0.5,m:0.42}};
function finishGeo(s,g){
  const pos=g.attributes.position,nor=g.attributes.normal,n=pos.count;
  let col=g.attributes.color;
  if(!col){col=new THREE.BufferAttribute(new Float32Array(n*3).fill(1),3);g.setAttribute('color',col);}
  const tag=g.userData.tag;
  if(s.cat==='ossa'&&tag){
    const TH={femore:0.55,tibia:0.48,perone:0.22}[s.id]||0.4;
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let c;
      if(tag[i]>=10){const d=(tag[i]-10)/100;
        if(d<TH-0.05)c=CORTEX.clone().multiplyScalar(0.96+0.06*fbm(x*9,z*9,4));
        else if(d<TH+0.08)c=CORTEX.clone().lerp(SPONGY,sstep(TH-0.05,TH+0.08,d));
        else c=MARROW.clone().lerp(SPONGY,0.35*fbm(x*5,z*5,2)).multiplyScalar(0.8+0.3*fbm(x*10,z*10,1));
      }else{
        const ny=nor.getY(i);const dd=(fbm(x*1.3,y*1.3,z*1.3)-0.5)*0.025+(fbm(x*6,y*6,z*6)-0.5)*0.006;
        pos.setXYZ(i,x+nor.getX(i)*dd,y+ny*dd,z+nor.getZ(i)*dd);
        c=BONE_A.clone().lerp(BONE_B,sstep(0.45,0.8,fbm(x*.6+3,y*.6,z*.6))*0.55).multiplyScalar(0.93+0.08*fbm(x*4,y*4,z*4));
      }
      col.setXYZ(i,c.r,c.g,c.b);}
    g.computeVertexNormals();
  }else if(s.cat==='mus'&&tag){
    const belly=lin(MCOL[s.id]||'#9e3e37').multiplyScalar(0.62).lerp(lin('#6b2a22'),0.18);const seed=s.id.length*7.3;
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let c;
      if(tag[i]===250)c=CUTM.clone().multiplyScalar(0.85+0.3*fbm(x*6,z*6,seed));
      else if(tag[i]===251)c=CUTT.clone();
      else{const tw=sstep(0.25,0.75,tag[i]/200);c=belly.clone().lerp(TENDON,tw).multiplyScalar(0.86+0.22*fbm(x*1.7+seed,y*0.6,z*1.7));}
      col.setXYZ(i,c.r,c.g,c.b);}
  }else if(s.cat==='ossa'){
    const sec=SECTION[s.id];
    for(let i=0;i<n;i++){
      const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),ny=nor.getY(i);let c;
      if(sec&&Math.abs(y)>20.15&&Math.abs(ny)>0.6){
        const q=Math.hypot((x-sec.c[0])/sec.sx,(z-sec.c[1])/sec.sz)/sec.r;
        if(q<sec.m)c=MARROW.clone().multiplyScalar(0.8+0.35*fbm(x*8,z*8,1));
        else if(q<sec.m+0.1)c=SPONGY.clone().lerp(MARROW,0.5*fbm(x*12,z*12,2));
        else c=CORTEX.clone();
      }else{
        const d=(fbm(x*1.3,y*1.3,z*1.3)-0.5)*0.035+(fbm(x*6,y*6,z*6)-0.5)*0.006+(s.id==='rotula'&&z>3.8?Math.sin(x*11+fbm(x,y*3,z)*3)*0.005:0);
        pos.setXYZ(i,x+nor.getX(i)*d,y+ny*d,z+nor.getZ(i)*d);
        c=BONE_A.clone().lerp(BONE_B,sstep(0.45,0.8,fbm(x*.6+3,y*.6,z*.6))*0.55).multiplyScalar(0.93+0.08*fbm(x*4,y*4,z*4));
      }
      col.setXYZ(i,c.r,c.g,c.b);
    }
    g.computeVertexNormals();
  }else if(s.cat==='adi'){
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);const d=(fbm(x*2.8,y*2.8,z*2.8)-0.5)*0.24;
      pos.setXYZ(i,x+nor.getX(i)*d,y+nor.getY(i)*d,z+nor.getZ(i)*d);const k=0.82+0.3*fbm(x*4,y*4,z*4);col.setXYZ(i,k,k,k);}
    g.computeVertexNormals();
  }else if(g.userData.nets||s.cat==='bor'){
    for(let i=0;i<n;i++){const k=0.95+0.07*fbm(pos.getX(i)*3,pos.getY(i)*3,pos.getZ(i)*3);col.setXYZ(i,k,k,k);}
  }
  return g;
}

/* ============ Occlusione ambientale precalcolata ============ */
function bakeAO(items){
  const O=[-8.5,-21.5,-9.5],VS=0.2,NX=86,NY=216,NZ=86,NXY=NX*NY;
  const gD=new Uint8Array(NXY*NZ),gA=new Uint8Array(NXY*NZ);
  const vid=(x,y,z)=>{const i=((x-O[0])/VS)|0,j=((y-O[1])/VS)|0,k=((z-O[2])/VS)|0;return(i<0||j<0||k<0||i>=NX||j>=NY||k>=NZ)?-1:i+NX*j+NXY*k;};
  const SKIP=new Set(['caps','cute','bor']),DEEP=new Set(['ossa','cart','men','leg']);
  items.forEach(({s,g})=>{if(SKIP.has(s.cat))return;const deep=DEEP.has(s.cat);const p=g.attributes.position.array,ix=g.index.array;
    for(let t=0;t<ix.length;t+=3){const a=3*ix[t],b=3*ix[t+1],c=3*ix[t+2];
      const L=Math.max(Math.hypot(p[a]-p[b],p[a+1]-p[b+1],p[a+2]-p[b+2]),Math.hypot(p[a]-p[c],p[a+1]-p[c+1],p[a+2]-p[c+2]),Math.hypot(p[b]-p[c],p[b+1]-p[c+1],p[b+2]-p[c+2]));
      const m=Math.max(1,Math.ceil(L/0.15));
      for(let u=0;u<=m;u++)for(let v=0;v<=m-u;v++){const w=m-u-v;
        const id=vid((p[a]*u+p[b]*v+p[c]*w)/m,(p[a+1]*u+p[b+1]*v+p[c+1]*w)/m,(p[a+2]*u+p[b+2]*v+p[c+2]*w)/m);
        if(id>=0){gA[id]=1;if(deep)gD[id]=1;}}}});
  const dil=G=>{const H=G.slice();for(let id=0;id<G.length;id++)if(G[id]){if(id>0)H[id-1]=1;if(id+1<G.length)H[id+1]=1;if(id>=NX)H[id-NX]=1;if(id+NX<G.length)H[id+NX]=1;if(id>=NXY)H[id-NXY]=1;if(id+NXY<G.length)H[id+NXY]=1;}return H;};
  const GD=dil(gD),GA=dil(gA);
  const DIRS=[];const K=18;for(let i=0;i<K;i++){const y=1-2*(i+0.5)/K,r=Math.sqrt(1-y*y),ph=i*2.39996;DIRS.push([Math.cos(ph)*r,y,Math.sin(ph)*r]);}
  const STEPS=[0.25,0.5,0.8,1.2,1.7,2.4,3.3];
  items.forEach(({s,g})=>{if(SKIP.has(s.cat))return;const G=DEEP.has(s.cat)?GD:GA;
    const p=g.attributes.position.array,nm=g.attributes.normal.array,n=p.length/3,ao=new Float32Array(n);
    for(let i=0;i<n;i++){const px=p[3*i],py=p[3*i+1],pz=p[3*i+2],nx=nm[3*i],ny=nm[3*i+1],nz=nm[3*i+2];
      const ox=px+nx*0.32,oy=py+ny*0.32,oz=pz+nz*0.32;let occ=0,tot=0;
      for(const d of DIRS){const c=d[0]*nx+d[1]*ny+d[2]*nz;if(c<0.15)continue;tot+=c;
        for(const st of STEPS){const id=vid(ox+d[0]*st,oy+d[1]*st,oz+d[2]*st);if(id>=0&&G[id]){occ+=c*(1-st/4.2);break;}}}
      ao[i]=tot>0?1-occ/tot:1;}
    const ix=g.index.array;
    for(let pass=0;pass<2;pass++){const sum=new Float32Array(n),cnt=new Float32Array(n);
      for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2];sum[a]+=ao[b]+ao[c];sum[b]+=ao[a]+ao[c];sum[c]+=ao[a]+ao[b];cnt[a]+=2;cnt[b]+=2;cnt[c]+=2;}
      for(let i=0;i<n;i++)ao[i]=(ao[i]*2+sum[i])/(2+cnt[i]);}
    const col=g.attributes.color;
    for(let i=0;i<n;i++){const f=0.28+0.72*Math.pow(clamp(ao[i],0,1),1.25);col.setXYZ(i,col.getX(i)*f,col.getY(i)*f,col.getZ(i)*f);}
    col.needsUpdate=true;});
}

}
card.querySelector('.x').addEventListener('click',()=>select(null));
document.getElementById('cHide').addEventListener('click',()=>{if(!selected)return;const L=pesOn?PES.ids.map(id=>byId[id]):[selected];select(null);L.forEach(s=>setVis(s,false));sync();});
/* Isola con le ossa / Ripristina vista: la visibilità di prima è salvata e tornare indietro è un secondo tap sullo stesso pulsante.
   Qualunque altro cambio di visibilità (elenco, categorie, Mostra tutto, Solo ossa, regioni) annulla il ripristino. */
var isoPrev=null,isoBusy=false;const bIso=document.getElementById('cIso');
function isoLbl(){bIso.textContent=isoPrev?'Ripristina vista':'Isola con le ossa';bIso.setAttribute('aria-pressed',!!isoPrev);}
function isola(keep){if(!isoPrev)isoPrev={vis:new Map(S.map(s=>[s,s.visible])),sel:selected&&selected.id};isoBusy=true;S.forEach(s=>setVis(s,keep(s)));isoBusy=false;isoLbl();sync();}
function ripristina(){const p=isoPrev;isoPrev=null;isoBusy=true;p.vis.forEach((v,s)=>setVis(s,v));isoBusy=false;isoLbl();sync();if(!selected&&p.sel&&byId[p.sel]&&byId[p.sel].visible)select(p.sel);}
bIso.addEventListener('click',()=>{if(isoPrev){ripristina();return;}if(!selected)return;const K=pesOn?PES.ids:[selected.id];isola(s=>K.includes(s.id)||s.cat==='ossa');});

/* ============ Pannello ============ */
function setVis(s,v){if(isoPrev&&!isoBusy){isoPrev=null;isoLbl();}s.visible=v;if(s.group)s.group.visible=v;if(!v&&selected===s)select(null);}
const chipsEl=document.getElementById('chips'),listEl=document.getElementById('list');
/* rotellina del mouse = scorrimento orizzontale delle categorie, se la riga eccede */
chipsEl.addEventListener('wheel',e=>{if(chipsEl.scrollWidth>chipsEl.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){chipsEl.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
CATS.forEach(c=>{
  const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',c.color);b.dataset.cat=c.id;b.innerHTML='<span class="dot"></span>'+c.name;
  b.addEventListener('click',()=>{const it=S.filter(s=>s.cat===c.id);const any=it.some(s=>s.visible);it.forEach(s=>setVis(s,!any));sync();});
  chipsEl.appendChild(b);
  const g=document.createElement('div');g.className='grp';g.style.setProperty('--c',c.color);g.innerHTML='<h3><span class="dot"></span>'+c.name+'</h3>';
  S.filter(s=>s.cat===c.id).forEach(s=>{
    const row=document.createElement('div');row.className='item';const id='chk-'+s.id;
    row.innerHTML='<input type="checkbox" id="'+id+'"><label for="'+id+'">'+s.name+'</label><button class="go">Scheda</button>';
    row.querySelector('.go').setAttribute('aria-label','Scheda: '+s.name);
    row.querySelector('input').addEventListener('change',e=>{setVis(s,e.target.checked);sync();});
    row.querySelector('.go').addEventListener('click',()=>{setVis(s,true);sync();select(s.id);});
    s.chk=row.querySelector('input');g.appendChild(row);
  });
  listEl.appendChild(g);
});
/* smartphone: categorie su 3 righe compatte (senza buchi), scorrevoli in orizzontale: la larghezza minima che le tiene su 3 righe */
(()=>{const mq=matchMedia('(max-width:600px)'),inn=document.createElement('div');inn.className='chips-in';inn.append(...chipsEl.children);chipsEl.appendChild(inn);
const fit=()=>{inn.style.width='';const cw=chipsEl.clientWidth,ch=[...inn.children];if(!mq.matches||!cw||!ch.length)return;
  const g=parseFloat(getComputedStyle(inn).columnGap)||0,max=3*ch[0].offsetHeight+2*g+1;if(inn.offsetHeight<=max)return;
  let w=Math.max(cw,Math.ceil(ch.reduce((a,c)=>a+c.offsetWidth+g,0)/3));
  for(let i=0;i<300;i++){inn.style.width=w+'px';if(inn.offsetHeight<=max)break;w+=6;}};
new ResizeObserver(fit).observe(chipsEl);mq.addEventListener('change',fit);})();
S.forEach(s=>{s.visible=!hiddenDefault(s);});
function sync(){
  CATS.forEach(c=>{const it=S.filter(s=>s.cat===c.id),n=it.filter(s=>s.visible).length;chipsEl.querySelector('[data-cat="'+c.id+'"]').dataset.state=n===0?'off':n===it.length?'on':'part';});
  S.forEach(s=>{s.chk.checked=s.visible;});
}
sync();
document.getElementById('bAll').addEventListener('click',()=>{S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();});
document.getElementById('bBones').addEventListener('click',()=>{S.forEach(s=>setVis(s,s.cat==='ossa'));sync();});
const bT=document.getElementById('bTransp');let transp=false;
bT.addEventListener('click',()=>{transp=!transp;bT.setAttribute('aria-pressed',transp);
  S.forEach(s=>{if((s.cat==='mus'||s.cat==='adi')&&s.mat){const m=s.mat;m.transparent=transp||m.userData.baseTransparent;m.opacity=transp?0.32:m.userData.baseOpacity;m.depthWrite=transp?false:m.userData.baseDepthWrite;m.needsUpdate=true;
    s.group.children.forEach(o=>{o.castShadow=!transp;});}});});
const sheet=document.getElementById('sheet'),bL=document.getElementById('bList');
bL.addEventListener('click',()=>{const o=sheet.classList.toggle('open');bL.setAttribute('aria-expanded',o);bL.textContent=o?'Chiudi elenco':'Elenco';setTimeout(measure,280);});
function measure(){document.documentElement.style.setProperty('--sheetH',(innerWidth>=900?0:sheet.offsetHeight)+'px');}
addEventListener('resize',measure);measure();
/* smartphone: pannello richiudibile dalla linguetta; chiuso all'avvio, si chiude quando si apre una card */
const compact=matchMedia('(max-width:600px),(orientation:landscape) and (max-height:500px)'),bS=document.getElementById('bSheet');
function setSheet(o){sheet.classList.toggle('collapsed',!o);bS.setAttribute('aria-expanded',o);}
let sw=null,swDone=false;
bS.addEventListener('click',()=>{if(swDone){swDone=false;return;}const o=sheet.classList.contains('collapsed');if(o&&!card.hidden)select(null);setSheet(o);});
/* swipe verso il basso dall'intestazione "Strutture" chiude il pannello */
bS.addEventListener('pointerdown',e=>{swDone=false;sw=compact.matches&&!sheet.classList.contains('collapsed')?{id:e.pointerId,x:e.clientX,y:e.clientY}:null;});
bS.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dy=e.clientY-sw.y;if(dy>28&&dy>Math.abs(e.clientX-sw.x)){sw=null;swDone=true;setSheet(false);}});
bS.addEventListener('pointerup',()=>{sw=null;});bS.addEventListener('pointercancel',()=>{sw=null;});
new MutationObserver(()=>{if(!card.hidden&&compact.matches)setSheet(false);}).observe(card,{attributes:true,attributeFilter:['hidden']});
compact.addEventListener('change',e=>{if(e.matches)setSheet(false);});



/* ============ Zampa d'oca ============ */
/* clic sul tratto tendineo distale (sotto y = yMax, circa 3,5 cm sopra l'interlinea) di sartorio, gracile o semitendinoso:
   scheda comune della zampa d'oca, con i tre tendini evidenziati; Isola e Nascondi agiscono su tutti e tre */
const PES={ids:['sart','grac','semit'],yMax:2.5,name:"Zampa d'oca (pes anserinus)",info:"Sartorio, gracile e semitendinoso formano insieme la zampa d'oca: inserzione comune dei tre tendini sulla faccia anteromediale della tibia prossimale, circa 4 cm sotto l'interlinea, medialmente alla tuberosità tibiale. Si trova superficialmente all'inserzione tibiale del LCM; tra tendini e LCM/tibia è interposta la borsa anserina.",o:"Sartorio: spina iliaca anteriore superiore. Gracile: corpo del pube e branca ischio-pubica. Semitendinoso: tuberosità ischiatica.",ins:"Faccia antero-mediale della tibia prossimale, dall'avanti all'indietro: sartorio, gracile, semitendinoso.",fn:"Flessione del ginocchio e rotazione interna della tibia; stabilizzazione dinamica mediale contro valgo e rotazione esterna."};
let extraHL=[],pesOn=false;
function selectPes(){
  select(PES.ids[0]);pesOn=true;
  PES.ids.forEach(id=>{const s=byId[id];if(s&&s.mat&&s!==selected){s.mat.emissive.setHex(0x3b3a14);extraHL.push(s.mat);}});
  document.getElementById('cName').textContent=PES.name;fillInfo(PES);
}
/* ============ Loop e costruzione ============ */
let building=true,lastR=0;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function loop(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/650),k=ease(t);
    cam.theta=anim.from.theta+(anim.to.theta-anim.from.theta)*k;cam.phi=anim.from.phi+(anim.to.phi-anim.from.phi)*k;cam.r=anim.from.r+(anim.to.r-anim.from.r)*k;cam.target.lerpVectors(anim.from.tg,anim.to.tg,k);if(t>=1)anim=null;}
  updateCam();if(!building||now-lastR>250){renderer.render(scene,camera);lastR=now;}requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
(async function(){
  const bar=document.getElementById('loadBar'),txt=document.getElementById('loadTxt');
  BP=await loadBP();
  for(let i=0;i<S.length;i++){
    try{buildStruct(S[i]);}catch(err){console.error(S[i].id,err);}
    bar.style.width=Math.round((i+1)/S.length*85)+'%';txt.textContent='Costruzione del modello… '+(i+1)+'/'+S.length;
    await new Promise(r=>setTimeout(r,0));
  }
  txt.textContent='Calcolo di ombre e profondità…';await new Promise(r=>setTimeout(r,30));
  try{bakeAO(built);}catch(err){console.error(err);}
  bar.style.width='100%';building=false;document.getElementById('load').hidden=true;
  /* Ricerca dalla home: ID stabile, applicato solo a costruzione completata. */
  scene.updateMatrixWorld(true);
  const searchId=new URLSearchParams(location.search).get('struttura');
  const found=searchId&&S.find(s=>s.id===searchId);
  if(found&&found.group&&found.group.children.length){
    isola(s=>s===found||s.cat==='ossa');
    select(found.id);sync();
    const box=new THREE.Box3().setFromObject(found.group);
    const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
    const bones=new THREE.Box3();S.filter(s=>s.cat==='ossa'&&s.group).forEach(s=>bones.expandByObject(s.group));
    const boneCenter=bones.getCenter(new THREE.Vector3());
    const dx=center.x-boneCenter.x,dz=center.z-boneCenter.z;
    anim=null;cam.target.copy(center);cam.phi=0.12;
    if(Math.hypot(dx,dz)>0.4)cam.theta=Math.atan2(dx,dz);
    const fov=camera.fov*Math.PI/180;
    const fit=Math.max(size.y,size.x/Math.min(camera.aspect,1),size.z)*0.75/Math.tan(fov/2);
    cam.r=Math.max(cam.baseR*0.28,Math.min(cam.baseR*1.3,fit));
    clearViewPress();
    if(compact.matches)setSheet(false);
  }else if(searchId){
    const notice=document.createElement('p');notice.setAttribute('role','status');
    notice.textContent='Struttura non disponibile. Puoi cercarla nell’elenco.';
    notice.style.cssText='position:fixed;top:100px;left:20px;right:20px;z-index:30;padding:12px;border-radius:12px;background:var(--panel);color:var(--ink)';
    document.body.appendChild(notice);setTimeout(()=>notice.remove(),7000);
  }

})();
})();

</script>
</body>
