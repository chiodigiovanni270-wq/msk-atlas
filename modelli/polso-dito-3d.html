<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe4e9; --bg-hi:#f4f6f8; --bg-lo:#c9d0d7; --panel:#f8f9fa; --ink:#1c2632; --muted:#5a6876; --line:#cdd5dd; --accent:#2c6b8a; --shadow:0 6px 24px rgba(20,35,50,.14);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--bg-hi) 0%,var(--bg) 62%,var(--bg-lo) 100%);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.title{pointer-events:auto}
.title h1{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;margin:0}
.title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.views{display:flex;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.views button{border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:12.5px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.sect{display:inline-flex;gap:2px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:6px;box-shadow:var(--shadow)}
.sect button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.sect button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.views .flip{margin-left:2px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;font-size:15px;line-height:1;padding:6px 9px}
.views .flip[aria-pressed="true"],.views .flip[aria-pressed="false"]{background:transparent;color:var(--ink)}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:14px;pointer-events:none}
#load .bar{width:180px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#load[hidden]{display:none}

#card{position:fixed;left:12px;right:12px;bottom:calc(var(--sheetH,120px) + 10px);max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
#card[hidden]{display:none}
#card h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 28px 2px 0;line-height:1.2}
#card .cat{color:var(--muted);font-size:12.5px;margin:0 0 6px}
#card .info{margin:0 0 10px;line-height:1.45;font-size:14px;max-height:36vh;overflow:auto}
#card .info p{margin:0}
#card .oif{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:5px 10px;margin:0;font-size:13.5px}
#card .info p+.oif{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#card .oif dt{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#card .oif dd{margin:0}
#card .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}

#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:16px 16px 0 0}
.chips{padding-bottom:2px}.chips-in{display:flex;flex-wrap:wrap;gap:6px}  /* computer: a capo, senza scorrimento */
.regs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;align-items:center}
.regs::-webkit-scrollbar{display:none}
.regs .rl{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.regs button{flex:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.regs button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
#regNote{font-size:12.5px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:9px;padding:7px 9px;margin:0 0 7px}
#regNote[hidden],#clipBar[hidden]{display:none}
#clipBar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 7px}
#clipBar input{flex:1;accent-color:var(--accent)}
#clipV{min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px 6px 8px;font-size:13px;font-weight:500;white-space:nowrap}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
.chip[data-state="off"]{color:var(--muted)}
.chip[data-state="off"] .dot{background:transparent}
.chip[data-state="part"] .dot{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
/* smartphone: categorie su 3 righe compatte con scorrimento orizzontale (larghezza calcolata nello script) e chip compatti */
@media (max-width:600px){.chips{overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips-in{gap:5px}.chip{padding:4px 9px 4px 6px;gap:5px;font-size:12.5px}.chip .dot{width:10px;height:10px}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.row .left{display:flex;gap:6px;flex-wrap:wrap}
.toggle-list{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 2px;white-space:nowrap}
#list{max-height:0;overflow:auto;transition:max-height .25s ease}
#sheet.open #list{max-height:42vh;margin-top:6px}
.grp h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.grp h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.item{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.item input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.item label{flex:1}
.credit{font-size:11px;color:var(--muted);margin:8px 2px 0;line-height:1.35}
.item .go{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:2px 6px}
@media (min-width:900px){
  #sheet{left:auto;right:16px;bottom:16px;width:360px;border-radius:14px;border:1px solid var(--line)}
  #sheet.open #list{max-height:55vh}
  #card{left:16px;right:auto;bottom:16px;margin:0;width:400px}
}
@media (prefers-reduced-motion:reduce){#list{transition:none}}
.views .vtoggle{display:none}
@media (max-width:430px){
  .views{position:absolute;top:100%;right:14px;margin-top:6px}
  .views .vtoggle{display:flex;align-items:center;gap:6px}
  .views .vtoggle .vc{font-size:11px;opacity:.8}
  .views:not(.closed) .vtoggle .vl{display:none}
  .views:not(.closed) .vtoggle .vc{transform:rotate(180deg)}
  .views.closed button:not(.vtoggle){display:none}
}
/* ===== Smartphone: pannello richiudibile e card compatta ===== */
.sheet-tab{display:none}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  :root{--tabH:44px;--pillH:44px;--pillGap:12px}
  #sheet{left:0;right:0;bottom:0;width:auto;border:0;border-radius:0;
    padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));
    transition:transform .25s ease,visibility 0s}
  #sheet.collapsed{transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  .sheet-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;
    position:absolute;bottom:100%;left:0;right:0;width:100%;visibility:visible;
    height:var(--tabH);padding:0 22px;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    background:var(--panel);box-shadow:0 -4px 14px rgba(0,0,0,.3);font-size:13.5px;font-weight:600;white-space:nowrap}
  /* chiuso: pulsante ovale fluttuante, staccato dal bordo inferiore: sotto e ai lati si vede lo sfondo */
  #sheet.collapsed .sheet-tab{flex-direction:row;left:50%;right:auto;width:auto;transform:translateX(-50%);
    bottom:calc(100% + var(--pillGap) + env(safe-area-inset-bottom,0px));height:var(--pillH);padding:0 18px;
    border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
    background:rgba(30,38,47,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #sheet.collapsed .sheet-tab .grip{display:none}
  .sheet-tab .grip{width:32px;height:4px;border-radius:2px;background:var(--line)}
  .sheet-tab .car{display:inline-block;color:var(--accent);transition:transform .25s}
  #sheet:not(.collapsed) .sheet-tab .car{transform:rotate(180deg)}
  .sheet-body{max-height:60vh;max-height:60dvh;overflow-y:auto;overscroll-behavior:contain;padding-top:10px}
  #sheet.open #list{max-height:none}  /* un solo scorrimento: quello del pannello */
  #card{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;margin:0 auto;
    bottom:calc(var(--pillH) + var(--pillGap) + env(safe-area-inset-bottom,0px) + 10px);padding:9px 12px 10px;
    max-height:35vh;max-height:35dvh;display:flex;flex-direction:column}
  #card h2{font-size:17px}
  #card .cat{margin-bottom:4px}
  #card h2,#card .cat,#card .btns{flex:none}
  #card .info{flex:1 1 auto;min-height:0;max-height:none;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){#sheet,.sheet-tab,.sheet-tab .car{transition:none}}
/* ===== Vetro (stile "liquid glass"): barra viste, selettore sezione, card e pannello strutture =====
   Identico in tutti i modelli. Superfici semitrasparenti con sfocatura dello sfondo, bordo chiaro sottile
   e riflesso in alto. Gli elementi interni usano solo riempimenti trasparenti (niente backdrop-filter annidati). */
:root{--glass:rgba(248,249,250,.62);--glass-card:rgba(248,249,250,.8);--glass-bd:rgba(255,255,255,.7);--glass-fill:rgba(20,35,50,.05);--glass-fill-hi:rgba(20,35,50,.1);--glass-sep:rgba(20,35,50,.1);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.8);--glass-blur:blur(20px) saturate(170%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
    --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
}
:root[data-theme="dark"]{--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
.views,.sect,#card,#sheet{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.views,.sect{border-radius:999px;padding:3px}
.views button,.sect button{border-radius:999px;padding:6px 10px;transition:background-color .15s,color .15s}
.views button:not([aria-pressed="true"]):hover,.sect button:not([aria-selected="true"]):hover{background:var(--glass-fill-hi)}
.views .flip{border-left:1px solid var(--glass-sep);border-radius:0 999px 999px 0;padding:6px 11px 6px 9px}
.views .flip:hover{background:transparent}
#card{background:var(--glass-card);border-left:4px solid var(--c,#999);border-radius:16px}
#sheet{border-width:1px 0 0;border-radius:20px 20px 0 0}
/* computer: con l'elenco aperto il pannello non sale sotto la barra del sito e le viste; si accorcia l'elenco */
@media (min-width:900px){#sheet{border-width:1px;border-radius:20px;display:flex;flex-direction:column;
    max-height:calc(100vh - env(safe-area-inset-top,0px) - 136px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 136px)}
  .sheet-body{display:flex;flex-direction:column;min-height:0}
  .sheet-body>*{flex:none}.sheet-body>#list{flex:0 1 auto;min-height:0}}
.chip,.btn{background:var(--glass-fill);border-color:var(--glass-bd);transition:background-color .15s}
.chip:hover,.btn:not(.primary):not([aria-pressed="true"]):hover{background:var(--glass-fill-hi)}
.btn{border-radius:999px;padding:6px 12px}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.item{border-bottom-color:var(--glass-sep)}
#card .info p+.oif{border-top-color:var(--glass-sep)}
.regs button{background:var(--glass-fill)}
.regs button[aria-pressed="true"]{background:var(--accent)}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  /* aperto: pannello e intestazione formano un'unica lastra, un po' più piena perché l'intestazione,
     figlia del pannello sfocato, in Chrome non può sfocare a sua volta ciò che sta dietro */
  #sheet{background:var(--glass-card);border-width:0;border-radius:0}
  .sheet-tab{background:var(--glass-card);border-top:1px solid var(--glass-bd);border-radius:20px 20px 0 0;box-shadow:var(--glass-hl),0 -6px 18px rgba(0,0,0,.25);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  #sheet.collapsed .sheet-tab{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow)}
  #sheet.collapsed{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>
<canvas id="c" tabindex="0" aria-label="Modello 3D del polso: trascina per ruotare, pizzica per ingrandire, tocca una struttura per il dettaglio"></canvas>
<div id="load"><span id="loadTxt">Costruzione del modello…</span><div class="bar"><i id="loadBar"></i></div></div>

<div class="top">
  <div class="title">
    <h1>Polso destro</h1>
  </div>
  <nav class="views closed" aria-label="Vista">
    <button data-view="ant" aria-pressed="true">Volare</button>
    <button data-view="post" aria-pressed="false">Dorsale</button>
    <button data-view="lat" aria-pressed="false">Radiale</button>
    <button data-view="med" aria-pressed="false">Ulnare</button>
    <button class="flip" id="bFlip" aria-pressed="true" aria-label="Dita in alto o in basso" title="Dita in alto / in basso">⇅</button>
    <button class="vtoggle" id="bViews" aria-expanded="false" aria-label="Scegli la vista"><span class="vl">Vista</span><span class="vc" aria-hidden="true">▾</span></button>
  </nav>
</div>

<div id="card" hidden role="dialog" aria-live="polite">
  <button class="x" aria-label="Chiudi">×</button>
  <h2 id="cName"></h2>
  <p class="cat" id="cCat"></p>
  <div class="info" id="cInfo"></div>
  <div class="btns">
    <button class="btn primary" id="cIso">Isola con le ossa</button>
    <button class="btn" id="cHide">Nascondi</button>
  </div>
</div>

<section id="sheet" class="collapsed" aria-label="Strutture anatomiche">
  <button class="sheet-tab" id="bSheet" aria-expanded="false" aria-controls="sheetBody">
    <span class="grip" aria-hidden="true"></span>
    <span>Strutture <span class="car" aria-hidden="true">▴</span></span>
  </button>
  <div class="sheet-body" id="sheetBody">
  <div class="regs" id="regs" role="group" aria-label="Regioni anatomiche"><span class="rl">Regioni</span></div>
  <div id="regNote" hidden></div>
  <div id="clipBar" hidden><label for="clipR">Taglio</label><input type="range" id="clipR" step="0.05"><span id="clipV"></span></div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <div class="left">
      <button class="btn" id="bAll">Ripristina</button>
      <button class="btn" id="bBones">Solo ossa</button>
      <button class="btn" id="bTransp" aria-pressed="false">Muscoli trasparenti</button>
    </div>
    <button class="toggle-list" id="bList" aria-expanded="false">Elenco</button>
  </div>
  <div id="list"></div>
  <p class="credit"><b>Materiale didattico.</b> Non destinato a uso clinico o diagnostico.</p>

    if(fx*sx+fy*sy2+fz*sz2<0){I[t+1]=c;I[t+2]=b;}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.BufferAttribute(N,3));
  g.setIndex(new THREE.Uint32BufferAttribute(I,1));
  g.userData.nets=true;
  return g;
}

/* ============ Sweep ============ */
const CIRCLE=[];for(let j=0;j<16;j++){const a=j/16*Math.PI*2;CIRCLE.push([Math.cos(a),Math.sin(a)]);}
const MENSHAPE=[[1,-0.45],[1.08,0],[1,0.45],[0.6,0.42],[0.1,0.2],[-0.5,-0.05],[-1,-0.3],[-0.9,-0.45],[0,-0.45]];
const P=arr=>t=>{if(t<=arr[0][0])return arr[0][1];for(let i=1;i<arr.length;i++){if(t<=arr[i][0]){const a=arr[i-1],b=arr[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);}}return arr[arr.length-1][1];};
const fnv=x=>typeof x==='function'?x:()=>x;
function sweep(pts,o){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],p[2])),false,'centripetal');
  const L=curve.getLength(),Nseg=o.seg||Math.max(18,Math.min(160,Math.round(L*5)));
  const shape=o.shape||CIRCLE,M=shape.length,wf=fnv(o.w),hf=o.h?fnv(o.h):null,rf=fnv(o.ratio??1);
  const hasCol=!!o.colorFn;
  const pos=[],uv=[],col=[],idx=[],rings=[];let prevB=null;
  const pushV=(p,u,vv,c)=>{pos.push(p.x,p.y,p.z);uv.push(u,vv);if(hasCol)col.push(c.r,c.g,c.b);return pos.length/3-1;};
  for(let i=0;i<=Nseg;i++){
    const t=i/Nseg,p=curve.getPointAt(t),T=curve.getTangentAt(t).normalize();
    let B=null;
    if(o.wdir){const W=typeof o.wdir==='function'?o.wdir(p,t):V(o.wdir[0],o.wdir[1],o.wdir[2]);B=W.clone().addScaledVector(T,-W.dot(T));if(B.lengthSq()<1e-4)B=null;}
    if(!B){if(prevB)B=prevB.clone().addScaledVector(T,-prevB.dot(T));else B=new THREE.Vector3().crossVectors(T,Math.abs(T.y)<0.9?V(0,1,0):V(1,0,0));}
    B.normalize();prevB=B;const Nn=new THREE.Vector3().crossVectors(T,B).normalize();
    const w=wf(t),h=hf?hf(t):w*rf(t),c=hasCol?o.colorFn(t):null;const ring=[];
    for(let j=0;j<=M;j++){const s=shape[j%M];ring.push(pushV(V(p.x+B.x*s[0]*w+Nn.x*s[1]*h,p.y+B.y*s[0]*w+Nn.y*s[1]*h,p.z+B.z*s[0]*w+Nn.z*s[1]*h),j/M*(o.urep||1),t*L*0.25,c));}
    rings.push({p,T,B,Nn,ring,t,w,h});
  }
  const vp=i=>V(pos[3*i],pos[3*i+1],pos[3*i+2]);
  const tri=(a,b,c,out)=>{const A=vp(a),Bv=vp(b),Cv=vp(c);const n=new THREE.Vector3().subVectors(Bv,A).cross(new THREE.Vector3().subVectors(Cv,A));if(n.dot(out)<0)idx.push(a,c,b);else idx.push(a,b,c);};
  for(let i=0;i<Nseg;i++){const r0=rings[i],r1=rings[i+1];
    for(let j=0;j<M;j++){const a=r0.ring[j],b=r0.ring[j+1],c=r1.ring[j],d=r1.ring[j+1];
      const out=vp(a).sub(r0.p);tri(a,c,b,out);tri(b,c,d,out);}}
  [[rings[0],-1],[rings[Nseg],1]].forEach(([r,sg])=>{
    let cc=null;if(hasCol)cc=(o.capColorFn&&o.capColorFn(r.p,r.t))||o.colorFn(r.t);
    const vv=r.t*L*0.25;const ctr=pushV(r.p,0.5,vv,cc);const cp=[];
    for(let j=0;j<M;j++){const s=shape[j];cp.push(pushV(vp(r.ring[j]),0.5+s[0]*0.08,vv+s[1]*0.08,cc));}
    const out=r.T.clone().multiplyScalar(sg);for(let j=0;j<M;j++)tri(ctr,cp[j],cp[(j+1)%M],out);
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(hasCol)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  const nr=g.attributes.normal;
  rings.forEach(r=>{const a=r.ring[0],b=r.ring[M];const x=nr.getX(a)+nr.getX(b),y=nr.getY(a)+nr.getY(b),z=nr.getZ(a)+nr.getZ(b);const l=Math.hypot(x,y,z)||1;nr.setXYZ(a,x/l,y/l,z/l);nr.setXYZ(b,x/l,y/l,z/l);});
  return g;
}
function ellGeo(c,r){return new THREE.SphereGeometry(1,40,24).scale(r[0],r[1],r[2]).translate(c[0],c[1],c[2]);}

/* muscolo: ventre con lievi irregolarità, tendine argenteo, sezione di taglio scura */
const TENDON=lin('#e3ddcd'),CUTM=lin('#5e1914'),CUTT=lin('#d9ceb6');
function muscle(pts,wp,o={}){
  const belly=lin(o.col||'#a33f37').multiplyScalar(0.62).lerp(lin('#6b2a22'),0.18);const ranges=o.tendon||[];
  const seed=Math.abs(pts[0][0]*13.1+pts[0][1]*7.7+pts[0][2]*3.3)%50;
  const tw=t=>{let m=0;for(const [a,b] of ranges){m=Math.max(m,sstep(a-0.035,a+0.01,t)*(1-sstep(b-0.01,b+0.035,t)));}return m;};
  const base=P(wp),rat=o.ratio??0.75;
  const w=t=>base(t)*(1+0.16*(vnoise(t*6+seed,seed,1.3)-0.5)*(1-tw(t)));
  const r=t=>rat*(1+0.22*(vnoise(t*4+seed,2.1,seed)-0.5)*(1-tw(t)));
  return sweep(pts,{w,ratio:r,wdir:o.wdir,urep:1.5,
    colorFn:t=>{const c=belly.clone().lerp(TENDON,tw(t));return c.multiplyScalar(0.88+0.22*vnoise(t*9+seed,seed*.5,4.2));},
    capColorFn:(p,t)=>Math.abs(p.y)>19.7?(tw(t)>0.5?CUTT:CUTM):null});
}
const tube=(pts,r,o={})=>{
  if(!o.ini&&!o.fin&&!o.piatto&&!o.cal)return sweep(pts,Object.assign({w:r,urep:2},o));
  /* nervi: origine (ini) e fine (fin) assottigliate [raggio relativo, lunghezza in cm]; piatto = [[t, rapporto]] a sezione costante;
     vene: cal = [[t, calibro relativo]] lungo il decorso (aumenta a ogni confluenza), fin con rapporto > 1 = sbocco svasato */
  const L=new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],p[2])),false,'centripetal').getLength(),rt=o.piatto?P(o.piatto):()=>1,cf=o.cal?P(o.cal):()=>1;
  const k=t=>{const s=t*L;let f=1;if(o.ini)f*=o.ini[0]+(1-o.ini[0])*sstep(0,o.ini[1],s);if(o.fin)f*=o.fin[0]+(1-o.fin[0])*sstep(0,o.fin[1],L-s);return f;};
  return sweep(pts,Object.assign({urep:2},o,{w:t=>r*cf(t)*k(t)/Math.sqrt(rt(t)),ratio:rt}));
};
const band=(pts,w,ratio,wdir,o={})=>sweep(pts,Object.assign({w,ratio,wdir,urep:2},o));
function arc(c,rx,rz,a0,a1,n=26){const out=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;out.push([c[0]+rx*Math.cos(a),c[1],c[2]+rz*Math.sin(a)]);}return out;}
function meniscus(c,rx,rz,a0,a1,wp,hp){
  return sweep(arc(c,rx,rz,a0,a1),{shape:MENSHAPE,w:P(wp),h:P(hp),urep:3,wdir:p=>V(p.x-c[0],0,p.z-c[2]).normalize(),seg:90});
}

{id:'fcu',cat:'fless',name:"Flessore ulnare del carpo (FCU)",info:"Il pisiforme è un sesamoide nel suo tendine; nervo e arteria ulnari decorrono sotto e radialmente al tendine.",o:"Capo omerale: epicondilo mediale. Capo ulnare: olecrano e margine posteriore dell’ulna.",ins:"Pisiforme e, tramite i legamenti piso-uncinato e piso-metacarpale, uncinato e base del V metacarpo.",fn:"Flette il polso e lo adduce (deviazione ulnare).",b:()=>[REAL('fcu')]},
{id:'fds',cat:'fless',name:"Flessore superficiale delle dita (FDS)",info:"Quattro tendini nel tunnel carpale, su due strati: III e IV superficiali, II e V profondi.",o:"Capo omero-ulnare: epicondilo mediale e processo coronoideo. Capo radiale: faccia anteriore del radio.",ins:"Ai lati della falange intermedia del II–V dito (chiasma di Camper).",fn:"Flette le IFP e, secondariamente, MCF e polso.",b:()=>[REAL('fds')]},
{id:'fdp',cat:'fless',name:"Flessore profondo delle dita (FDP)",info:"Sul pavimento del tunnel carpale; nel palmo dà origine ai lombricali. II–III dito innervati dall’interosseo anteriore (mediano), IV–V dall’ulnare. L’avulsione distale è il jersey finger.",o:"Faccia anteriore e mediale dell’ulna e membrana interossea.",ins:"Base volare della falange distale del II–V dito.",fn:"Flette le IFD e, secondariamente, IFP, MCF e polso.",b:()=>[REAL('fdp')]},
{id:'fpl',cat:'fless',name:"Flessore lungo del pollice (FPL)",info:"Il tendine più radiale del tunnel carpale, nella propria guaina (borsa radiale).",o:"Faccia anteriore del radio e membrana interossea.",ins:"Base volare della falange distale del pollice.",fn:"Flette la IF del pollice e, secondariamente, la MCF.",b:()=>[REAL('fpl')]},
{id:'pq',cat:'fless',name:"Pronatore quadrato",info:"Il muscolo più profondo dell’avambraccio volare. Si ferma poco prossimalmente alla watershed line; il grasso sovrastante (spazio di Parona) si oblitera nelle fratture occulte del radio distale.",o:"Quarto distale della faccia volare dell’ulna.",ins:"Quarto distale della faccia volare del radio, fino al margine anteriore.",fn:"Principale pronatore dell’avambraccio; stabilizza la radio-ulnare distale.",b:()=>[REAL('pq')]},
{id:'adipq',cat:'adi',name:"Cuscinetto adiposo del pronatore quadrato",info:"Sottile strato adiposo tra pronatore quadrato e flessori profondi (spazio di Parona). Nella radiografia laterale lo spostamento o la scomparsa della stria adiposa indica edema o ematoma, per esempio in una frattura occulta del radio distale (segno indiretto, di accuratezza limitata).",b:()=>[REAL('adipq')]},
{id:'br',cat:'est',name:"Brachioradiale",info:"Flessore del gomito pur essendo innervato dal radiale. Il ramo superficiale del nervo radiale emerge sotto il suo margine.",o:"Cresta sopracondiloidea laterale dell’omero.",ins:"Base dello stiloide radiale.",fn:"Flette il gomito, soprattutto in semipronazione.",b:()=>[REAL('br')]},
{id:'ecrl',cat:'est',name:"Estensore radiale lungo del carpo (ECRL)",info:"II compartimento. 4–8 cm sopra il polso è incrociato da APL ed EPB: sindrome da intersezione.",o:"Terzo distale della cresta sopracondiloidea laterale dell’omero.",ins:"Base del II metacarpo (faccia dorsale).",fn:"Estende il polso e lo abduce (deviazione radiale).",b:()=>[REAL('ecrl')]},
{id:'ecrb',cat:'est',name:"Estensore radiale breve del carpo (ECRB)",info:"II compartimento, radiale al tubercolo di Lister. La sua origine è la sede principale dell’epicondilite laterale.",o:"Epicondilo laterale dell’omero (tendine comune degli estensori).",ins:"Base del III metacarpo (faccia dorsale).",fn:"Estende il polso.",b:()=>[REAL('ecrb')]},
{id:'apl',cat:'est',name:"Abduttore lungo del pollice (APL)",info:"I compartimento, spesso con più bandellette. Con l’EPB: tenosinovite di De Quervain (talora con setto intracompartimentale) e limite volare della tabacchiera.",o:"Faccia posteriore di radio e ulna e membrana interossea.",ins:"Base del I metacarpo (lato radiale).",fn:"Abduce ed estende il pollice alla trapezio-metacarpale.",b:()=>[REAL('apl')]},
{id:'epb',cat:'est',name:"Estensore breve del pollice (EPB)",info:"I compartimento, dorsale all’APL; limite volare della tabacchiera anatomica.",o:"Faccia posteriore del radio e membrana interossea.",ins:"Base dorsale della falange prossimale del pollice.",fn:"Estende la MCF del pollice.",b:()=>[REAL('epb')]},
{id:'epl',cat:'est',name:"Estensore lungo del pollice (EPL)",info:"III compartimento: usa il tubercolo di Lister come puleggia. Rottura tardiva dopo frattura del radio distale, anche composta. Limite dorsale della tabacchiera.",o:"Faccia posteriore dell’ulna e membrana interossea.",ins:"Base dorsale della falange distale del pollice.",fn:"Estende la IF del pollice; lo adduce e lo retropone.",b:()=>[REAL('epl')]},
{id:'edc',cat:'est',name:"Estensore comune delle dita (EDC)",info:"IV compartimento con l’EIP; il nervo interosseo posteriore ne percorre il pavimento. I tendini sono uniti dalle juncturae tendinum.",o:"Epicondilo laterale dell’omero (tendine comune degli estensori).",ins:"Apparato estensore del II–V dito (falangi intermedia e distale).",fn:"Estende le dita e il polso.",b:()=>[REAL('edc')]},
{id:'eip',cat:'est',name:"Estensore proprio dell’indice (EIP)",info:"IV compartimento, profondo all’EDC; alla MCF è ulnare al tendine dell’EDC per l’indice. Usato per il transfer dopo rottura dell’EPL.",o:"Faccia posteriore dell’ulna distale e membrana interossea.",ins:"Apparato estensore dell’indice.",fn:"Estende l’indice in modo indipendente.",b:()=>[REAL('eip')]},
{id:'edm',cat:'est',name:"Estensore proprio del mignolo (EDM)",info:"V compartimento, sopra la radio-ulnare distale; spesso bifido. Nell’artrite reumatoide è il primo a rompersi sulla testa ulnare (Vaughan-Jackson).",o:"Epicondilo laterale dell’omero (tendine comune degli estensori).",ins:"Apparato estensore del mignolo.",fn:"Estende il mignolo.",b:()=>[REAL('edm')]},
{id:'ecu',cat:'est',name:"Estensore ulnare del carpo (ECU)",info:"VI compartimento, nel solco dell’ulna, con una sottoguaina propria che contribuisce alla stabilità del TFCC. Sublussazione valutabile in ecografia dinamica in supinazione.",o:"Epicondilo laterale e margine posteriore dell’ulna.",ins:"Base del V metacarpo (lato ulnare).",fn:"Estende il polso e lo adduce (deviazione ulnare).",b:()=>[REAL('ecu')]},
{id:'apb',cat:'mano',name:"Abduttore breve del pollice",info:"Il tenare più superficiale (ramo motorio del mediano). L’ipotrofia è un segno tardivo della sindrome del tunnel carpale.",o:"Retinacolo dei flessori, scafoide e trapezio.",ins:"Base della falange prossimale del pollice (lato radiale).",fn:"Abduce il pollice; partecipa all’opposizione.",b:()=>[REAL('apb')]},
{id:'fpb',cat:'mano',name:"Flessore breve del pollice",info:"Capo superficiale innervato dal mediano, profondo dall’ulnare (variabile).",o:"Capo superficiale: retinacolo dei flessori e trapezio. Capo profondo: trapezoide e capitato.",ins:"Base della falange prossimale del pollice (lato radiale).",fn:"Flette la MCF del pollice.",b:()=>[REAL('fpb')]},
{id:'op',cat:'mano',name:"Opponente del pollice",info:"Profondo all’abduttore breve (ramo motorio del mediano).",o:"Retinacolo dei flessori e tubercolo del trapezio.",ins:"Margine radiale del I metacarpo.",fn:"Oppone il pollice.",b:()=>[REAL('op')]},
{id:'add',cat:'mano',name:"Adduttore del pollice",info:"Profondo, nel primo spazio (ramo profondo dell’ulnare). Tra i due capi passa l’arteria radiale; la sua aponeurosi si interpone nella lesione di Stener.",o:"Capo obliquo: capitato e basi del II–III metacarpo. Capo trasverso: III metacarpo.",ins:"Base della falange prossimale del pollice (lato ulnare).",fn:"Adduce il pollice; stabilizza la pinza pollice-indice.",b:()=>[REAL('add')]},
{id:'adm',cat:'mano',name:"Abduttore del mignolo",info:"Il più ulnare e superficiale degli ipotenari (ramo profondo dell’ulnare).",o:"Pisiforme e tendine del FCU.",ins:"Base della falange prossimale del mignolo (lato ulnare).",fn:"Abduce il mignolo.",b:()=>[REAL('adm')]},
{id:'fdm',cat:'mano',name:"Flessore breve del mignolo",info:"Ipotenare, radiale all’abduttore (ramo profondo dell’ulnare).",o:"Uncino dell’uncinato e retinacolo dei flessori.",ins:"Base della falange prossimale del mignolo.",fn:"Flette la MCF del mignolo.",b:()=>[REAL('fdm')]},
{id:'odm',cat:'mano',name:"Opponente del mignolo",info:"Il più profondo degli ipotenari; lo attraversano il ramo profondo del nervo e dell’arteria ulnari.",o:"Uncino dell’uncinato e retinacolo dei flessori.",ins:"Margine ulnare del V metacarpo.",fn:"Porta in avanti e ruota il V metacarpo (opposizione del mignolo).",b:()=>[REAL('odm')]},
{id:'lumb',cat:'mano',name:"Lombricali",info:"Quattro, originano dai tendini del FDP. I–II innervati dal mediano, III–IV dall’ulnare.",o:"Tendini del FDP nel palmo.",ins:"Margine radiale dell’apparato estensore del dito corrispondente.",fn:"Flettono le MCF ed estendono le interfalangee.",b:()=>[REAL('lumb')]},
{id:'iod',cat:'mano',name:"Interossei dorsali",info:"Quattro, bipennati, tra i metacarpi (ramo profondo dell’ulnare).",o:"Facce affrontate dei metacarpi adiacenti.",ins:"Base della falange prossimale e apparato estensore di II, III e IV dito.",fn:"Abducono le dita dall’asse del medio (DAB).",b:()=>[REAL('iod')]},
{id:'iop',cat:'mano',name:"Interossei palmari",info:"Tre, unipennati (ramo profondo dell’ulnare).",o:"Faccia palmare di II, IV e V metacarpo.",ins:"Base della falange prossimale e apparato estensore di II, IV e V dito.",fn:"Adducono le dita verso l’asse del medio (PAD).",b:()=>[REAL('iop')]},

{id:'g1',cat:'gua',name:"Guaina del I compartimento (APL-EPB)",info:"Sede della tenosinovite stenosante di De Quervain; in ecografia si vedono ispessimento del retinacolo, liquido e iperemia al Doppler, e un eventuale setto intracompartimentale.",b:()=>[REAL('g1')]},
{id:'g2',cat:'gua',name:"Guaina del II compartimento (ECRL-ECRB)",info:"Prossimalmente è incrociata dal I compartimento (sindrome da intersezione).",b:()=>[REAL('g2')]},
{id:'g3',cat:'gua',name:"Guaina del III compartimento (EPL)",info:"Attorno al tubercolo di Lister, dove il tendine cambia direzione.",b:()=>[REAL('g3')]},
{id:'g4',cat:'gua',name:"Guaina del IV compartimento (EDC-EIP)",info:"Sede frequente di tenosinovite reumatoide.",b:()=>[REAL('g4')]},
{id:'g5',cat:'gua',name:"Guaina del V compartimento (EDM)",info:"Sopra la radio-ulnare distale.",b:()=>[REAL('g5')]},
{id:'g6',cat:'gua',name:"Guaina del VI compartimento (ECU)",info:"Tenosinovite e instabilità dell’ECU; spesso interessata nell’artrite reumatoide precoce.",b:()=>[REAL('g6')]},
{id:'gfpl',cat:'gua',name:"Guaina del FPL (borsa radiale)",info:"Accompagna il tendine del FPL dal tunnel carpale al pollice.",b:()=>[REAL('gfpl')]},
{id:'gulnare',cat:'gua',name:"Guaina comune dei flessori (borsa ulnare)",info:"Avvolge FDS e FDP nel tunnel carpale; si continua con la guaina del V dito. Le infezioni possono comunicare con la borsa radiale e dare il \"flemmone a V\".",b:()=>[REAL('gulnare')]},
{id:'gfcr',cat:'gua',name:"Guaina del FCR",info:"Nel tunnel proprio del FCR, lungo il solco del trapezio; sede di tenosinovite e di gangli volari.",b:()=>[REAL('gfcr')]},
{id:'cute',cat:'cute',name:"Cute",info:"Contorno cutaneo semi-trasparente, utile come riferimento per i reperi superficiali.",b:()=>[REAL('cute')]},
];

THMAP={d_mc3:0.2,d_p1:0.17,d_p2:0.15,d_p3:0.12};
CATS=[{id:'ossa',name:'Ossa',color:'#e8dcc0'},{id:'cart',name:'Cartilagine',color:'#c3dae6'},{id:'leg',name:'Legamenti e placche volari',color:'#e6e1d3'},{id:'pul',name:'Pulegge',color:'#d9cfb4'},{id:'tfl',name:'Tendini flessori',color:'#efe7d6'},{id:'ten',name:'Apparato estensore',color:'#e4dccb'},{id:'mano',name:'Muscoli intrinseci',color:'#a3453a'},{id:'gua',name:'Guaina dei flessori',color:'#7fa3e0'},{id:'art',name:'Arterie',color:'#b0221d'},{id:'ner',name:'Nervi',color:'#ecc85a'},{id:'cute',name:'Cute',color:'#d8a588'}];
S=[
{id:'d_mc3',cat:'ossa',name:"III metacarpo (testa)",info:"La testa è eccentrica, più larga in senso volare: per questo i collaterali della MCF si tendono in flessione (effetto camma). Da qui la posizione di immobilizzazione \"intrinsic plus\", con MCF flesse e interfalangee estese.",b:()=>[REAL('d_mc3')]},
{id:'d_p1',cat:'ossa',name:"Falange prossimale",info:"Sulla faccia volare le creste laterali danno inserzione alla puleggia A2. La base articola con la testa metacarpale, la testa bicondilare con la falange intermedia (IFP).",b:()=>[REAL('d_p1')]},
{id:'d_p2',cat:'ossa',name:"Falange intermedia",info:"Alla base, dorsalmente, si inserisce la bendella centrale; ai lati si inseriscono le due metà del FDS. A metà diafisi si trova la puleggia A4.",b:()=>[REAL('d_p2')]},
{id:'d_p3',cat:'ossa',name:"Falange distale",info:"Alla base dorsale si inserisce il tendine terminale (dito a martello), a quella volare il FDP (jersey finger). La tuberosità ungueale è il supporto del polpastrello.",b:()=>[REAL('d_p3')]},
{id:'d_cart',cat:'cart',name:"Cartilagini articolari",info:"Superfici della MCF, della IFP e della IFD, ricostruite sulle ossa reali.",b:()=>[REAL('d_cart')]},
{id:'vp_mcp',cat:'leg',name:"Placca volare della MCF",info:"Fibrocartilaginea distalmente e membranosa prossimalmente, per consentire la flessione. È continua lateralmente con il legamento intermetacarpale trasverso profondo; su di essa origina la puleggia A1.",b:()=>[REAL('vp_mcp')]},
{id:'vp_pip',cat:'leg',name:"Placca volare della IFP",info:"Fissata distalmente alla base della falange intermedia, prossimalmente con i legamenti \"checkrein\". Impedisce l’iperestensione: nella lussazione dorsale può distaccare un frammento volare dalla base della P2.",b:()=>[REAL('vp_pip')]},
{id:'vp_dip',cat:'leg',name:"Placca volare della IFD",info:"Più sottile, a livello della puleggia A5.",b:()=>[REAL('vp_dip')]},
{id:'cl_mcp_rad',cat:'leg',name:"Collaterali radiali della MCF (proprio e accessorio)",info:"Il proprio va dalla fossetta dorso-laterale della testa metacarpale alla base volare della falange prossimale; l’accessorio va alla placca volare. Tesi in flessione, lassi in estensione.",b:()=>[REAL('cl_mcp_rad')]},
{id:'cl_mcp_uln',cat:'leg',name:"Collaterali ulnari della MCF (proprio e accessorio)",info:"Il proprio va dalla fossetta dorso-laterale della testa metacarpale alla base volare della falange prossimale; l’accessorio va alla placca volare. Tesi in flessione, lassi in estensione.",b:()=>[REAL('cl_mcp_uln')]},
{id:'cl_pip_rad',cat:'leg',name:"Collaterali radiali della IFP (proprio e accessorio)",info:"Il proprio è teso in tutto l’arco di movimento; l’accessorio si porta alla placca volare. Le distorsioni della IFP, più spesso del collaterale radiale, sono frequenti negli sport con la palla; in ecografia si valutano continuità e stress in varo o valgo.",b:()=>[REAL('cl_pip_rad')]},
{id:'cl_pip_uln',cat:'leg',name:"Collaterali ulnari della IFP (proprio e accessorio)",info:"Il proprio è teso in tutto l’arco di movimento; l’accessorio si porta alla placca volare. Le distorsioni della IFP, più spesso del collaterale radiale, sono frequenti negli sport con la palla; in ecografia si valutano continuità e stress in varo o valgo.",b:()=>[REAL('cl_pip_uln')]},
{id:'cl_dip_rad',cat:'leg',name:"Collaterali radiali della IFD (proprio e accessorio)",info:"Collaterale proprio e accessorio, più piccoli, con la stessa organizzazione della IFP.",b:()=>[REAL('cl_dip_rad')]},
{id:'cl_dip_uln',cat:'leg',name:"Collaterali ulnari della IFD (proprio e accessorio)",info:"Collaterale proprio e accessorio, più piccoli, con la stessa organizzazione della IFP.",b:()=>[REAL('cl_dip_uln')]},
{id:'A1',cat:'pul',name:"Puleggia A1",info:"Sulla placca volare della MCF. È la sede del dito a scatto (tenosinovite stenosante): in ecografia si vedono puleggia ispessita e ipoecogena, tenosinovite e scatto dinamico del tendine. È il bersaglio dell’infiltrazione e del rilascio percutaneo.",b:()=>[REAL('A1')]},
{id:'A2',cat:'pul',name:"Puleggia A2",info:"La più lunga e robusta, sulla metà prossimale della falange prossimale. Con la A4 è la più importante contro il bowstringing. La rottura è tipica degli arrampicatori: in ecografia aumenta la distanza tra tendine e osso, meglio valutata in flessione contro resistenza.",b:()=>[REAL('A2')]},
{id:'A3',cat:'pul',name:"Puleggia A3",info:"Sottile, sulla placca volare della IFP.",b:()=>[REAL('A3')]},
{id:'A4',cat:'pul',name:"Puleggia A4",info:"A metà della falange intermedia. Con la A2 è essenziale per l’efficacia dei flessori; spesso lesa insieme alla A3 negli arrampicatori.",b:()=>[REAL('A4')]},
{id:'A5',cat:'pul',name:"Puleggia A5",info:"Sottile e inconstante, sulla placca volare della IFD.",b:()=>[REAL('A5')]},
{id:'C1',cat:'pul',name:"Puleggia cruciforme C1",info:"Tra A2 e A3: fibre incrociate e sottili che si accorciano durante la flessione.",b:()=>[REAL('C1')]},
{id:'C2',cat:'pul',name:"Puleggia cruciforme C2",info:"Tra A3 e A4.",b:()=>[REAL('C2')]},
{id:'C3',cat:'pul',name:"Puleggia cruciforme C3",info:"Tra A4 e A5.",b:()=>[REAL('C3')]},
{id:'d_fds',cat:'tfl',name:"Flessore superficiale (FDS)",info:"A livello della falange prossimale si divide in due bandellette che circondano il FDP e si riuniscono dorsalmente a esso (chiasma di Camper), inserendosi ai lati della falange intermedia. Flette la IFP.",b:()=>[REAL('d_fds')]},
{id:'d_fdp',cat:'tfl',name:"Flessore profondo (FDP)",info:"Passa attraverso il FDS e si inserisce alla base volare della falange distale; flette la IFD. L’avulsione (jersey finger, più frequente al IV dito) si classifica secondo Leddy-Packer in base al livello di retrazione.",b:()=>[REAL('d_fdp')]},
{id:'d_edc',cat:'ten',name:"Estensore comune (EDC) e bendella centrale",info:"Sul dorso della MCF è centrato dalle bendelle sagittali e si appiattisce nel cappuccio degli estensori; sulla falange prossimale cede le bendellette laterali e prosegue come bendella centrale, che si inserisce al tubercolo dorsale della base della falange intermedia. La rottura della bendella centrale (test di Elson) porta alla deformità a occhiello (boutonnière).",b:()=>[REAL('d_edc')]},
{id:'sagittali',cat:'ten',name:"Bendelle sagittali",info:"Dal tendine estensore alla placca volare e al legamento intermetacarpale trasverso profondo: mantengono il tendine centrato sulla testa metacarpale. La lesione, più spesso radiale al III dito (boxer’s knuckle), causa la sublussazione ulnare del tendine, visibile in ecografia dinamica in flessione.",b:()=>[REAL('sagittali')]},
{id:'cappuccio',cat:'ten',name:"Cappuccio degli estensori",info:"Lamina fibrosa dorsale distale alle bendelle sagittali, sulla MCF e sulla base della falange prossimale: vi confluiscono l’EDC e le espansioni di interossei e lombricale, con fibre oblique verso la linea mediana. Si continua con le bendellette laterali; per suo tramite gli intrinseci estendono le interfalangee.",b:()=>[REAL('cappuccio')]},
{id:'bl',cat:'ten',name:"Bendellette laterali",info:"Ciascuna nasce sulla falange prossimale dalla fusione dell’espansione degli intrinseci (interossei e lombricale) con la bendelletta laterale dell’EDC; la radiale riceve il tendine del lombricale. Decorrono dorsalmente all’asse della IFP e lateralmente alla bendella centrale, si uniscono sulla falange intermedia e confluiscono nel tendine terminale. Scivolano in senso volare nella boutonnière e in senso dorsale nel collo di cigno.",b:()=>[REAL('bl')]},
{id:'triangolare',cat:'ten',name:"Legamento triangolare",info:"Lamina dorsale sulla falange intermedia, distale alla bendella centrale, che unisce le due bendellette laterali e ne impedisce lo scivolamento volare; il suo cedimento è parte della boutonnière.",b:()=>[REAL('triangolare')]},
{id:'terminale',cat:'ten',name:"Tendine terminale",info:"Dalla fusione delle bendellette laterali alla base dorsale della falange distale. Rottura o avulsione ossea: dito a martello (mallet finger).",b:()=>[REAL('terminale')]},
{id:'trl',cat:'ten',name:"Legamenti retinacolari trasversi",info:"A livello della IFP collegano le bendellette laterali alla guaina dei flessori e alla placca volare, impedendone lo scivolamento dorsale; la loro lassità favorisce il collo di cigno.",b:()=>[REAL('trl')]},
{id:'orl',cat:'ten',name:"Legamenti retinacolari obliqui (di Landsmeer)",info:"Dalla falange prossimale e dalla guaina dei flessori, volarmente all’asse della IFP, fino al tendine terminale: coordinano l’estensione della IFP con quella della IFD.",b:()=>[REAL('orl')]},
{id:'d_lumb',cat:'mano',name:"Lombricale (II)",info:"Origina dal FDP e si inserisce sulla bendelletta laterale radiale: flette la MCF ed estende le interfalangee. Ogni dito ha un solo lombricale, sempre sul lato radiale; sul lato ulnare del dito medio la bendelletta riceve solo l’interosseo dorsale. Il \"lumbrical plus finger\" è l’estensione paradossale della IFP durante la flessione, dopo lesione del FDP.",b:()=>[REAL('d_lumb')]},
{id:'d_iod',cat:'mano',name:"Interossei dorsali II e III",info:"Si inseriscono sulla base della falange prossimale e sul cappuccio degli estensori; abducono il dito medio in senso radiale e ulnare. Innervati dal ramo profondo del nervo ulnare.",b:()=>[REAL('d_iod')]},

/* ============ Texture fibrose (colore + normal map) ============ */
function fiberTextures(){
  const W=512,H=256,prof=new Float32Array(W);
  let x=0;while(x<W){const bw=9+Math.floor(Math.random()*16),base=0.72+Math.random()*0.28;
    for(let i=0;i<bw&&x<W;i++,x++){const e=Math.min(i,bw-1-i),edge=Math.min(1,e/2.2);prof[x]=base*(0.5+0.5*edge)+(Math.random()-0.5)*0.1;}}
  const hgt=new Float32Array(W*H);
  const at=xx=>{xx=((xx%W)+W)%W;const i=Math.floor(xx),f=xx-i;return prof[i]*(1-f)+prof[(i+1)%W]*f;};
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const wv=3*Math.sin(y/H*Math.PI*4+xx*0.025)+1.5*Math.sin(y/H*Math.PI*10+xx*0.07);
    hgt[y*W+xx]=at(xx+wv)+0.035*Math.sin(y*0.9+xx*0.3);}
  const c1=document.createElement('canvas'),c2=document.createElement('canvas');c1.width=c2.width=W;c1.height=c2.height=H;
  const g1=c1.getContext('2d'),g2=c2.getContext('2d'),d1=g1.createImageData(W,H),d2=g2.createImageData(W,H);
  const hv=(xx,y)=>hgt[((y+H)%H)*W+((xx+W)%W)];
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4,h=hv(xx,y);
    const k=Math.round(clamp(0.87+0.13*h,0,1)*255);d1.data[i]=k;d1.data[i+1]=k;d1.data[i+2]=k;d1.data[i+3]=255;
    let nx=(hv(xx-1,y)-hv(xx+1,y))*2.2,ny=(hv(xx,y-1)-hv(xx,y+1))*2.2,nz=1;const l=Math.hypot(nx,ny,nz);
    d2.data[i]=Math.round((nx/l*0.5+0.5)*255);d2.data[i+1]=Math.round((ny/l*0.5+0.5)*255);d2.data[i+2]=Math.round((nz/l*0.5+0.5)*255);d2.data[i+3]=255;}
  g1.putImageData(d1,0,0);g2.putImageData(d2,0,0);
  const t1=new THREE.CanvasTexture(c1),t2=new THREE.CanvasTexture(c2);
  [t1,t2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;});t1.encoding=THREE.sRGBEncoding;
  return {map:t1,normal:t2};
}

const NOISE_GLSL=`
float fbH(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float fbN(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(fbH(i),fbH(i+vec3(1,0,0)),f.x),mix(fbH(i+vec3(0,1,0)),fbH(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(fbH(i+vec3(0,0,1)),fbH(i+vec3(1,0,1)),f.x),mix(fbH(i+vec3(0,1,1)),fbH(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbF(vec2 q,float a){return 0.55*fbN(vec3(q*5.5,a*0.22))+0.3*fbN(vec3(q*14.0,a*0.5+7.0))+0.15*fbN(vec3(q*32.0,a*1.1+3.0));}
`;
function shaderize(m,o){
  m.onBeforeCompile=sh=>{
    if(o.fiber){
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 fdir;\nvarying vec3 vFd;\nvarying vec3 vOP;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\nvFd=fdir;vOP=position;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vFd;\nvarying vec3 vOP;\n'+NOISE_GLSL)
        .replace('#include <color_fragment>',`#include <color_fragment>
  vec3 fF=normalize(vFd+vec3(1e-4,2e-4,-1e-4));vec3 fU=abs(fF.y)<0.9?vec3(0.,1.,0.):vec3(1.,0.,0.);
  vec3 fB1=normalize(cross(fF,fU));vec3 fB2=cross(fF,fB1);float fA=dot(vOP,fF);vec2 fP=vec2(dot(vOP,fB1),dot(vOP,fB2));
  float fH=fbF(fP,fA);diffuseColor.rgb*=0.84+0.3*fH;`)
        .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  {float fe=0.025;float fhx=fbF(fP+vec2(fe,0.),fA),fhy=fbF(fP+vec2(0.,fe),fA);
   vec3 fg=((fhx-fH)*fB1+(fhy-fH)*fB2)/fe;vec3 fgv=(viewMatrix*vec4(fg,0.)).xyz;
   normal=normalize(normal-${o.fiber.toFixed(3)}*(fgv-dot(fgv,normal)*normal));}`);
    }
    if(o.fresnel)sh.fragmentShader=sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
      'float frE=pow(1.0-abs(dot(normalize(normal),normalize(vViewPosition))),2.0);\n\tgl_FragColor = vec4( outgoingLight, clamp(diffuseColor.a+'+o.fresnel.toFixed(2)+'*frE*(1.0-diffuseColor.a)*1.6,0.0,1.0) );');
  };
  m.customProgramCacheKey=()=>'sh'+JSON.stringify(o);return m;
}

      if(tag[i]===250)c=CUTM.clone().multiplyScalar(0.85+0.3*fbm(x*6,z*6,seed));
      else if(tag[i]===251)c=CUTT.clone();

}

/* ============ Occlusione ambientale precalcolata ============ */
function bakeAO(items){
  const O=[-7.5,-8.2,-4.6],VS=0.1,NX=122,NY=176,NZ=90,NXY=NX*NY;
  const gD=new Uint8Array(NXY*NZ),gA=new Uint8Array(NXY*NZ);
  const vid=(x,y,z)=>{const i=((x-O[0])/VS)|0,j=((y-O[1])/VS)|0,k=((z-O[2])/VS)|0;return(i<0||j<0||k<0||i>=NX||j>=NY||k>=NZ)?-1:i+NX*j+NXY*k;};
  const SKIP=new Set(['caps','cute','bor','gua','spa','adi']),DEEP=new Set(['ossa','cart','men','leg']);
  items.forEach(({s,g})=>{if(SKIP.has(s.cat))return;const deep=DEEP.has(s.cat);const p=g.attributes.position.array,ix=g.index.array;
    for(let t=0;t<ix.length;t+=3){const a=3*ix[t],b=3*ix[t+1],c=3*ix[t+2];
      const L=Math.max(Math.hypot(p[a]-p[b],p[a+1]-p[b+1],p[a+2]-p[b+2]),Math.hypot(p[a]-p[c],p[a+1]-p[c+1],p[a+2]-p[c+2]),Math.hypot(p[b]-p[c],p[b+1]-p[c+1],p[b+2]-p[c+2]));
      const m=Math.max(1,Math.ceil(L/0.07));
      for(let u=0;u<=m;u++)for(let v=0;v<=m-u;v++){const w=m-u-v;
        const id=vid((p[a]*u+p[b]*v+p[c]*w)/m,(p[a+1]*u+p[b+1]*v+p[c+1]*w)/m,(p[a+2]*u+p[b+2]*v+p[c+2]*w)/m);
        if(id>=0){gA[id]=1;if(deep)gD[id]=1;}}}});
  const dil=G=>{const H=G.slice();for(let id=0;id<G.length;id++)if(G[id]){if(id>0)H[id-1]=1;if(id+1<G.length)H[id+1]=1;if(id>=NX)H[id-NX]=1;if(id+NX<G.length)H[id+NX]=1;if(id>=NXY)H[id-NXY]=1;if(id+NXY<G.length)H[id+NXY]=1;}return H;};
  const GD=dil(gD),GA=dil(gA);
  const DIRS=[];const K=18;for(let i=0;i<K;i++){const y=1-2*(i+0.5)/K,r=Math.sqrt(1-y*y),ph=i*2.39996;DIRS.push([Math.cos(ph)*r,y,Math.sin(ph)*r]);}
  const STEPS=[0.14,0.28,0.45,0.66,0.94,1.3,1.8];
  items.forEach(({s,g})=>{if(SKIP.has(s.cat))return;const G=DEEP.has(s.cat)?GD:GA;
    const p=g.attributes.position.array,nm=g.attributes.normal.array,n=p.length/3,ao=new Float32Array(n);
    for(let i=0;i<n;i++){const px=p[3*i],py=p[3*i+1],pz=p[3*i+2],nx=nm[3*i],ny=nm[3*i+1],nz=nm[3*i+2];
      const ox=px+nx*0.18,oy=py+ny*0.18,oz=pz+nz*0.18;let occ=0,tot=0;
      for(const d of DIRS){const c=d[0]*nx+d[1]*ny+d[2]*nz;if(c<0.15)continue;tot+=c;
        for(const st of STEPS){const id=vid(ox+d[0]*st,oy+d[1]*st,oz+d[2]*st);if(id>=0&&G[id]){occ+=c*(1-st/2.3);break;}}}
      ao[i]=tot>0?1-occ/tot:1;}
    const ix=g.index.array;
    for(let pass=0;pass<2;pass++){const sum=new Float32Array(n),cnt=new Float32Array(n);
      for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2];sum[a]+=ao[b]+ao[c];sum[b]+=ao[a]+ao[c];sum[c]+=ao[a]+ao[b];cnt[a]+=2;cnt[b]+=2;cnt[c]+=2;}
      for(let i=0;i<n;i++)ao[i]=(ao[i]*2+sum[i])/(2+cnt[i]);}
    const col=g.attributes.color;
    for(let i=0;i<n;i++){const f=0.28+0.72*Math.pow(clamp(ao[i],0,1),1.25);col.setXYZ(i,col.getX(i)*f,col.getY(i)*f,col.getZ(i)*f);}
    col.needsUpdate=true;});
}

  S.forEach(s=>{s.chk.checked=s.visible;});
}
sync();
document.getElementById('bAll').addEventListener('click',()=>{S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();});
document.getElementById('bBones').addEventListener('click',()=>{S.forEach(s=>setVis(s,s.cat==='ossa'));sync();});
const bT=document.getElementById('bTransp');let transp=false;
bT.addEventListener('click',()=>{transp=!transp;bT.setAttribute('aria-pressed',transp);
  S.forEach(s=>{if((MUSC.has(s.cat)||s.cat==='adi')&&s.mat){const m=s.mat;m.transparent=transp||m.userData.baseTransparent;m.opacity=transp?0.32:m.userData.baseOpacity;m.depthWrite=transp?false:m.userData.baseDepthWrite;m.needsUpdate=true;
    s.group.children.forEach(o=>{o.castShadow=!transp;});}});});

/* ============ Regioni guidate e piano di taglio ============ */
renderer.localClippingEnabled=true;
const clipLocal=new THREE.Plane(new THREE.Vector3(0,1,0),0),clipWorld=new THREE.Plane();let clipOn=false;
function applyClip(){root.updateMatrixWorld();clipWorld.copy(clipLocal).applyMatrix4(root.matrixWorld);}
const capOn={value:0};
const CAPC={ossa:'#c7a066',cart:'#9cc0d0',leg:'#d9d3c3',ret:'#d9d3c3',pul:'#d9d3c3',tfl:'#e1dccd',ten:'#e1dccd',fless:'#7c2622',est:'#7c2622',mano:'#7c2622',art:'#8a1714',ven:'#2d3b72',ner:'#c9a23a'};
const BELLY=new Set(['pq','br','apb','fpb','op','add','adm','fdm','odm','lumb','iod','iop','d_lumb','d_iod']);
function capPatch(s){const m=s.mat;if(!m||m.userData.capP||!CAPC[s.cat])return;m.userData.capP=1;const col=new THREE.Color(MUSC.has(s.cat)&&!BELLY.has(s.id)?'#e3dccb':CAPC[s.cat]);
  const prev=m.onBeforeCompile;m.onBeforeCompile=function(sh,r){if(prev)prev.call(this,sh,r);sh.uniforms.capOn=capOn;sh.uniforms.capCol={value:col};
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform float capOn;uniform vec3 capCol;').replace('#include <dithering_fragment>','#include <dithering_fragment>\nif(!gl_FrontFacing&&capOn>0.5){gl_FragColor=vec4(capCol*0.92,1.0);}');};
  const pk=m.customProgramCacheKey?m.customProgramCacheKey.bind(m):null;m.customProgramCacheKey=()=>(pk?pk():'')+'|cap';m.needsUpdate=true;}
function setClip(on){clipOn=on;applyClip();capOn.value=on?1:0;S.forEach(s=>{if(s.mat){capPatch(s);s.mat.clippingPlanes=on?[clipWorld]:null;s.mat.clipShadows=on;s.mat.needsUpdate=true;}});}
const REF=MODE==='dito'?{y:-1.875,t:'IFP'}:{y:0,t:'rima radiocarpica'};
function clipTxt(v){const d=Math.round((v-REF.y)*10);return d===0?'livello della '+REF.t:Math.abs(d)+' mm '+(d>0?'prossimale':'distale')+' alla '+REF.t;}
const BO=['ossa'];
const REG=MODE==='dito'?[
 {n:'Pulegge',ids:['A1','A2','A3','A4','A5','C1','C2','C3','d_fds','d_fdp','vp_mcp','vp_pip','vp_dip'],v:{th:0.6,ph:0.12,r:13,tg:[0.1,-0.8,0.2]},
  note:'Annulari A1–A5 e cruciformi C1–C3. A2 (sulla falange prossimale) e A4 (sulla intermedia) sono le più importanti contro il bowstringing; A1, A3 e A5 originano dalle placche volari.'},
 {n:'Sezione del dito',ids:['A2','A4','C1','d_fds','d_fdp','guaina','bl','cappuccio','d_edc','terminale','triangolare','nervi','arterie','d_lumb','d_iod','iod_t','sagittali','vp_pip','cl_pip_rad','cl_pip_uln'],clip:1.0,cr:[-5.6,5.8],v:{th:0,ph:1.12,r:6.5,tg:[0.1,1.0,-0.3]},
  note:'Vista dalla punta del dito sul piano di taglio: flessori nella guaina sotto la puleggia, apparato estensore dorsale, fasci neurovascolari laterali. Sposta il cursore per percorrere il dito come in un\u2019ecografia assiale.'},
 {n:'Apparato estensore',ids:['d_edc','sagittali','cappuccio','bl','triangolare','terminale','trl','orl','d_lumb','d_iod','iod_t'],v:{th:2.55,ph:0.12,r:12,tg:[0.1,-1.5,-0.9]},
  note:'Bendelle sagittali sulla MCF, bendella centrale alla base della falange intermedia, bendellette laterali unite dal legamento triangolare nel tendine terminale; retinacolari trasversi e obliqui.'},
 {n:'Articolazione IFP',ids:['cl_pip_rad','cl_pip_uln','vp_pip','A3','C1','C2','trl','orl','bl','d_cart','d_edc'],v:{th:-1.35,ph:0.1,r:5.5,tg:[0.1,-1.875,-0.6]},
  note:'Collaterale proprio (alla base della falange intermedia) e accessorio (alla placca volare), placca volare, puleggia A3; dorsalmente bendella centrale e bendellette laterali.'}
]:[
 {n:'Tunnel carpale',ids:['retfl','fcr','fds','fdp','fpl','pl','nmed','nmedmot','npalm','gulnare','gfpl','gfcr','lumtc','nuln','auln','pisham','tettoguy'],clip:-1.6,cr:[-2.95,-0.6],v:{th:0,ph:0.95,r:8,tg:[-1.0,-1.6,0.4]},
  note:'Vista da distale sul piano di taglio. Tetto: retinacolo dei flessori, dal tubercolo dello scafoide e dalla cresta del trapezio al pisiforme e all\u2019uncino dell\u2019uncinato. Contenuto: nervo mediano (superficiale, radiale), FDS, FDP e FPL; il FCR ha un tunnel proprio. Più superficiale e ulnare, il canale di Guyon.'},
 {n:'Canale di Guyon',ids:['retfl','pisham','pismc','fcu','nuln','nulnsup','nulnprof','auln','aulnprof','lumguy','tettoguy','adm','fdm','odm','fds'],clip:-1.5,cr:[-2.5,-0.6],v:{th:0.55,ph:0.95,r:7,tg:[0.1,-1.6,1.3]},
  note:'Tra pisiforme e uncino dell\u2019uncinato; pavimento: retinacolo dei flessori e piso-uncinato; tetto: legamento carpale volare. Nervo ulnare con l\u2019arteria sul lato radiale; distalmente il nervo si divide in ramo superficiale (sensitivo) e profondo (motorio, attorno all\u2019uncino).'},
 {n:'Tabacchiera anatomica',ids:['apl','epb','epl','ecrl','ecrb','arad','adca','aprinc','nradsup','vcef','retext','rcl','g1','g3'],v:{th:-1.45,ph:0.15,r:10,tg:[-3.0,-1.2,-0.4]},
  note:'Limiti: volare APL ed EPB (I compartimento), dorsale EPL; pavimento: scafoide e trapezio. Contiene l\u2019arteria radiale; superficialmente vena cefalica e rami del nervo radiale superficiale.'},
 {n:'Compartimenti estensori',ids:['retext','br','ecrl','ecrb','apl','epb','epl','edc','eip','edm','ecu','g1','g2','g3','g4','g5','g6','nradsup'],clip:0.8,cr:[-0.8,2.4],v:{th:Math.PI,ph:0.9,r:9,tg:[-1.2,0.8,-0.8]},
  note:'Da radiale a ulnare: I APL-EPB, II ECRL-ECRB, III EPL (ulnare al tubercolo di Lister), IV EDC-EIP, V EDM (sopra la radio-ulnare distale), VI ECU nel solco ulnare.'},
 {n:'TFCC e RUD',ids:['tfcc','cartuln','cartrad','ucl','ul','ut','uc','ecu','g6','lsl','llt','drc','dic'],v:{th:Math.PI,ph:0.3,r:8,tg:[0.2,0.0,-0.4]},
  note:'Disco del TFCC tra testa ulnare e semilunare/piramidale, legamenti ulno-lunato e ulno-piramidale, collaterale ulnare e sottoguaina dell\u2019ECU; più radialmente scafo-lunato e luno-piramidale.'}
];
const regsEl=document.getElementById('regs'),regNote=document.getElementById('regNote'),clipBar=document.getElementById('clipBar'),clipR=document.getElementById('clipR'),clipV=document.getElementById('clipV');
let curReg=null;
function exitReg(){curReg=null;[...regsEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed','false'));regNote.hidden=true;clipBar.hidden=true;setClip(false);setTimeout(measure,50);}
function goReg(R,btn){
  if(curReg===R){exitReg();S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();return;}
  curReg=R;[...regsEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',b===btn));
  const ids=new Set(R.ids);S.forEach(s=>setVis(s,ids.has(s.id)||BO.includes(s.cat)));sync();select(null);
  regNote.textContent=R.note;regNote.hidden=false;
  if(R.clip!=null){clipR.min=R.cr[0];clipR.max=R.cr[1];clipR.value=R.clip;clipLocal.constant=-R.clip;clipV.textContent=clipTxt(R.clip);clipBar.hidden=false;setClip(true);}
  else{clipBar.hidden=true;setClip(false);}
  const up=root.rotation.z!==0;root.updateMatrixWorld();
  const tg=root.localToWorld(V(R.v.tg[0],R.v.tg[1],R.v.tg[2]));
  anim={t0:performance.now(),from:{theta:cam.theta,phi:cam.phi,r:cam.r,tg:cam.target.clone()},to:{theta:up?-R.v.th:R.v.th,phi:up?R.v.ph:-R.v.ph,r:R.v.r,tg:tg}};
  clearViewPress();setTimeout(measure,50);
}
REG.forEach(R=>{const b=document.createElement('button');b.textContent=R.n;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>goReg(R,b));regsEl.appendChild(b);});
clipR.addEventListener('input',()=>{const v=+clipR.value;clipLocal.constant=-v;clipV.textContent=clipTxt(v);applyClip();});
document.getElementById('bAll').addEventListener('click',exitReg);
document.getElementById('bBones').addEventListener('click',exitReg);
const sheet=document.getElementById('sheet'),bL=document.getElementById('bList');
bL.addEventListener('click',()=>{const o=sheet.classList.toggle('open');bL.setAttribute('aria-expanded',o);bL.textContent=o?'Chiudi elenco':'Elenco';setTimeout(measure,280);});
function measure(){document.documentElement.style.setProperty('--sheetH',(innerWidth>=900?0:sheet.offsetHeight)+'px');}
addEventListener('resize',measure);measure();
/* smartphone: pannello richiudibile dalla linguetta; chiuso all'avvio, si chiude quando si apre una card */
const compact=matchMedia('(max-width:600px),(orientation:landscape) and (max-height:500px)'),bS=document.getElementById('bSheet');
function setSheet(o){sheet.classList.toggle('collapsed',!o);bS.setAttribute('aria-expanded',o);}
let sw=null,swDone=false;
bS.addEventListener('click',()=>{if(swDone){swDone=false;return;}const o=sheet.classList.contains('collapsed');if(o&&!card.hidden)select(null);setSheet(o);});
/* swipe verso il basso dall'intestazione "Strutture" chiude il pannello */
bS.addEventListener('pointerdown',e=>{swDone=false;sw=compact.matches&&!sheet.classList.contains('collapsed')?{id:e.pointerId,x:e.clientX,y:e.clientY}:null;});
bS.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dy=e.clientY-sw.y;if(dy>28&&dy>Math.abs(e.clientX-sw.x)){sw=null;swDone=true;setSheet(false);}});
bS.addEventListener('pointerup',()=>{sw=null;});bS.addEventListener('pointercancel',()=>{sw=null;});
new MutationObserver(()=>{if(!card.hidden&&compact.matches)setSheet(false);}).observe(card,{attributes:true,attributeFilter:['hidden']});
compact.addEventListener('change',e=>{if(e.matches)setSheet(false);});

/* ============ Loop e costruzione ============ */
let building=true,lastR=0;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function loop(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/650),k=ease(t);
    cam.theta=anim.from.theta+(anim.to.theta-anim.from.theta)*k;cam.phi=anim.from.phi+(anim.to.phi-anim.from.phi)*k;cam.r=anim.from.r+(anim.to.r-anim.from.r)*k;cam.target.lerpVectors(anim.from.tg,anim.to.tg,k);if(t>=1)anim=null;}
  updateCam();if(clipOn)applyClip();if(!building||now-lastR>250){renderer.render(scene,camera);lastR=now;}requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
(async function(){
  const bar=document.getElementById('loadBar'),txt=document.getElementById('loadTxt');
  BP=await loadBP();
  for(let i=0;i<S.length;i++){
    try{buildStruct(S[i]);}catch(err){console.error(S[i].id,err);}
    bar.style.width=Math.round((i+1)/S.length*85)+'%';txt.textContent='Costruzione del modello… '+(i+1)+'/'+S.length;
    await new Promise(r=>setTimeout(r,0));
  }
  txt.textContent='Calcolo di ombre e profondità…';await new Promise(r=>setTimeout(r,30));
  try{bakeAO(built);}catch(err){console.error(err);}
  bar.style.width='100%';building=false;document.getElementById('load').hidden=true;
  /* Ricerca dalla home: ID stabile, applicato solo a costruzione completata. */
  scene.updateMatrixWorld(true);
  const searchId=new URLSearchParams(location.search).get('struttura');
  const found=searchId&&S.find(s=>s.id===searchId);
  if(found&&found.group&&found.group.children.length){
    isola(s=>s===found||s.cat==='ossa');
    select(found.id);sync();
    const box=new THREE.Box3().setFromObject(found.group);
    const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
    const bones=new THREE.Box3();S.filter(s=>s.cat==='ossa'&&s.group).forEach(s=>bones.expandByObject(s.group));
    const boneCenter=bones.getCenter(new THREE.Vector3());
    const dx=center.x-boneCenter.x,dz=center.z-boneCenter.z;
    anim=null;cam.target.copy(center);cam.phi=0.12;
    if(Math.hypot(dx,dz)>0.4)cam.theta=Math.atan2(dx,dz);
    const fov=camera.fov*Math.PI/180;
    const fit=Math.max(size.y,size.x/Math.min(camera.aspect,1),size.z)*0.75/Math.tan(fov/2);
    cam.r=Math.max(cam.baseR*0.28,Math.min(cam.baseR*1.3,fit));
    clearViewPress();
    if(compact.matches)setSheet(false);
  }else if(searchId){
    const notice=document.createElement('p');notice.setAttribute('role','status');
    notice.textContent='Struttura non disponibile. Puoi cercarla nell’elenco.';
    notice.style.cssText='position:fixed;top:100px;left:20px;right:20px;z-index:30;padding:12px;border-radius:12px;background:var(--panel);color:var(--ink)';
    document.body.appendChild(notice);setTimeout(()=>notice.remove(),7000);
  }

})();
})();

</script>
