<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe4e9; --bg-hi:#f4f6f8; --bg-lo:#c9d0d7; --panel:#f8f9fa; --ink:#1c2632; --muted:#5a6876; --line:#cdd5dd; --accent:#2c6b8a; --shadow:0 6px 24px rgba(20,35,50,.14);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--bg-hi) 0%,var(--bg) 62%,var(--bg-lo) 100%);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.title{pointer-events:auto}
.title h1{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;margin:0}
.title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.views{display:flex;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.views button{border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:12.5px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.sect{display:inline-flex;gap:2px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:6px;box-shadow:var(--shadow)}
.sect button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.sect button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.views .flip{margin-left:2px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;font-size:15px;line-height:1;padding:6px 9px}
.views .flip[aria-pressed="true"],.views .flip[aria-pressed="false"]{background:transparent;color:var(--ink)}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:14px;pointer-events:none}
#load .bar{width:180px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#load[hidden]{display:none}

#card{position:fixed;left:12px;right:12px;bottom:calc(var(--sheetH,120px) + 10px);max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
#card[hidden]{display:none}
#card h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 28px 2px 0;line-height:1.2}
#card .cat{color:var(--muted);font-size:12.5px;margin:0 0 6px}
#card .info{margin:0 0 10px;line-height:1.45;font-size:14px;max-height:36vh;overflow:auto}
#card .info p{margin:0}
#card .oif{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:5px 10px;margin:0;font-size:13.5px}
#card .info p+.oif{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#card .oif dt{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#card .oif dd{margin:0}
#card .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}

#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:16px 16px 0 0}
.chips{padding-bottom:2px}.chips-in{display:flex;flex-wrap:wrap;gap:6px}  /* computer: a capo, senza scorrimento */
.regs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;align-items:center}
.regs::-webkit-scrollbar{display:none}
.regs .rl{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.regs button{flex:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.regs button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
#regNote{font-size:12.5px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:9px;padding:7px 9px;margin:0 0 7px}
#regNote[hidden],#clipBar[hidden]{display:none}
#clipBar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 7px}
#clipBar input{flex:1;accent-color:var(--accent)}
#clipV{min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px 6px 8px;font-size:13px;font-weight:500;white-space:nowrap}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
.chip[data-state="off"]{color:var(--muted)}
.chip[data-state="off"] .dot{background:transparent}
.chip[data-state="part"] .dot{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
/* smartphone: categorie su 3 righe compatte con scorrimento orizzontale (larghezza calcolata nello script) e chip compatti */
@media (max-width:600px){.chips{overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips-in{gap:5px}.chip{padding:4px 9px 4px 6px;gap:5px;font-size:12.5px}.chip .dot{width:10px;height:10px}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.row .left{display:flex;gap:6px;flex-wrap:wrap}
.toggle-list{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 2px;white-space:nowrap}
#list{max-height:0;overflow:auto;transition:max-height .25s ease}
#sheet.open #list{max-height:42vh;margin-top:6px}
.grp h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.grp h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.item{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.item input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.item label{flex:1}
.credit{font-size:11px;color:var(--muted);margin:8px 2px 0;line-height:1.35}
.item .go{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:2px 6px}
@media (min-width:900px){
  #sheet{left:auto;right:16px;bottom:16px;width:360px;border-radius:14px;border:1px solid var(--line)}
  #sheet.open #list{max-height:55vh}
  #card{left:16px;right:auto;bottom:16px;margin:0;width:400px}
}
@media (prefers-reduced-motion:reduce){#list{transition:none}}
.views .vtoggle{display:none}
@media (max-width:430px){
  .views{position:absolute;top:100%;right:14px;margin-top:6px}
  .views .vtoggle{display:flex;align-items:center;gap:6px}
  .views .vtoggle .vc{font-size:11px;opacity:.8}
  .views:not(.closed) .vtoggle .vl{display:none}
  .views:not(.closed) .vtoggle .vc{transform:rotate(180deg)}
  .views.closed button:not(.vtoggle){display:none}
}
/* ===== Smartphone: pannello richiudibile e card compatta ===== */
.sheet-tab{display:none}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  :root{--tabH:44px;--pillH:44px;--pillGap:12px}
  #sheet{left:0;right:0;bottom:0;width:auto;border:0;border-radius:0;
    padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));
    transition:transform .25s ease,visibility 0s}
  #sheet.collapsed{transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  .sheet-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;
    position:absolute;bottom:100%;left:0;right:0;width:100%;visibility:visible;
    height:var(--tabH);padding:0 22px;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    background:var(--panel);box-shadow:0 -4px 14px rgba(0,0,0,.3);font-size:13.5px;font-weight:600;white-space:nowrap}
  /* chiuso: pulsante ovale fluttuante, staccato dal bordo inferiore: sotto e ai lati si vede lo sfondo */
  #sheet.collapsed .sheet-tab{flex-direction:row;left:50%;right:auto;width:auto;transform:translateX(-50%);
    bottom:calc(100% + var(--pillGap) + env(safe-area-inset-bottom,0px));height:var(--pillH);padding:0 18px;
    border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
    background:rgba(30,38,47,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #sheet.collapsed .sheet-tab .grip{display:none}
  .sheet-tab .grip{width:32px;height:4px;border-radius:2px;background:var(--line)}
  .sheet-tab .car{display:inline-block;color:var(--accent);transition:transform .25s}
  #sheet:not(.collapsed) .sheet-tab .car{transform:rotate(180deg)}
  .sheet-body{max-height:60vh;max-height:60dvh;overflow-y:auto;overscroll-behavior:contain;padding-top:10px}
  #sheet.open #list{max-height:none}  /* un solo scorrimento: quello del pannello */
  #card{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;margin:0 auto;
    bottom:calc(var(--pillH) + var(--pillGap) + env(safe-area-inset-bottom,0px) + 10px);padding:9px 12px 10px;
    max-height:35vh;max-height:35dvh;display:flex;flex-direction:column}
  #card h2{font-size:17px}
  #card .cat{margin-bottom:4px}
  #card h2,#card .cat,#card .btns{flex:none}
  #card .info{flex:1 1 auto;min-height:0;max-height:none;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){#sheet,.sheet-tab,.sheet-tab .car{transition:none}}
/* ===== Vetro (stile "liquid glass"): barra viste, selettore sezione, card e pannello strutture =====
   Identico in tutti i modelli. Superfici semitrasparenti con sfocatura dello sfondo, bordo chiaro sottile
   e riflesso in alto. Gli elementi interni usano solo riempimenti trasparenti (niente backdrop-filter annidati). */
:root{--glass:rgba(248,249,250,.62);--glass-card:rgba(248,249,250,.8);--glass-bd:rgba(255,255,255,.7);--glass-fill:rgba(20,35,50,.05);--glass-fill-hi:rgba(20,35,50,.1);--glass-sep:rgba(20,35,50,.1);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.8);--glass-blur:blur(20px) saturate(170%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
    --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
}
:root[data-theme="dark"]{--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
.views,.sect,#card,#sheet{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.views,.sect{border-radius:999px;padding:3px}
.views button,.sect button{border-radius:999px;padding:6px 10px;transition:background-color .15s,color .15s}
.views button:not([aria-pressed="true"]):hover,.sect button:not([aria-selected="true"]):hover{background:var(--glass-fill-hi)}
.views .flip{border-left:1px solid var(--glass-sep);border-radius:0 999px 999px 0;padding:6px 11px 6px 9px}
.views .flip:hover{background:transparent}
#card{background:var(--glass-card);border-left:4px solid var(--c,#999);border-radius:16px}
#sheet{border-width:1px 0 0;border-radius:20px 20px 0 0}
/* computer: con l'elenco aperto il pannello non sale sotto la barra del sito e le viste; si accorcia l'elenco */
@media (min-width:900px){#sheet{border-width:1px;border-radius:20px;display:flex;flex-direction:column;
    max-height:calc(100vh - env(safe-area-inset-top,0px) - 136px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 136px)}
  .sheet-body{display:flex;flex-direction:column;min-height:0}
  .sheet-body>*{flex:none}.sheet-body>#list{flex:0 1 auto;min-height:0}}
.chip,.btn{background:var(--glass-fill);border-color:var(--glass-bd);transition:background-color .15s}
.chip:hover,.btn:not(.primary):not([aria-pressed="true"]):hover{background:var(--glass-fill-hi)}
.btn{border-radius:999px;padding:6px 12px}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.item{border-bottom-color:var(--glass-sep)}
#card .info p+.oif{border-top-color:var(--glass-sep)}
.regs button{background:var(--glass-fill)}
.regs button[aria-pressed="true"]{background:var(--accent)}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  /* aperto: pannello e intestazione formano un'unica lastra, un po' più piena perché l'intestazione,
     figlia del pannello sfocato, in Chrome non può sfocare a sua volta ciò che sta dietro */
  #sheet{background:var(--glass-card);border-width:0;border-radius:0}
  .sheet-tab{background:var(--glass-card);border-top:1px solid var(--glass-bd);border-radius:20px 20px 0 0;box-shadow:var(--glass-hl),0 -6px 18px rgba(0,0,0,.25);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  #sheet.collapsed .sheet-tab{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow)}
  #sheet.collapsed{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>
<canvas id="c" tabindex="0" aria-label="Modello 3D del gomito: trascina per ruotare, pizzica per ingrandire, tocca una struttura per il dettaglio"></canvas>
<div id="load"><span id="loadTxt">Costruzione del modello…</span><div class="bar"><i id="loadBar"></i></div></div>

<div class="top">
  <div class="title">
    <h1>Gomito destro</h1>
  </div>
  <nav class="views closed" aria-label="Vista">
    <button data-view="ant" aria-pressed="true">Ant</button>
    <button data-view="post" aria-pressed="false">Post</button>
    <button data-view="lat" aria-pressed="false">Lat</button>
    <button data-view="med" aria-pressed="false">Med</button>
    <button class="flip" id="bFlip" aria-pressed="true" aria-label="Braccio in alto o in basso" title="Braccio in alto (tocca per avambraccio in alto)">⇅</button>
    <button class="vtoggle" id="bViews" aria-expanded="false" aria-label="Scegli la vista"><span class="vl">Vista</span><span class="vc" aria-hidden="true">▾</span></button>
  </nav>
</div>

<div id="card" hidden role="dialog" aria-live="polite">
  <button class="x" aria-label="Chiudi">×</button>
  <h2 id="cName"></h2>
  <p class="cat" id="cCat"></p>
  <div class="info" id="cInfo"></div>
  <div class="btns">
    <button class="btn primary" id="cIso">Isola con le ossa</button>
    <button class="btn" id="cHide">Nascondi</button>
  </div>
</div>

<section id="sheet" class="collapsed" aria-label="Strutture anatomiche">
  <button class="sheet-tab" id="bSheet" aria-expanded="false" aria-controls="sheetBody">
    <span class="grip" aria-hidden="true"></span>
    <span>Strutture <span class="car" aria-hidden="true">▴</span></span>
  </button>
  <div class="sheet-body" id="sheetBody">
  <div class="regs" id="regs" role="group" aria-label="Regioni anatomiche"><span class="rl">Regioni</span></div>
  <div id="regNote" hidden></div>
  <div id="clipBar" hidden><label for="clipR">Taglio</label><input type="range" id="clipR" step="0.05"><span id="clipV"></span></div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <div class="left">
      <button class="btn" id="bAll">Ripristina</button>
      <button class="btn" id="bBones">Solo ossa</button>
      <button class="btn" id="bTransp" aria-pressed="false">Muscoli trasparenti</button>
    </div>
    <button class="toggle-list" id="bList" aria-expanded="false">Elenco</button>
  </div>
  <div id="list"></div>
  <p class="credit"><b>Materiale didattico.</b> Non destinato a uso clinico o diagnostico.</p>

/* nervi e vasi: calibro variabile, vene appiattite con rigonfiamenti valvolari, rami svasati all'origine, terminazioni affusolate */
function vessel(id){
  const pts=NVP.pts[id],r=NVP.r[id];
  const ven=id.startsWith('v_'),ner=id.startsWith('n_'),art=id.startsWith('a_');
  const seed=(id.length*13.7+id.charCodeAt(2))%40;
  const st=pts[0],en=pts[pts.length-1];
  const cutEnd=Math.abs(en[1])>11.6,cutStart=Math.abs(st[1])>11.6;
  const JN={v_mediana_cub:[1,1],v_mediana_avambraccio:[0,1],v_perforante:[1,1],v_mediana_cefalica:[1,1],v_mediana_basilica:[1,1],v_comitante_med:[1,0],v_comitante_lat:[1,0],v_comitante_rad_lat:[0,1],v_comitante_rad_med:[0,1],v_comitante_uln_lat:[0,1],v_comitante_uln_med:[0,1],a_brachiale:[0,1],a_interossea_comune:[0,1],a_ricorrente_radiale:[0,1],a_collat_radiale:[0,1],a_ricorrente_ulnare_ant:[0,1],a_collat_ulnare_inf:[0,1],a_ricorrente_ulnare_post:[0,1],a_collat_ulnare_sup:[0,1]}[id]||[0,0];
  const rpv=NVP.rp&&NVP.rp[id],prof=rpv?(t=>{const x=Math.min(1,Math.max(0,t))*(rpv.length-1),i=Math.min(rpv.length-2,Math.floor(x));return rpv[i]+(rpv[i+1]-rpv[i])*(x-i);}):(()=>1);
  const ef=ner&&rpv?(t=>sstep(0,0.05,t)*sstep(0,0.05,1-t)):(()=>1);   /* nervi con profilo: rumore e appiattimento sfumano alle estremità (giunti senza gradino) */
  const branch=!!PARENT[id],tipEnd=!cutEnd&&!JN[1]&&!(ner&&rpv),tipStart=!cutStart&&!branch&&!JN[0];
  const w=t=>{let k=prof(t);
    if(art&&!rpv)k*=1-0.14*t;
    k*=1+(ven?0.07:ner?0.06:art&&rpv?0.012:0.07)*(vnoise(t*(ven?8:5)+seed,seed,2.1)-0.5)*2*(ner?ef(t):1);
    if(ven)k*=1+0.22*Math.max(0,vnoise(t*26+seed,1.7,seed)-0.62);
    if(ner)k*=1+0.04*Math.sin(t*90+seed)*ef(t);
    if(tipEnd&&t>0.88){const q=(t-0.88)/0.12;k*=0.45+0.55*Math.sqrt(Math.max(0.0,1-q*q));}
    if(tipStart&&t<0.1){const q=(0.1-t)/0.1;k*=0.45+0.55*Math.sqrt(Math.max(0.0,1-q*q));}
    if(branch&&t<0.06&&!(art&&rpv))k*=1+(ven||ner?0:0.45)*(1-t/0.06)*(1-t/0.06);
    return r*k;};
  const fl=t=>0.64+0.1*vnoise(t*5+seed,3,1);
  const W=ven?(t=>w(t)*fl(t)):w;
  const ratio=ven?(t=>1/fl(t)):art&&rpv?1:ner?(t=>1-(1-(0.82+0.06*vnoise(t*4+seed,5,2)))*ef(t)):0.97;
  const wdir=ven?(p=>{const rx=p.x+0.4,rz=p.z-0.6,l=Math.hypot(rx,rz)||1;return V(rx/l,0,rz/l);}):null;
  const plen=pts.reduce((a,p,i)=>i?a+Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1],p[2]-pts[i-1][2]):0,0);
  return [sweep(pts,{w:W,ratio,wdir,urep:2,shape:CIRC24,seg:ner&&rpv?Math.min(320,Math.max(18,Math.round(plen*8))):undefined})];
}

{id:'omero',cat:'ossa',name:"Omero (estremità distale)",info:"Paletta omerale con troclea (mediale, per l’incisura trocleare dell’ulna) e capitello (laterale, per la testa radiale). Anteriormente le fossette coronoidea e radiale, posteriormente la fossetta olecranica, sedi dei cuscinetti adiposi. Epicondilo mediale: origine dei flessori-pronatori e del legamento collaterale ulnare; epicondilo laterale: estensori-supinatori e complesso collaterale laterale. Il capitello è la sede tipica dell’osteocondrite dissecante nel giovane lanciatore (malattia di Panner sotto i 10 anni).",b:()=>[REAL('omero')]},
{id:'ulna',cat:'ossa',name:"Ulna (estremità prossimale)",info:"Olecrano e processo coronoideo delimitano l’incisura trocleare; lateralmente l’incisura radiale accoglie la testa del radio. Sul versante mediale del coronoide il tubercolo sublime (inserzione del fascio anteriore del collaterale ulnare); lateralmente, distale all’incisura radiale, la cresta del supinatore (inserzione del LUCL). Anteriormente, sotto il coronoide, la tuberosità ulnare per il brachiale.",b:()=>[REAL('ulna')]},
{id:'radio',cat:'ossa',name:"Radio (estremità prossimale)",info:"Testa discoidale con fovea (per il capitello) e circonferenza articolare (per l’incisura radiale dell’ulna), avvolta dal legamento anulare; poi collo e tuberosità radiale, inserzione del bicipite. Le fratture della testa si classificano secondo Mason; nel bambino la sublussazione della testa sotto il legamento anulare è la pronazione dolorosa.",b:()=>[REAL('radio')]},
{id:'cart_omero',cat:'cart',name:"Cartilagine di troclea e capitello",info:"Riveste troclea e capitello. Al passaggio tra capitello ed epicondilo laterale, posteriormente, il bordo irregolare della cartilagine può simulare una lesione osteocondrale (pseudodifetto del capitello).",b:()=>[REAL('cart_omero')]},
{id:'cart_ulna',cat:'cart',name:"Cartilagine delle incisure trocleare e radiale",info:"L’incisura trocleare presenta spesso una zona nuda trasversale tra porzione olecranica e coronoidea (pseudodifetto), da non confondere con una lesione osteocondrale.",b:()=>[REAL('cart_ulna')]},
{id:'cart_radio',cat:'cart',name:"Cartilagine della testa radiale",info:"Riveste la fovea (articolazione omero-radiale) e la circonferenza articolare (radio-ulnare prossimale).",b:()=>[REAL('cart_radio')]},
{id:'ucl_ant',cat:'leg',name:"Collaterale ulnare – fascio anteriore",info:"Il fascio più robusto. Lesione tipica dei lanciatori, da sovraccarico ripetuto in valgo. In ecografia è una banda fibrillare profonda al tendine comune dei flessori, da valutare anche sotto stress in valgo; in artro-RM il distacco parziale profondo dal tubercolo sublime dà il segno della T.",o:"Faccia antero-inferiore dell’epicondilo mediale.",ins:"Tubercolo sublime del processo coronoideo.",fn:"Principale stabilizzatore contro il valgo tra circa 30° e 120° di flessione.",b:()=>[REAL('ucl_ant')]},
{id:'ucl_post',cat:'leg',name:"Collaterale ulnare – fascio posteriore",info:"Ispessimento capsulare a ventaglio; forma il pavimento del tunnel cubitale.",o:"Faccia postero-inferiore dell’epicondilo mediale.",ins:"Margine mediale dell’olecrano.",fn:"Stabilizzatore secondario contro il valgo, soprattutto in flessione avanzata, quando è teso.",b:()=>[REAL('ucl_post')]},
{id:'ucl_trasv',cat:'leg',name:"Collaterale ulnare – fascio trasverso (di Cooper)",info:"Non attraversa l’articolazione: contributo minimo alla stabilità.",o:"Margine mediale dell’olecrano.",ins:"Margine mediale del processo coronoideo.",fn:"Unisce le inserzioni ulnari dei fasci anteriore e posteriore; amplia l’incisura trocleare.",b:()=>[REAL('ucl_trasv')]},
{id:'rcl',cat:'leg',name:"Collaterale radiale",info:"Subito in profondità al tendine comune degli estensori; nelle epicondiliti laterali croniche può essere coinvolto insieme all’ECRB.",o:"Epicondilo laterale.",ins:"Legamento anulare, con cui si fonde.",fn:"Stabilizza contro il varo e mantiene la testa radiale a contatto con il capitello.",b:()=>[REAL('rcl')]},
{id:'anulare',cat:'leg',name:"Legamento anulare",info:"Forma circa i quattro quinti dell’anello osteofibroso attorno alla testa radiale, più stretto in basso. Nel bambino la testa può scivolare parzialmente sotto il legamento (pronazione dolorosa).",o:"Margine anteriore dell’incisura radiale dell’ulna.",ins:"Margine posteriore dell’incisura radiale dell’ulna.",fn:"Mantiene la testa radiale contro l’incisura radiale e ne permette la rotazione nella prono-supinazione.",b:()=>[REAL('anulare')]},
{id:'lucl',cat:'leg',name:"Collaterale ulnare laterale (LUCL)",info:"Passa dietro la testa radiale. Si lesiona per primo nella lussazione di gomito; il pivot-shift test ne valuta l’insufficienza.",o:"Epicondilo laterale.",ins:"Cresta del supinatore dell’ulna, fondendosi con il margine posteriore del legamento anulare.",fn:"Principale stabilizzatore contro l’instabilità rotatoria postero-laterale; stabilizzatore contro il varo.",b:()=>[REAL('lucl')]},
{id:'mio',cat:'leg',name:"Membrana interossea (porzione prossimale)",info:"Prossimalmente lascia uno spazio per i vasi interossei posteriori. La sua rottura con frattura della testa radiale e lesione della radio-ulnare distale è la lesione di Essex-Lopresti.",o:"Margine interosseo del radio.",ins:"Margine interosseo dell’ulna (fibre prevalentemente oblique in senso distale e mediale).",fn:"Trasferisce il carico dal radio all’ulna; separa le logge anteriore e posteriore e dà origine ai muscoli profondi.",b:()=>[REAL('mio')]},
{id:'osborne',cat:'ret',name:"Legamento di Osborne (retinacolo del tunnel cubitale)",info:"Distalmente continua nell’aponeurosi tra i due capi del FCU. Ispessimento, assenza o lassità (con sublussazione del nervo in flessione) sono cause di neuropatia ulnare; la sua sezione è il gesto della decompressione in situ.",o:"Epicondilo mediale.",ins:"Margine mediale dell’olecrano.",fn:"Tetto del tunnel cubitale: trattiene il nervo ulnare dietro l’epicondilo; si tende in flessione, riducendo lo spazio del tunnel.",b:()=>[REAL('osborne')]},
{id:'lacerto',cat:'ten',name:"Lacerto fibroso (aponeurosi bicipitale)",info:"Sopra arteria brachiale e nervo mediano, sotto la vena mediana del gomito. Se integro può limitare la retrazione in una rottura del tendine distale del bicipite, che quindi può sfuggire all’esame clinico.",o:"Margine mediale del tendine distale del bicipite.",ins:"Fascia antibrachiale sopra i flessori-pronatori e, tramite questa, margine posteriore dell’ulna.",fn:"Trasmette parte della forza del bicipite alla fascia dell’avambraccio; protegge i vasi e il nervo sottostanti.",b:()=>[REAL('lacerto')]},
{id:'caps',cat:'caps',name:"Capsula articolare",info:"Un’unica capsula per le articolazioni omero-ulnare, omero-radiale e radio-ulnare prossimale. Prossimalmente si inserisce sopra le fossette coronoidea, radiale e olecranica (intracapsulari); distalmente sul legamento anulare e sul collo del radio. In ecografia il versamento si cerca nel recesso posteriore (fossetta olecranica) a gomito flesso.",b:()=>[REAL('caps')]},
{id:'fat_ant',cat:'adi',name:"Cuscinetto adiposo anteriore",info:"Nelle fossette coronoidea e radiale, intracapsulare ma extrasinoviale. Nella radiografia laterale a 90° è normalmente visibile come sottile banda radiotrasparente; se sollevato (segno della vela) indica versamento.",b:()=>[REAL('fat_ant')]},
{id:'fat_post',cat:'adi',name:"Cuscinetto adiposo posteriore",info:"Nella fossetta olecranica; normalmente non visibile nella radiografia laterale a 90°. Se visibile indica versamento e, nel trauma, una frattura spesso occulta (sovracondiloidea nel bambino, della testa radiale nell’adulto).",b:()=>[REAL('fat_post')]},
{id:'bor_olecr',cat:'bor',name:"Borsa olecranica",info:"Sottocutanea sopra l’olecrano, normalmente virtuale. Borsite traumatica, microcristallina, reumatoide o settica: in ecografia raccolta anecogena o complessa, con eventuale iperemia della parete.",b:()=>[REAL('bor_olecr')]},
{id:'bor_bicrad',cat:'bor',name:"Borsa bicipito-radiale",info:"Tra tendine distale del bicipite e tuberosità radiale; riduce l’attrito in pronazione. La borsite può simulare una massa della fossa cubitale e, raramente, comprimere il nervo interosseo posteriore.",b:()=>[REAL('bor_bicrad')]},
{id:'bic_lungo',cat:'brac',name:"Bicipite – capo lungo",info:"Nel braccio è il ventre laterale; sopra il gomito si fonde con il capo breve nel tendine distale comune, che ruota di circa 90° prima di inserirsi. La rottura distale avviene tipicamente nell’uomo adulto in contrazione eccentrica; in ecografia si valuta con approccio anteriore, mediale e laterale, e in posizione \"cobra\". Il setto tra i due ventri è ricostruito: posizione indicativa.",o:"Tubercolo sovraglenoideo della scapola e labbro glenoideo superiore; il tendine prossimale attraversa la spalla e scorre nel solco bicipitale.",ins:"Tuberosità radiale, con il tendine distale comune (parte prossimale dell’impronta, più lontana dall’asse di rotazione).",fn:"Supina l’avambraccio (principale supinatore a gomito flesso) e flette il gomito; coadiuva la flessione della spalla.",fo:[1.205,4.54,2.205],b:()=>[REAL('bic_lungo'),REAL('bic_lungo_setto')]},
{id:'bic_breve',cat:'brac',name:"Bicipite – capo breve",info:"Nel braccio è il ventre mediale; sopra il gomito si fonde con il capo lungo nel tendine distale comune, da cui il lacerto fibroso si porta medialmente. Il setto tra i due ventri è ricostruito: posizione indicativa.",o:"Apice del processo coracoideo, con tendine comune al coracobrachiale.",ins:"Tuberosità radiale, con il tendine distale comune (parte distale dell’impronta); lacerto fibroso verso la fascia antibrachiale.",fn:"Flette il gomito e supina l’avambraccio; coadiuva flessione e adduzione della spalla.",fo:[1.205,4.54,2.205],b:()=>[REAL('bic_breve'),REAL('bic_breve_setto')]},
{id:'brach',cat:'brac',name:"Brachiale",info:"In profondità al bicipite: forma il pavimento della fossa cubitale e copre la capsula anteriore. Innervato dal muscolocutaneo, con un contributo del radiale alla porzione laterale. Dopo traumi del gomito è una sede tipica di miosite ossificante.",o:"Metà distale della faccia anteriore dell’omero e setti intermuscolari, soprattutto il mediale.",ins:"Tuberosità ulnare e faccia anteriore del processo coronoideo.",fn:"Principale flessore del gomito in ogni posizione dell’avambraccio; inserito sull’ulna, non agisce sulla prono-supinazione.",b:()=>[REAL('brach')]},
{id:'tri_lungo',cat:'brac',name:"Tricipite – capo lungo",info:"Con gli altri capi forma il tendine distale sull’olecrano. La rottura del tendine distale è rara e spesso si associa a un piccolo frammento osseo avulso (flake sign).",o:"Tubercolo sottoglenoideo della scapola.",ins:"Olecrano (faccia superiore e posteriore), con il tendine comune; espansione alla fascia antibrachiale.",fn:"Estende il gomito; estende e adduce la spalla (biarticolare).",b:()=>[REAL('tri_lungo')]},
{id:'tri_lat',cat:'brac',name:"Tricipite – capo laterale",info:"Superficiale, converge nel tendine olecranico; copre il nervo radiale e l’arteria profonda del braccio nel solco radiale.",o:"Faccia posteriore dell’omero, sopra il solco del nervo radiale.",ins:"Olecrano, con il tendine comune; espansione laterale alla fascia antibrachiale.",fn:"Estende il gomito, soprattutto contro resistenza.",b:()=>[REAL('tri_lat')]},
{id:'tri_med',cat:'brac',name:"Tricipite – capo mediale",info:"Profondo, coperto dai capi lungo e laterale. Le fibre più profonde si inseriscono sulla capsula posteriore e la sollevano in estensione. Lo scatto del suo margine sopra l’epicondilo mediale (snapping triceps) può accompagnare la lussazione del nervo ulnare.",o:"Faccia posteriore dell’omero sotto il solco del nervo radiale e setti intermuscolari mediale e laterale.",ins:"Olecrano, con il tendine comune; capsula posteriore.",fn:"Estende il gomito: è il capo attivo in ogni estensione, anche senza resistenza.",b:()=>[REAL('tri_med')]},
{id:'pt',cat:'fless',name:"Pronatore rotondo",info:"Margine mediale della fossa cubitale. Il nervo mediano passa tra i due capi (sindrome del pronatore); l’arteria ulnare passa in profondità al capo ulnare.",o:"Capo omerale: epicondilo mediale (origine tendinea comune) e cresta sopracondiloidea mediale. Capo ulnare: margine mediale del processo coronoideo.",ins:"Faccia laterale del radio a metà diafisi (tuberosità del pronatore).",fn:"Prona l’avambraccio; coadiuva la flessione del gomito.",b:()=>[REAL('pt')]},
{id:'fcr',cat:'fless',name:"Flessore radiale del carpo (FCR)",info:"Tra pronatore rotondo (lateralmente) e palmare lungo. L’origine tendinea comune è la sede dell’epicondilite mediale, meno frequente della laterale; il fascio anteriore del collaterale ulnare decorre subito in profondità. Al polso scorre nel proprio tunnel accanto al trapezio.",o:"Epicondilo mediale dell’omero (tendine comune dei flessori).",ins:"Base del II metacarpo (faccia volare).",fn:"Flette il polso e lo abduce (deviazione radiale).",b:()=>[REAL('fcr')]},
{id:'pl',cat:'fless',name:"Palmare lungo",info:"Ventre breve e tendine lungo verso l’aponeurosi palmare. Assente in circa il 15% dei soggetti; usato come innesto tendineo, per esempio nella ricostruzione del collaterale ulnare dei lanciatori.",o:"Epicondilo mediale dell’omero (tendine comune dei flessori).",ins:"Faccia superficiale del retinacolo dei flessori e aponeurosi palmare.",fn:"Flette il polso e tende l’aponeurosi palmare.",b:()=>[REAL('pl')]},
{id:'fds',cat:'fless',name:"Flessore superficiale delle dita (FDS)",info:"I due capi sono uniti da un’arcata fibrosa sotto cui passano nervo mediano e arteria ulnare: possibile sede di compressione del mediano, che poi scende aderente alla faccia profonda del muscolo.",o:"Capo omero-ulnare: epicondilo mediale (tendine comune), collaterale ulnare e processo coronoideo. Capo radiale: linea obliqua e margine anteriore del radio.",ins:"Ai lati della falange intermedia del II–V dito (chiasma di Camper).",fn:"Flette le IFP e, secondariamente, MCF e polso.",b:()=>[REAL('fds')]},
{id:'fdp',cat:'fless',name:"Flessore profondo delle dita (FDP)",info:"Strato profondo, sotto il FDS. Doppia innervazione: porzione mediale (IV–V dito) dall’ulnare, laterale (II–III) dall’interosseo anteriore (mediano).",o:"Faccia anteriore e mediale dei tre quarti prossimali dell’ulna, faccia mediale del coronoide e membrana interossea.",ins:"Base volare della falange distale del II–V dito.",fn:"Flette le IFD e, secondariamente, IFP, MCF e polso.",b:()=>[REAL('fdp')]},
{id:'fcu',cat:'fless',name:"Flessore ulnare del carpo (FCU)",info:"Il più mediale dei flessori superficiali. I due capi sono uniti dall’aponeurosi di Osborne: il nervo ulnare entra nell’avambraccio passando tra di essi e resta profondo, sopra il FDP. Il ventre segue il lato mediale e postero-mediale dell’ulna, all’altezza del bordo posteriore sottocutaneo (non dietro l’olecrano).",o:"Capo omerale: epicondilo mediale (tendine comune). Capo ulnare: margine mediale dell’olecrano e, con un’aponeurosi, due terzi prossimali del margine posteriore dell’ulna.",ins:"Pisiforme e, tramite i legamenti piso-uncinato e piso-metacarpale, uncinato e base del V metacarpo.",fn:"Flette il polso e lo adduce (deviazione ulnare).",b:()=>[REAL('fcu')]},
{id:'br',cat:'est',name:"Brachioradiale",info:"Margine laterale della fossa cubitale. Il nervo radiale decorre nel solco tra brachioradiale e brachiale; il ramo superficiale scende sotto il suo ventre. Flessore del gomito pur essendo innervato dal radiale; con ECRL ed ECRB forma la \"mobile wad\" (massa mobile di Henry).",o:"Due terzi prossimali della cresta sopracondiloidea laterale dell’omero e setto intermuscolare laterale.",ins:"Base dello stiloide radiale.",fn:"Flette il gomito, soprattutto in semipronazione; riporta l’avambraccio in posizione intermedia.",b:()=>[REAL('br')]},
{id:'ecrl',cat:'est',name:"Estensore radiale lungo del carpo (ECRL)",info:"Subito sotto il brachioradiale. Al polso scorre nel II compartimento.",o:"Terzo distale della cresta sopracondiloidea laterale dell’omero e setto intermuscolare laterale.",ins:"Base del II metacarpo (faccia dorsale).",fn:"Estende il polso e lo abduce (deviazione radiale); coadiuva la flessione del gomito.",b:()=>[REAL('ecrl')]},
{id:'ecrb',cat:'est',name:"Estensore radiale breve del carpo (ECRB)",info:"La sua origine profonda è la sede principale dell’epicondilite laterale: in ecografia tendine ispessito e ipoecogeno, con eventuali calcificazioni, iperemia al Doppler e rotture parziali. Il suo margine tendineo prossimale può comprimere il nervo interosseo posteriore.",o:"Epicondilo laterale dell’omero (tendine comune degli estensori) e collaterale radiale.",ins:"Base del III metacarpo (faccia dorsale).",fn:"Estende il polso.",b:()=>[REAL('ecrb')]},
{id:'edc',cat:'est',name:"Estensore delle dita (EDC)",info:"Superficiale al supinatore e al nervo interosseo posteriore. Al polso scorre nel IV compartimento con l’EIP.",o:"Epicondilo laterale dell’omero (tendine comune degli estensori).",ins:"Apparato estensore del II–V dito (falangi intermedia e distale).",fn:"Estende le dita e il polso.",b:()=>[REAL('edc')]},
{id:'ecu',cat:'est',name:"Estensore ulnare del carpo (ECU)",info:"Il più mediale degli estensori superficiali. Al polso scorre nel VI compartimento, nel solco dell’ulna.",o:"Capo omerale: epicondilo laterale (tendine comune degli estensori). Capo ulnare: margine posteriore dell’ulna, con un’aponeurosi comune a FCU e FDP.",ins:"Base del V metacarpo (lato ulnare).",fn:"Estende il polso e lo adduce (deviazione ulnare).",b:()=>[REAL('ecu')]},
{id:'sup',cat:'est',name:"Supinatore",info:"Due strati avvolgono il collo del radio: il nervo interosseo posteriore passa tra i due. Il margine prossimale dello strato superficiale forma l’arcata di Frohse, sede principale della sindrome del NIP e del tunnel radiale.",o:"Epicondilo laterale, collaterale radiale, legamento anulare, cresta e fossa del supinatore dell’ulna.",ins:"Facce laterale, anteriore e posteriore del terzo prossimale del radio, tra tuberosità radiale e inserzione del pronatore rotondo.",fn:"Supina l’avambraccio: da solo nei movimenti lenti e a gomito esteso, con il bicipite contro resistenza.",b:()=>[REAL('sup')]},
{id:'anc',cat:'est',name:"Anconeo",info:"Copre la capsula postero-laterale e il legamento anulare. Repere della via d’accesso laterale di Kocher (tra anconeo ed ECU). Da non confondere con l’anconeo epitrocleare, muscolo accessorio mediale che può comprimere il nervo ulnare nel tunnel cubitale.",o:"Faccia posteriore dell’epicondilo laterale, con un breve tendine.",ins:"Faccia laterale dell’olecrano e quarto prossimale della faccia posteriore dell’ulna.",fn:"Coadiuva il tricipite nell’estensione; tende la capsula e stabilizza dinamicamente il versante postero-laterale.",b:()=>[REAL('anc')]},
{id:'a_brachiale',nw:1,cat:'art',name:"Arteria brachiale",info:"Nel solco bicipitale mediale, lateralmente al nervo mediano; al gomito medialmente al tendine del bicipite, sotto il lacerto fibroso. Si divide in radiale e ulnare poco sotto la piega del gomito, a livello del collo del radio. Calibro circa 4 mm. A rischio nelle fratture sovracondiloidee in estensione del bambino.",b:TUBE('a_brachiale')},
{id:'a_radiale',nw:1,cat:'art',name:"Arteria radiale",info:"Ramo laterale della biforcazione: scende obliqua davanti al tendine del bicipite, al supinatore e al pronatore rotondo, sotto il margine mediale del brachioradiale. Calibro circa 2,5–3 mm; poco sotto l’origine dà la ricorrente radiale.",b:TUBE('a_radiale')},
{id:'a_ulnare',nw:1,cat:'art',name:"Arteria ulnare",info:"Passa in profondità al capo ulnare del pronatore rotondo e sotto l’arcata del FDS; distalmente si affianca al nervo ulnare sotto il FCU. È il ramo più voluminoso della biforcazione (circa 3 mm) e dà origine all’arteria interossea comune e alle ricorrenti ulnari.",b:TUBE('a_ulnare')},
{id:'v_cefalica',nw:1,cat:'ven',name:"Vena cefalica",info:"Superficiale: sul margine laterale dell’avambraccio e, sopra il gomito, nel solco bicipitale laterale; sale lungo il braccio fino alla vena ascellare. Sotto la piega del gomito riceve la mediana cefalica e cede una quota alla mediana del gomito. Il nervo cutaneo laterale dell’avambraccio le corre accanto, medialmente e nello stesso piano (a contatto fino a circa 7 cm sotto la piega): a rischio nelle venipunture laterali.",b:TUBE('v_cefalica')},
{id:'v_basilica',nw:1,cat:'ven',name:"Vena basilica",info:"Superficiale sul versante mediale: sale davanti all’epicondilo mediale con i rami del nervo cutaneo mediale dell’avambraccio, riceve la mediana basilica e la mediana del gomito, e a circa metà braccio perfora la fascia profonda per proseguire medialmente all’arteria brachiale. Di norma è la più voluminosa delle vene superficiali del gomito.",b:TUBE('v_basilica')},
{id:'v_mediana_cub',nw:1,cat:'ven',name:"Vena mediana del gomito",info:"Anastomosi obliqua tra cefalica e basilica davanti alla fossa cubitale, superficiale al lacerto fibroso che la separa da arteria brachiale e nervo mediano: sede abituale del prelievo venoso. Disposizione e calibro delle vie di collegamento (mediana del gomito, mediana cefalica, mediana basilica) variano molto da soggetto a soggetto; nel modello sono rappresentate insieme.",b:TUBE('v_mediana_cub')},
{id:'v_mediana_cefalica',nw:1,cat:'ven',name:"Vena mediana cefalica",info:"Ramo laterale della biforcazione della vena mediana dell’avambraccio (pattern a M): sale obliquamente verso il lato laterale, superficiale ai muscoli epicondiloidei laterali, e sfocia nella cefalica sotto la piega del gomito. Scavalca il nervo cutaneo laterale dell’avambraccio, che le passa sotto.",b:TUBE('v_mediana_cefalica')},
{id:'v_mediana_basilica',nw:1,cat:'ven',name:"Vena mediana basilica",info:"Ramo mediale della biforcazione della vena mediana dell’avambraccio (pattern a M): sale obliquamente sopra il lacerto fibroso, che la separa dall’arteria brachiale, e sfocia nella basilica. Accanto passano i rami del nervo cutaneo mediale dell’avambraccio, a rischio nelle venipunture mediali.",b:TUBE('v_mediana_basilica')},
{id:'n_ulnare',nw:1,cat:'ner',name:"Nervo ulnare",info:"Nervo misto. Dietro il setto intermuscolare mediale, poi nel tunnel cubitale dietro l’epicondilo mediale, sotto il legamento di Osborne, e tra i capi del FCU. Nel braccio non dà rami; motorio per FCU, metà ulnare del FDP e gran parte degli intrinseci della mano; sensitivo per il margine ulnare della mano, il mignolo e metà dell’anulare. Il tunnel cubitale è la seconda sede di neuropatia compressiva dell’arto superiore: in ecografia si misura l’area di sezione all’epicondilo (oltre circa 10 mm² in genere patologica, con cut-off variabili tra gli studi) e si valuta la stabilità in flessione.",b:TUBE('n_ulnare')},
{id:'n_mediano',nw:1,cat:'ner',name:"Nervo mediano",info:"Nervo misto. Medialmente all’arteria brachiale; al gomito sotto il lacerto fibroso, poi tra i capi del pronatore rotondo e sotto l’arcata del FDS. Nel braccio non dà rami; motorio per flessori e pronatori dell’avambraccio (esclusi FCU e metà ulnare del FDP), in parte tramite il NIA, per i tenari superficiali e i lombricali I–II; sensitivo per la faccia palmare di pollice, indice, medio e metà radiale dell’anulare. Siti di compressione: legamento di Struthers (se c’è un processo sovracondiloideo), lacerto fibroso, pronatore rotondo, arcata del FDS.",b:TUBE('n_mediano')},
{id:'n_radiale',nw:1,cat:'ner',name:"Nervo radiale",info:"Nervo misto. Perfora il setto intermuscolare laterale e scende tra brachiale e brachioradiale, davanti all’epicondilo laterale; prima della divisione innerva tricipite e anconeo (nel braccio), brachioradiale ed ECRL. Circa a livello della rima omero-radiale si divide in ramo superficiale (sensitivo) e nervo interosseo posteriore (motorio).",b:TUBE('n_radiale')},
{id:'n_rad_sup',nw:1,cat:'ner',name:"Ramo superficiale del nervo radiale",info:"Sensitivo: dorso radiale della mano, del pollice e della parte prossimale di indice e medio. Scende sotto il brachioradiale, lateralmente all’arteria radiale, ed emerge nel terzo distale dell’avambraccio (sindrome di Wartenberg).",b:TUBE('n_rad_sup')},
{id:'n_pin',nw:1,cat:'ner',name:"Nervo interosseo posteriore (NIP)",info:"Motorio per supinatore ed estensori della loggia posteriore (EDC, EDM, ECU, APL, EPL, EPB, EIP; spesso anche ECRB); nessun territorio cutaneo. Entra nel supinatore sotto l’arcata di Frohse, avvolge lateralmente il collo del radio e riemerge dorsalmente tra gli estensori. Sindrome del NIP: deficit di estensione delle dita senza deficit sensitivo, con polso esteso in deviazione radiale (ECRL risparmiato); sindrome del tunnel radiale: dolore laterale senza deficit motorio.",b:TUBE('n_pin')},
{id:'n_cut_lat',nw:1,cat:'ner',name:"Nervo muscolocutaneo e cutaneo laterale dell’avambraccio (rami anteriore e posteriore)",info:"Il muscolocutaneo (misto) scende tra bicipite e brachiale, che innerva, ed emerge lateralmente al tendine del bicipite come nervo cutaneo laterale dell’avambraccio, sensitivo per la faccia laterale dell’avambraccio. Nel sottocute passa sotto la vena mediana del gomito e corre mediale alla cefalica, a contatto con lei nel primo tratto dell’avambraccio. Si divide in ramo anteriore (volare), verso l’arteria radiale, e ramo posteriore (dorsale), che passa sotto la cefalica; la quota della biforcazione varia molto. A rischio nella reinserzione chirurgica del bicipite e nelle venipunture laterali.",b:()=>[...vessel('n_cut_lat'),...vessel('n_cut_lat_post')]},
{id:'quadrato',cat:'leg',name:"Legamento quadrato (di Denucé)",info:"Sottile banda fibrosa subito sotto il legamento anulare. Ricostruzione approssimata; in imaging è raramente distinguibile.",o:"Margine inferiore dell’incisura radiale dell’ulna.",ins:"Faccia mediale del collo del radio.",fn:"Sostiene la capsula e limita l’eccessiva rotazione del radio.",b:()=>[REAL('quadrato')]},
{id:'setto_med',cat:'set',name:"Setto intermuscolare mediale",info:"Dalla cresta sopracondiloidea mediale alla fascia profonda: separa il compartimento anteriore (flessori) dal posteriore (tricipite). Il nervo ulnare lo perfora a metà braccio e prosegue dietro di esso (arcata di Struthers, circa 8 cm prossimale all’epicondilo mediale: possibile sito di compressione) fino al tunnel cubitale. In ecografia è un utile repere per ritrovare il nervo. Nascosto di default: attivalo dall’elenco.",b:()=>[REAL('setto_med')]},
{id:'setto_lat',cat:'set',name:"Setto intermuscolare laterale",info:"Dalla cresta sopracondiloidea laterale alla fascia profonda; dà origine a brachioradiale, ECRL, brachiale e tricipite. Il nervo radiale lo perfora nel terzo distale del braccio passando dal compartimento posteriore all’anteriore: qui il nervo è fisso e vulnerabile nelle fratture di diafisi omerale distale (tipo Holstein-Lewis). Nascosto di default.",b:()=>[REAL('setto_lat')]},
{id:'linfonodi',cat:'lin',name:"Linfonodi epitrocleari (sovratrocleari)",info:"Uno o due linfonodi sul versante mediale del braccio, alcuni centimetri sopra l’epicondilo mediale, vicino alla vena basilica; drenano mano e avambraccio ulnare. Si ingrandiscono in infezioni della mano e dell’avambraccio, linfomi e melanoma. Numero e posizione sono variabili: nel modello sono solo indicativi.",b:()=>[REAL('linfonodi')]},
{id:'fpl',cat:'fless',name:"Flessore lungo del pollice (FPL)",info:"Strato profondo, lateralmente al FDP: tra i due scende il nervo interosseo anteriore. Un capo accessorio (muscolo di Gantzer), da coronoide o epicondilo mediale, può comprimere il nervo interosseo anteriore. Nella finestra del modello è visibile solo il ventre prossimale (ricostruito sulle ossa reali, forma approssimata); il tendine prosegue nel tunnel carpale.",o:"Faccia anteriore del radio, da sotto la tuberosità e la linea obliqua fino al pronatore quadrato, e membrana interossea adiacente.",ins:"Base volare della falange distale del pollice.",fn:"Flette la IF del pollice e, secondariamente, la MCF.",b:()=>[REAL('fpl')]},
{id:'edm',cat:'est',name:"Estensore proprio del mignolo (EDM)",info:"Ventre sottile e fusato dello strato superficiale, tra EDC (lateralmente) ed ECU (medialmente), spesso unito all’EDC. Innervato dal nervo interosseo posteriore; al polso scorre nel V compartimento.",o:"Epicondilo laterale dell’omero (tendine comune degli estensori), con l’EDC.",ins:"Apparato estensore del mignolo.",fn:"Estende il mignolo.",b:()=>[REAL('edm')]},
{id:'apl',cat:'est',name:"Abduttore lungo del pollice (APL)",info:"Strato profondo, coperto da EDC ed EDM, con il nervo interosseo posteriore sulla sua superficie. Più in basso emerge tra ECRB ed EDC e incrocia gli estensori radiali (sindrome da intersezione); al polso, con l’estensore breve del pollice, forma il I compartimento (tenosinovite di De Quervain). Nella finestra del modello è presente solo la parte prossimale.",o:"Parte laterale della faccia posteriore dell’ulna sotto l’anconeo, membrana interossea e terzo medio della faccia posteriore del radio, sotto il supinatore.",ins:"Base del I metacarpo (lato radiale).",fn:"Abduce ed estende il pollice alla trapezio-metacarpale.",b:()=>[REAL('apl')]},
{id:'epl',cat:'est',name:"Estensore lungo del pollice (EPL)",info:"Strato profondo, medialmente all’APL. Al polso, nel III compartimento, cambia direzione attorno al tubercolo di Lister: sede tipica di rottura tardiva dopo frattura del radio distale. Nella finestra solo il ventre prossimale.",o:"Terzo medio della faccia posteriore dell’ulna (parte laterale), sotto l’APL, e membrana interossea.",ins:"Base dorsale della falange distale del pollice.",fn:"Estende la IF del pollice; lo adduce e lo retropone.",b:()=>[REAL('epl')]},
{id:'a_collat_ulnare_sup',nw:1,cat:'art',name:"Arteria collaterale ulnare superiore",info:"Dalla brachiale a metà braccio; accompagna il nervo ulnare dietro il setto intermuscolare mediale fino al tunnel cubitale e si anastomizza con la ricorrente ulnare posteriore (rete articolare del gomito; nel modello le due si incontrano in un punto). Calibro circa 1,5 mm.",b:TUBE('a_collat_ulnare_sup')},
{id:'a_collat_ulnare_inf',nw:1,cat:'art',name:"Arteria collaterale ulnare inferiore",info:"Origina dalla brachiale alcuni centimetri sopra l’epicondilo mediale, decorre davanti ad esso e si anastomizza con la ricorrente ulnare anteriore (nel modello si incontrano in un punto). Calibro circa 1,5 mm.",b:TUBE('a_collat_ulnare_inf')},
{id:'a_collat_radiale',nw:1,cat:'art',name:"Arteria collaterale radiale",info:"Ramo dell’arteria profonda del braccio: accompagna il nervo radiale nel solco, poi davanti all’epicondilo laterale, e si anastomizza con la ricorrente radiale (nel modello si incontrano in un punto). Calibro circa 1,5–2 mm.",b:TUBE('a_collat_radiale')},
{id:'a_ricorrente_radiale',nw:1,cat:'art',name:"Arteria ricorrente radiale",info:"Dall’arteria radiale subito dopo l’origine; risale lateralmente tra brachioradiale e brachiale, vicino al nervo radiale, verso l’epicondilo laterale, dove si anastomizza con la collaterale radiale. Calibro circa 1,5–2 mm.",b:TUBE('a_ricorrente_radiale')},
{id:'a_ricorrente_ulnare_ant',nw:1,cat:'art',name:"Arteria ricorrente ulnare – ramo anteriore",info:"Dall’ulnare; risale tra brachiale e pronatore rotondo davanti all’epicondilo mediale, dove si anastomizza con la collaterale ulnare inferiore. Calibro circa 1,2 mm.",b:TUBE('a_ricorrente_ulnare_ant')},
{id:'a_ricorrente_ulnare_post',nw:1,cat:'art',name:"Arteria ricorrente ulnare – ramo posteriore",info:"Dall’ulnare; passa tra FDS e FDP, poi tra i capi del FCU e risale dietro l’epicondilo mediale con il nervo ulnare e si anastomizza con la collaterale ulnare superiore. Calibro circa 1,5 mm.",b:TUBE('a_ricorrente_ulnare_post')},
{id:'a_interossea_comune',nw:1,cat:'art',name:"Arteria interossea comune",info:"Breve tronco dall’arteria ulnare, 1–2 cm sotto l’origine; si divide in interossea anteriore e posteriore al margine prossimale della membrana interossea. Calibro circa 2 mm.",b:TUBE('a_interossea_comune')},
{id:'a_interossea_ant',nw:1,cat:'art',name:"Arteria interossea anteriore",info:"Scende sulla faccia anteriore della membrana interossea, tra FDP e FPL, con il nervo interosseo anteriore. Calibro circa 1–1,5 mm.",b:TUBE('a_interossea_ant')},
{id:'a_interossea_post',nw:1,cat:'art',name:"Arteria interossea posteriore",info:"Passa sopra il margine prossimale della membrana interossea nella loggia dorsale e accompagna il nervo interosseo posteriore tra gli strati degli estensori. Calibro circa 1–1,5 mm.",b:TUBE('a_interossea_post')},
{id:'v_comitante_med',nw:1,cat:'ven',name:"Vena brachiale mediale (comitante)",info:"Una delle due vene profonde che accompagnano l’arteria brachiale, unite da anastomosi trasversali; nasce dalla confluenza delle vene comitanti dell’ulnare e prosegue fino alla vena ascellare. In eco-Doppler si vedono ai lati dell’arteria.",b:TUBE('v_comitante_med')},
{id:'v_comitante_lat',nw:1,cat:'ven',name:"Vena brachiale laterale (comitante)",info:"Seconda vena profonda accanto all’arteria brachiale; nasce dalla confluenza delle vene comitanti della radiale e riceve la vena perforante del gomito.",b:TUBE('v_comitante_lat')},

/* ============ Texture fibrose (colore + normal map) ============ */
function fiberTextures(){
  const W=512,H=256,prof=new Float32Array(W);
  let x=0;while(x<W){const bw=9+Math.floor(Math.random()*16),base=0.72+Math.random()*0.28;
    for(let i=0;i<bw&&x<W;i++,x++){const e=Math.min(i,bw-1-i),edge=Math.min(1,e/2.2);prof[x]=base*(0.5+0.5*edge)+(Math.random()-0.5)*0.1;}}
  const hgt=new Float32Array(W*H);
  const at=xx=>{xx=((xx%W)+W)%W;const i=Math.floor(xx),f=xx-i;return prof[i]*(1-f)+prof[(i+1)%W]*f;};
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const wv=3*Math.sin(y/H*Math.PI*4+xx*0.025)+1.5*Math.sin(y/H*Math.PI*10+xx*0.07);
    hgt[y*W+xx]=at(xx+wv)+0.035*Math.sin(y*0.9+xx*0.3);}
  const c1=document.createElement('canvas'),c2=document.createElement('canvas');c1.width=c2.width=W;c1.height=c2.height=H;
  const g1=c1.getContext('2d'),g2=c2.getContext('2d'),d1=g1.createImageData(W,H),d2=g2.createImageData(W,H);
  const hv=(xx,y)=>hgt[((y+H)%H)*W+((xx+W)%W)];
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4,h=hv(xx,y);
    const k=Math.round(clamp(0.87+0.13*h,0,1)*255);d1.data[i]=k;d1.data[i+1]=k;d1.data[i+2]=k;d1.data[i+3]=255;
    let nx=(hv(xx-1,y)-hv(xx+1,y))*2.2,ny=(hv(xx,y-1)-hv(xx,y+1))*2.2,nz=1;const l=Math.hypot(nx,ny,nz);
    d2.data[i]=Math.round((nx/l*0.5+0.5)*255);d2.data[i+1]=Math.round((ny/l*0.5+0.5)*255);d2.data[i+2]=Math.round((nz/l*0.5+0.5)*255);d2.data[i+3]=255;}
  g1.putImageData(d1,0,0);g2.putImageData(d2,0,0);
  const t1=new THREE.CanvasTexture(c1),t2=new THREE.CanvasTexture(c2);
  [t1,t2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;});t1.encoding=THREE.sRGBEncoding;
  return {map:t1,normal:t2};
}

/* shader: fibre muscolari in rilievo lungo la direzione del muscolo + bordi Fresnel */
const NOISE_GLSL=`
float fbH(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float fbN(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(fbH(i),fbH(i+vec3(1,0,0)),f.x),mix(fbH(i+vec3(0,1,0)),fbH(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(fbH(i+vec3(0,0,1)),fbH(i+vec3(1,0,1)),f.x),mix(fbH(i+vec3(0,1,1)),fbH(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbF(vec2 q,float a){return 0.55*fbN(vec3(q*5.5,a*0.22))+0.3*fbN(vec3(q*14.0,a*0.5+7.0))+0.15*fbN(vec3(q*32.0,a*1.1+3.0));}
`;
function shaderize(m,o){
  m.onBeforeCompile=sh=>{
    if(o.fiber){
      sh.uniforms.fO={value:m.userData.fO||new THREE.Vector3()};
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 fdir;\nattribute float tw;\nuniform vec3 fO;\nvarying vec3 vFd;\nvarying vec3 vOP;\nvarying float vTw;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\nvFd=fdir;vOP=position-fO;vTw=tw;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vFd;\nvarying vec3 vOP;\nvarying float vTw;\n'+NOISE_GLSL)
        .replace('#include <color_fragment>',`#include <color_fragment>
  vec3 fF=normalize(vFd+vec3(1e-4,2e-4,-1e-4));vec3 fU=abs(fF.y)<0.9?vec3(0.,1.,0.):vec3(1.,0.,0.);
  vec3 fB1=normalize(cross(fF,fU));vec3 fB2=cross(fF,fB1);float fA=dot(vOP,fF);vec2 fP=vec2(dot(vOP,fB1),dot(vOP,fB2));
  float fH=fbF(fP,fA);diffuseColor.rgb*=mix(0.84+0.3*fH,0.97+0.06*fH,vTw);`)
        .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  {float fe=0.025;float fhx=fbF(fP+vec2(fe,0.),fA),fhy=fbF(fP+vec2(0.,fe),fA);
   vec3 fg=((fhx-fH)*fB1+(fhy-fH)*fB2)/fe;vec3 fgv=(viewMatrix*vec4(fg,0.)).xyz;
   normal=normalize(normal-${o.fiber.toFixed(3)}*(1.0-0.65*vTw)*(fgv-dot(fgv,normal)*normal));}`)
        .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n  roughnessFactor*=mix(1.0,0.55,vTw);');
    }
    if(o.fresnel)sh.fragmentShader=sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
      'float frE=pow(1.0-abs(dot(normalize(normal),normalize(vViewPosition))),2.0);\n\tgl_FragColor = vec4( outgoingLight, clamp(diffuseColor.a+'+o.fresnel.toFixed(2)+'*frE*(1.0-diffuseColor.a)*1.6,0.0,1.0) );');
  };
  m.customProgramCacheKey=()=>'sh'+JSON.stringify(o);return m;
}

  const SKIP=new Set(['caps','cute','bor','gua','spa']),DEEP=new Set(['ossa','cart','leg','adi']);
  items.forEach(({s,g})=>{if(SKIP.has(s.cat)||s.id==='lacerto')return;const deep=DEEP.has(s.cat);const p=g.attributes.position.array,ix=g.index.array;
    for(let t=0;t<ix.length;t+=3){const a=3*ix[t],b=3*ix[t+1],c=3*ix[t+2];
      const L=Math.max(Math.hypot(p[a]-p[b],p[a+1]-p[b+1],p[a+2]-p[b+2]),Math.hypot(p[a]-p[c],p[a+1]-p[c+1],p[a+2]-p[c+2]),Math.hypot(p[b]-p[c],p[b+1]-p[c+1],p[b+2]-p[c+2]));
      const m=Math.max(1,Math.ceil(L/0.07));
      for(let u=0;u<=m;u++)for(let v=0;v<=m-u;v++){const w=m-u-v;
        const id=vid((p[a]*u+p[b]*v+p[c]*w)/m,(p[a+1]*u+p[b+1]*v+p[c+1]*w)/m,(p[a+2]*u+p[b+2]*v+p[c+2]*w)/m);
        if(id>=0){gA[id]=1;if(deep)gD[id]=1;}}}});
  const dil=G=>{const H=G.slice();for(let id=0;id<G.length;id++)if(G[id]){if(id>0)H[id-1]=1;if(id+1<G.length)H[id+1]=1;if(id>=NX)H[id-NX]=1;if(id+NX<G.length)H[id+NX]=1;if(id>=NXY)H[id-NXY]=1;if(id+NXY<G.length)H[id+NXY]=1;}return H;};

  items.forEach(({s,g})=>{if(SKIP.has(s.cat)||s.id==='lacerto')return;const G=DEEP.has(s.cat)?GD:GA;
    const p=g.attributes.position.array,nm=g.attributes.normal.array,n=p.length/3,ao=new Float32Array(n);

    const ix=g.index.array;
    for(let pass=0;pass<2;pass++){const sum=new Float32Array(n),cnt=new Float32Array(n);
      for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2];sum[a]+=ao[b]+ao[c];sum[b]+=ao[a]+ao[c];sum[c]+=ao[a]+ao[b];cnt[a]+=2;cnt[b]+=2;cnt[c]+=2;}
      for(let i=0;i<n;i++)ao[i]=(ao[i]*2+sum[i])/(2+cnt[i]);}

    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform float capOn;uniform vec3 capCol;').replace('#include <dithering_fragment>','#include <dithering_fragment>\nif(!gl_FrontFacing&&capOn>0.5){gl_FragColor=vec4(capCol*0.92,1.0);}');};
  const pk=m.customProgramCacheKey?m.customProgramCacheKey.bind(m):null;m.customProgramCacheKey=()=>(pk?pk():'')+'|cap';m.needsUpdate=true;}
function setClip(on){clipOn=on;applyClip();capOn.value=on?1:0;S.forEach(s=>{if(s.mat){capPatch(s);s.mat.clippingPlanes=on?[clipWorld]:null;s.mat.clipShadows=on;s.mat.needsUpdate=true;}});}

function goReg(R,btn){
  if(curReg===R){exitReg();S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();return;}
  curReg=R;[...regsEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',b===btn));
  const ids=new Set(R.ids);S.forEach(s=>setVis(s,ids.has(s.id)||BO.includes(s.cat)));sync();select(null);

  else{clipBar.hidden=true;setClip(false);}
  const fl=root.rotation.z!==0;root.updateMatrixWorld();

function loop(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/650),k=ease(t);
    cam.theta=anim.from.theta+(anim.to.theta-anim.from.theta)*k;cam.phi=anim.from.phi+(anim.to.phi-anim.from.phi)*k;cam.r=anim.from.r+(anim.to.r-anim.from.r)*k;cam.target.lerpVectors(anim.from.tg,anim.to.tg,k);if(t>=1)anim=null;}
