<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe4e9; --bg-hi:#f4f6f8; --bg-lo:#c9d0d7; --panel:#f8f9fa; --ink:#1c2632; --muted:#5a6876; --line:#cdd5dd; --accent:#2c6b8a; --shadow:0 6px 24px rgba(20,35,50,.14);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#161c23;--bg-hi:#2a333d;--bg-lo:#0d1116;--panel:#1e262f;--ink:#e5eaef;--muted:#93a1ae;--line:#324050;--accent:#72b4d0;--shadow:0 6px 24px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--bg-hi) 0%,var(--bg) 62%,var(--bg-lo) 100%);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.title{pointer-events:auto}
.title h1{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;margin:0}
.title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.views{display:flex;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.views button{border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:12.5px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.sect{display:inline-flex;gap:2px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:6px;box-shadow:var(--shadow)}
.sect button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.sect button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.views .flip{margin-left:2px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;font-size:15px;line-height:1;padding:6px 9px}
.views .flip[aria-pressed="true"],.views .flip[aria-pressed="false"]{background:transparent;color:var(--ink)}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:14px;pointer-events:none}
#load .bar{width:180px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#load[hidden]{display:none}

#card{position:fixed;left:12px;right:12px;bottom:calc(var(--sheetH,120px) + 10px);max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
#card[hidden]{display:none}
#card h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 28px 2px 0;line-height:1.2}
#card .cat{color:var(--muted);font-size:12.5px;margin:0 0 6px}
#card .info{margin:0 0 10px;line-height:1.45;font-size:14px;max-height:36vh;overflow:auto}
#card .info p{margin:0}
#card .oif{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:5px 10px;margin:0;font-size:13.5px}
#card .info p+.oif{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#card .oif dt{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#card .oif dd{margin:0}
#card .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}

#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:16px 16px 0 0}
.chips{padding-bottom:2px}.chips-in{display:flex;flex-wrap:wrap;gap:6px}  /* computer: a capo, senza scorrimento */
.regs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;align-items:center}
.regs::-webkit-scrollbar{display:none}
.regs .rl{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.regs button{flex:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.regs button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
#regNote{font-size:12.5px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:9px;padding:7px 9px;margin:0 0 7px}
#regNote[hidden],#clipBar[hidden]{display:none}
#clipBar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 7px}
#clipBar input{flex:1;accent-color:var(--accent)}
#clipV{min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px 6px 8px;font-size:13px;font-weight:500;white-space:nowrap}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
.chip[data-state="off"]{color:var(--muted)}
.chip[data-state="off"] .dot{background:transparent}
.chip[data-state="part"] .dot{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
/* smartphone: categorie su 3 righe compatte con scorrimento orizzontale (larghezza calcolata nello script) e chip compatti */
@media (max-width:600px){.chips{overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips-in{gap:5px}.chip{padding:4px 9px 4px 6px;gap:5px;font-size:12.5px}.chip .dot{width:10px;height:10px}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.row .left{display:flex;gap:6px;flex-wrap:wrap}
.toggle-list{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 2px;white-space:nowrap}
#list{max-height:0;overflow:auto;transition:max-height .25s ease}
#sheet.open #list{max-height:42vh;margin-top:6px}
.grp h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.grp h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.item{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.item input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.item label{flex:1}
.credit{font-size:11px;color:var(--muted);margin:8px 2px 0;line-height:1.35}
.item .go{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:2px 6px}
@media (min-width:900px){
  #sheet{left:auto;right:16px;bottom:16px;width:360px;border-radius:14px;border:1px solid var(--line)}
  #sheet.open #list{max-height:55vh}
  #card{left:16px;right:auto;bottom:16px;margin:0;width:400px}
}
@media (prefers-reduced-motion:reduce){#list{transition:none}}
.views .vtoggle{display:none}
@media (max-width:430px){
  .views{position:absolute;top:100%;right:14px;margin-top:6px}
  .views .vtoggle{display:flex;align-items:center;gap:6px}
  .views .vtoggle .vc{font-size:11px;opacity:.8}
  .views:not(.closed) .vtoggle .vl{display:none}
  .views:not(.closed) .vtoggle .vc{transform:rotate(180deg)}
  .views.closed button:not(.vtoggle){display:none}
}
/* ===== Smartphone: pannello richiudibile e card compatta ===== */
.sheet-tab{display:none}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  :root{--tabH:44px;--pillH:44px;--pillGap:12px}
  #sheet{left:0;right:0;bottom:0;width:auto;border:0;border-radius:0;
    padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));
    transition:transform .25s ease,visibility 0s}
  #sheet.collapsed{transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  .sheet-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;
    position:absolute;bottom:100%;left:0;right:0;width:100%;visibility:visible;
    height:var(--tabH);padding:0 22px;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    background:var(--panel);box-shadow:0 -4px 14px rgba(0,0,0,.3);font-size:13.5px;font-weight:600;white-space:nowrap}
  /* chiuso: pulsante ovale fluttuante, staccato dal bordo inferiore: sotto e ai lati si vede lo sfondo */
  #sheet.collapsed .sheet-tab{flex-direction:row;left:50%;right:auto;width:auto;transform:translateX(-50%);
    bottom:calc(100% + var(--pillGap) + env(safe-area-inset-bottom,0px));height:var(--pillH);padding:0 18px;
    border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
    background:rgba(30,38,47,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #sheet.collapsed .sheet-tab .grip{display:none}
  .sheet-tab .grip{width:32px;height:4px;border-radius:2px;background:var(--line)}
  .sheet-tab .car{display:inline-block;color:var(--accent);transition:transform .25s}
  #sheet:not(.collapsed) .sheet-tab .car{transform:rotate(180deg)}
  .sheet-body{max-height:60vh;max-height:60dvh;overflow-y:auto;overscroll-behavior:contain;padding-top:10px}
  #sheet.open #list{max-height:none}  /* un solo scorrimento: quello del pannello */
  #card{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;margin:0 auto;
    bottom:calc(var(--pillH) + var(--pillGap) + env(safe-area-inset-bottom,0px) + 10px);padding:9px 12px 10px;
    max-height:35vh;max-height:35dvh;display:flex;flex-direction:column}
  #card h2{font-size:17px}
  #card .cat{margin-bottom:4px}
  #card h2,#card .cat,#card .btns{flex:none}
  #card .info{flex:1 1 auto;min-height:0;max-height:none;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){#sheet,.sheet-tab,.sheet-tab .car{transition:none}}
/* ===== Vetro (stile "liquid glass"): barra viste, selettore sezione, card e pannello strutture =====
   Identico in tutti i modelli. Superfici semitrasparenti con sfocatura dello sfondo, bordo chiaro sottile
   e riflesso in alto. Gli elementi interni usano solo riempimenti trasparenti (niente backdrop-filter annidati). */
:root{--glass:rgba(248,249,250,.62);--glass-card:rgba(248,249,250,.8);--glass-bd:rgba(255,255,255,.7);--glass-fill:rgba(20,35,50,.05);--glass-fill-hi:rgba(20,35,50,.1);--glass-sep:rgba(20,35,50,.1);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.8);--glass-blur:blur(20px) saturate(170%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
    --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
}
:root[data-theme="dark"]{--glass:rgba(30,38,47,.55);--glass-card:rgba(30,38,47,.74);--glass-bd:rgba(255,255,255,.13);--glass-fill:rgba(255,255,255,.06);--glass-fill-hi:rgba(255,255,255,.12);--glass-sep:rgba(255,255,255,.08);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.12)}
.views,.sect,#card,#sheet{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.views,.sect{border-radius:999px;padding:3px}
.views button,.sect button{border-radius:999px;padding:6px 10px;transition:background-color .15s,color .15s}
.views button:not([aria-pressed="true"]):hover,.sect button:not([aria-selected="true"]):hover{background:var(--glass-fill-hi)}
.views .flip{border-left:1px solid var(--glass-sep);border-radius:0 999px 999px 0;padding:6px 11px 6px 9px}
.views .flip:hover{background:transparent}
#card{background:var(--glass-card);border-left:4px solid var(--c,#999);border-radius:16px}
#sheet{border-width:1px 0 0;border-radius:20px 20px 0 0}
/* computer: con l'elenco aperto il pannello non sale sotto la barra del sito e le viste; si accorcia l'elenco */
@media (min-width:900px){#sheet{border-width:1px;border-radius:20px;display:flex;flex-direction:column;
    max-height:calc(100vh - env(safe-area-inset-top,0px) - 136px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 136px)}
  .sheet-body{display:flex;flex-direction:column;min-height:0}
  .sheet-body>*{flex:none}.sheet-body>#list{flex:0 1 auto;min-height:0}}
.chip,.btn{background:var(--glass-fill);border-color:var(--glass-bd);transition:background-color .15s}
.chip:hover,.btn:not(.primary):not([aria-pressed="true"]):hover{background:var(--glass-fill-hi)}
.btn{border-radius:999px;padding:6px 12px}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.item{border-bottom-color:var(--glass-sep)}
#card .info p+.oif{border-top-color:var(--glass-sep)}
.regs button{background:var(--glass-fill)}
.regs button[aria-pressed="true"]{background:var(--accent)}
@media (max-width:600px),(orientation:landscape) and (max-height:500px){
  /* aperto: pannello e intestazione formano un'unica lastra, un po' più piena perché l'intestazione,
     figlia del pannello sfocato, in Chrome non può sfocare a sua volta ciò che sta dietro */
  #sheet{background:var(--glass-card);border-width:0;border-radius:0}
  .sheet-tab{background:var(--glass-card);border-top:1px solid var(--glass-bd);border-radius:20px 20px 0 0;box-shadow:var(--glass-hl),0 -6px 18px rgba(0,0,0,.25);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  #sheet.collapsed .sheet-tab{background:var(--glass);border:1px solid var(--glass-bd);box-shadow:var(--glass-hl),var(--shadow)}
  #sheet.collapsed{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>
<canvas id="c" tabindex="0" aria-label="Modello 3D della spalla: trascina per ruotare, pizzica per ingrandire, tocca una struttura per il dettaglio"></canvas>
<div id="load"><span id="loadTxt">Costruzione del modello…</span><div class="bar"><i id="loadBar"></i></div></div>

<div class="top">
  <div class="title">
    <h1>Spalla destra</h1>
  </div>
  <nav class="views closed" aria-label="Vista">
    <button data-view="ant" aria-pressed="true">Ant</button>
    <button data-view="post" aria-pressed="false">Post</button>
    <button data-view="lat" aria-pressed="false">Lat</button>
    <button data-view="med" aria-pressed="false">Med</button>
    <button class="vtoggle" id="bViews" aria-expanded="false" aria-label="Scegli la vista"><span class="vl">Vista</span><span class="vc" aria-hidden="true">▾</span></button>
  </nav>
</div>

<div id="card" hidden role="dialog" aria-live="polite">
  <button class="x" aria-label="Chiudi">×</button>
  <h2 id="cName"></h2>
  <p class="cat" id="cCat"></p>
  <div class="info" id="cInfo"></div>
  <div class="btns">
    <button class="btn primary" id="cIso">Isola con le ossa</button>
    <button class="btn" id="cHide">Nascondi</button>
  </div>
</div>

<section id="sheet" class="collapsed" aria-label="Strutture anatomiche">
  <button class="sheet-tab" id="bSheet" aria-expanded="false" aria-controls="sheetBody">
    <span class="grip" aria-hidden="true"></span>
    <span>Strutture <span class="car" aria-hidden="true">▴</span></span>
  </button>
  <div class="sheet-body" id="sheetBody">
  <div class="regs" id="regs" role="group" aria-label="Regioni anatomiche"><span class="rl">Regioni</span></div>
  <div id="regNote" hidden></div>
  <div id="clipBar" hidden><label for="clipR">Taglio</label><input type="range" id="clipR" step="0.05"><span id="clipV"></span></div>
  <div class="chips" id="chips"></div>
  <div class="row">
    <div class="left">
      <button class="btn" id="bAll">Ripristina</button>
      <button class="btn" id="bBones">Solo ossa</button>
      <button class="btn" id="bTransp" aria-pressed="false">Muscoli trasparenti</button>
    </div>
    <button class="toggle-list" id="bList" aria-expanded="false">Elenco</button>
  </div>
  <div id="list"></div>
  <p class="credit"><b>Materiale didattico.</b> Non destinato a uso clinico o diagnostico.</p>

  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(hasCol)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  const nr=g.attributes.normal;
  rings.forEach(r=>{const a=r.ring[0],b=r.ring[M];const x=nr.getX(a)+nr.getX(b),y=nr.getY(a)+nr.getY(b),z=nr.getZ(a)+nr.getZ(b);const l=Math.hypot(x,y,z)||1;nr.setXYZ(a,x/l,y/l,z/l);nr.setXYZ(b,x/l,y/l,z/l);});
  return g;
}
function ellGeo(c,r){return new THREE.SphereGeometry(1,40,24).scale(r[0],r[1],r[2]).translate(c[0],c[1],c[2]);}

/* muscolo: ventre con lievi irregolarità, tendine argenteo, sezione di taglio scura */
const TENDON=lin('#e3ddcd'),CUTM=lin('#5e1914'),CUTT=lin('#d9ceb6');
function muscle(pts,wp,o={}){
  const belly=lin(o.col||'#a33f37').multiplyScalar(0.62).lerp(lin('#6b2a22'),0.18);const ranges=o.tendon||[];
  const seed=Math.abs(pts[0][0]*13.1+pts[0][1]*7.7+pts[0][2]*3.3)%50;
  const tw=t=>{let m=0;for(const [a,b] of ranges){m=Math.max(m,sstep(a-0.035,a+0.01,t)*(1-sstep(b-0.01,b+0.035,t)));}return m;};
  const base=P(wp),rat=o.ratio??0.75;
  const w=t=>base(t)*(1+0.16*(vnoise(t*6+seed,seed,1.3)-0.5)*(1-tw(t)));
  const r=t=>rat*(1+0.22*(vnoise(t*4+seed,2.1,seed)-0.5)*(1-tw(t)));
  return sweep(pts,{w,ratio:r,wdir:o.wdir,urep:1.5,
    colorFn:t=>{const c=belly.clone().lerp(TENDON,tw(t));return c.multiplyScalar(0.88+0.22*vnoise(t*9+seed,seed*.5,4.2));},
    capColorFn:(p,t)=>Math.abs(p.y)>19.7?(tw(t)>0.5?CUTT:CUTM):null});
}
const tube=(pts,r,o={})=>sweep(pts,Object.assign({w:r,urep:2},o));
const band=(pts,w,ratio,wdir,o={})=>sweep(pts,Object.assign({w,ratio,wdir,urep:2},o));
function arc(c,rx,rz,a0,a1,n=26){const out=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;out.push([c[0]+rx*Math.cos(a),c[1],c[2]+rz*Math.sin(a)]);}return out;}
function meniscus(c,rx,rz,a0,a1,wp,hp){
  return sweep(arc(c,rx,rz,a0,a1),{shape:MENSHAPE,w:P(wp),h:P(hp),urep:3,wdir:p=>V(p.x-c[0],0,p.z-c[2]).normalize(),seg:90});
}

const MUSC=new Set(["cuf","cin","tor","brac"]);

const CATS=[{"id":"ossa","name":"Ossa","color":"#e8dcc0"},{"id":"cart","name":"Cartilagine","color":"#c3dae6"},{"id":"leg","name":"Legamenti","color":"#e6e1d3"},{"id":"caps","name":"Capsula","color":"#b9cfe0"},{"id":"bor","name":"Borse","color":"#9fb8ec"},{"id":"cuf","name":"Cuffia dei rotatori","color":"#8e2f28"},{"id":"cin","name":"Muscoli della spalla","color":"#8e2f28"},{"id":"tor","name":"Muscoli del torace e del dorso","color":"#8e2f28"},{"id":"brac","name":"Muscoli del braccio","color":"#8e2f28"},{"id":"art","name":"Arterie","color":"#b0221d"},{"id":"ven","name":"Vene","color":"#3a4a86"},{"id":"ner","name":"Nervi","color":"#ecc85a"}];
const S=[
{id:"scapola",cat:"ossa",name:"Scapola",info:"Osso piatto triangolare con spina, acromion e processo coracoideo. La cavità glenoidea, piccola e poco profonda, accoglie la testa omerale; il tubercolo sopraglenoideo e il sottoglenoideo danno origine al capo lungo di bicipite e tricipite. L’incisura soprascapolare, chiusa dal legamento trasverso superiore, lascia passare il nervo soprascapolare. In radiografia la proiezione \"Y\" e la outlet view mostrano la forma dell’acromion (tipi di Bigliani: piatto, curvo, uncinato).",b:()=>[REAL("scapola")]},
{id:"clavicola",cat:"ossa",name:"Clavicola",info:"Osso a S che collega lo scheletro assile alla scapola (articolazioni sternoclavicolare e acromioclavicolare). Il terzo medio è la sede più frequente di frattura; il tubercolo conoide e la linea trapezoide, sul terzo laterale, danno inserzione ai legamenti coracoclavicolari.",b:()=>[REAL("clavicola")]},
{id:"omero",cat:"ossa",name:"Omero (estremità prossimale)",info:"Testa emisferica rivolta in alto, medialmente e indietro (retroversione di circa 30°), separata dai tubercoli dal collo anatomico. Tubercolo maggiore (inserzioni di sovraspinato, sottospinato e piccolo rotondo) e minore (sottoscapolare) delimitano il solco intertubercolare del capo lungo del bicipite. Il collo chirurgico, sotto i tubercoli, è la sede tipica delle fratture; il nervo ascellare vi passa a contatto.",b:()=>[REAL("omero")]},
{id:"coste",cat:"ossa",name:"Coste I–V",info:"Parte alta della gabbia toracica, sulla quale scorre la scapola. La prima costa, corta e piatta, è attraversata dai solchi dell’arteria e della vena succlavie; tra i due solchi si inserisce lo scaleno anteriore, e il plesso brachiale passa dietro l’arteria. I muscoli dentato anteriore e piccolo pettorale si inseriscono sulle coste.",b:()=>[REAL("costa1"),REAL("costa2"),REAL("costa3"),REAL("costa4"),REAL("costa5")]},
{id:"sterno",cat:"ossa",name:"Sterno (manubrio e corpo)",info:"Il manubrio, con l’incisura giugulare e le incisure claveari, articola con le clavicole (articolazione sternoclavicolare) e con la prima cartilagine costale; l’angolo sternale lo separa dal corpo, a livello della seconda cartilagine costale.",b:()=>[REAL("manubrio"),REAL("corpo_sterno")]},
{id:"cart_cost",cat:"cart",name:"Cartilagini costali I–V",info:"Prolungano le coste verso lo sterno. La prima si unisce direttamente al manubrio (sincondrosi); le altre formano articolazioni sternocostali sinoviali (dalla seconda alla settima).",b:()=>[REAL("cc1"),REAL("cc2"),REAL("cc3"),REAL("cc4"),REAL("cc5")]},
{id:"cart_omero",cat:"cart",name:"Cartilagine della testa omerale",info:"Riveste la testa, più spessa al centro che ai margini, e termina al collo anatomico. In artro-RM si valutano spessore e continuità. Dopo una lussazione anteriore può associarsi la lesione di Hill-Sachs, impronta ossea (con cartilagine) della parte posterosuperiore della testa contro il margine anteriore della glenoide.",b:()=>[REAL("cart_omero")]},
{id:"cart_glen",cat:"cart",name:"Cartilagine glenoidea",info:"Riveste la cavità glenoidea; al contrario della testa è più sottile al centro e più spessa in periferia. Il labbro la circonda. Nell’instabilità anteriore ripetuta la glenoide può perdere osso (Bankart osseo) e assumere la forma di una pera rovesciata.",b:()=>[REAL("cart_glen")]},
{id:"labbro",cat:"cart",name:"Labbro glenoideo",info:"Anello di fibrocartilagine a sezione triangolare che circonda il margine della glenoide e ne aumenta profondità e superficie. In alto si continua con il tendine del capo lungo del bicipite, in basso e in avanti con il legamento gleno-omerale inferiore. In artro-RM si cercano lesioni di Bankart (antero-inferiore, dopo lussazione anteriore), SLAP (superiore) e lesioni ossee associate.",o:"Margine della cavità glenoidea (si fonde con la cartilagine e con il periostio del collo della scapola).",ins:"Anello chiuso sul margine glenoideo; in alto accoglie il tendine del capo lungo del bicipite, in basso il legamento gleno-omerale inferiore.",fn:"Approfondisce la cavità glenoidea (stabilità concavità-compressione) e fa da ancoraggio ai legamenti gleno-omerali.",b:()=>[REAL("labbro")]},
{id:"caps",cat:"caps",name:"Capsula articolare",info:"Manicotto sottile e lasso che dalla glenoide e dal labbro raggiunge il collo anatomico dell’omero; inferiormente forma il recesso ascellare, che si distende in abduzione. È rinforzata dai legamenti gleno-omerali e dal tendine della cuffia, che vi aderisce. In artro-RM la distensione con mezzo di contrasto o le pieghe del recesso ascellare ispessite sono segno di capsulite adesiva.",o:"Margine della glenoide e labbro glenoideo (e base del processo coracoideo per il capo lungo del bicipite).",ins:"Collo anatomico dell’omero; inferiormente scende fino al collo chirurgico (recesso ascellare).",fn:"Contiene la sinovia e il liquido articolare, limita le escursioni estreme (in rotazione esterna si tende anteriormente) e collabora alla stabilità statica.",b:()=>[REAL("caps")]},
{id:"borsa_sad",cat:"bor",name:"Borsa subacromion-deltoidea",info:"Borsa sinoviale tra la cuffia dei rotatori (sovraspinato e infraspinato) sotto e acromion, legamento coracoacromiale e deltoide sopra; normalmente virtuale, con pareti sottili (meno di 2 mm). Permette lo scorrimento della cuffia sotto l’arco coracoacromiale. In ecografia e RM la distensione liquida (borsite) accompagna l’impingement subacromiale; liquido nella borsa con lesione a tutto spessore del sovraspinato indica la comunicazione con l’articolazione.",b:()=>[REAL("borsa_sad")]},
{id:"cc_conoide",cat:"leg",name:"Legamento conoide",info:"Componente mediale e posteriore del legamento coracoclavicolare, a forma di cono con apice sul coracoide. Si rompe nelle lussazioni acromioclavicolari di grado III–V (classificazione di Rockwood): l’aumento della distanza coracoclavicolare in radiografia da carico indica la lesione.",o:"Ginocchio (parte posteromediale) della base del processo coracoideo.",ins:"Tubercolo conoide della clavicola, sulla faccia inferiore del terzo laterale.",fn:"Sospende la scapola alla clavicola; limita la traslazione anteriore e superiore della clavicola (stabilizzatore verticale).",b:()=>[REAL("cc_conoide")]},
{id:"cc_trapezoide",cat:"leg",name:"Legamento trapezoide",info:"Componente laterale e anteriore del legamento coracoclavicolare, lamina quadrangolare quasi orizzontale. Lavora con il conoide: insieme sono gli stabilizzatori verticali dell’articolazione acromioclavicolare.",o:"Faccia superiore del processo coracoideo.",ins:"Linea trapezoide, sulla faccia inferiore del terzo laterale della clavicola.",fn:"Limita la compressione dell’articolazione acromioclavicolare e la traslazione verticale della clavicola.",b:()=>[REAL("cc_trapezoide")]},
{id:"cal",cat:"leg",name:"Legamento coracoacromiale",info:"Banda triangolare che chiude l’arco coracoacromiale, il “tetto” dello spazio sottoacromiale sopra la cuffia dei rotatori. Nel conflitto subacromiale si ispessisce e può essere sezionato nella decompressione.",o:"Margine laterale del processo coracoideo.",ins:"Apice e margine anteriore dell’acromion.",fn:"Protegge la testa omerale dall’alto e limita la sua migrazione superiore.",b:()=>[REAL("cal")]},
{id:"ac_leg",cat:"leg",name:"Legamento acromioclavicolare",info:"Ispessimento della capsula dell’articolazione acromioclavicolare, più robusto in alto, dove si fonde con le fibre di trapezio e deltoide. Stabilizza il piano orizzontale della clavicola; in caso di lesione di grado I–II i coracoclavicolari restano integri.",o:"Estremo laterale della clavicola.",ins:"Margine mediale dell’acromion.",fn:"Stabilizzatore orizzontale (antero-posteriore) dell’articolazione acromioclavicolare.",b:()=>[REAL("ac_leg")]},
{id:"sc_leg",cat:"leg",name:"Legamento sternoclavicolare anteriore",info:"Rinforza la capsula dell’articolazione sternoclavicolare, unico vero punto di appoggio del cingolo scapolare sullo scheletro assile. La lussazione posteriore, più rara, può comprimere trachea e vasi del mediastino.",o:"Estremo mediale della clavicola (faccia anteriore).",ins:"Faccia anteriore del manubrio dello sterno.",fn:"Impedisce la traslazione anteriore dell’estremo mediale della clavicola e ne limita l’elevazione.",b:()=>[REAL("sc_leg")]},
{id:"coraco_om",cat:"leg",name:"Legamento coraco-omerale",info:"Banda fibrosa sopra la testa omerale, tra tubercolo minore e maggiore, che copre l’intervallo dei rotatori con il gleno-omerale superiore. Il suo ispessimento è tipico della capsulite adesiva (segno in artro-RM nell’intervallo dei rotatori).",o:"Base laterale del processo coracoideo.",ins:"Tubercoli minore e maggiore dell’omero, sopra il solco intertubercolare.",fn:"Sostiene la testa omerale contro la gravità e limita la rotazione esterna con il braccio addotto.",b:()=>[REAL("coraco_om")]},
{id:"sghl",cat:"leg",name:"Legamento gleno-omerale superiore",info:"Sottile, nell’intervallo dei rotatori, davanti al tendine del capo lungo del bicipite. Insieme al coraco-omerale limita la traslazione inferiore con il braccio addotto.",o:"Labbro glenoideo antero-superiore (tubercolo sopraglenoideo, ore 1).",ins:"Poco sopra il tubercolo minore dell’omero.",fn:"Stabilizzatore del braccio addotto: limita traslazione inferiore e rotazione esterna.",b:()=>[REAL("sghl")]},
{id:"mghl",cat:"leg",name:"Legamento gleno-omerale medio",info:"Di spessore molto variabile (può mancare); sotto il tendine del sottoscapolare. Forma con il superiore e il coraco-omerale il “complesso capsulare anteriore”; il foro di Weitbrecht è l’apertura tra il medio e il superiore.",o:"Labbro glenoideo anteriore (ore 3).",ins:"Collo anatomico, medialmente al tubercolo minore.",fn:"Limita la rotazione esterna a 45° di abduzione e la traslazione anteriore.",b:()=>[REAL("mghl")]},
{id:"ighl_a",cat:"leg",name:"Legamento gleno-omerale inferiore – banda anteriore",info:"Banda più importante del complesso gleno-omerale inferiore, a forma di amaca con la banda posteriore e il recesso ascellare. È la struttura lesionata nell’instabilità anteriore: distacco dal labbro (lesione di Bankart) o lesione dell’inserzione omerale (HAGL, lesione di Bankart omerale).",o:"Labbro glenoideo antero-inferiore (ore 4–5).",ins:"Collo anatomico dell’omero, antero-inferiormente.",fn:"Stabilizzatore principale contro la lussazione anteriore in abduzione e rotazione esterna (posizione di apprensione).",b:()=>[REAL("ighl_a")]},
{id:"ighl_p",cat:"leg",name:"Legamento gleno-omerale inferiore – banda posteriore",info:"Banda posteriore dell’amaca inferiore; più sottile dell’anteriore. Nella contrattura in rotazione interna si ispessisce e limita la rotazione interna e la flessione-adduzione.",o:"Labbro glenoideo postero-inferiore (ore 7–8).",ins:"Collo anatomico dell’omero, postero-inferiormente.",fn:"Limita la traslazione posteriore e la rotazione interna con il braccio in flessione e abduzione.",b:()=>[REAL("ighl_p")]},
{id:"trasv_om",cat:"leg",name:"Legamento trasverso dell’omero",info:"Lamina sottile che chiude in alto il solco intertubercolare e tiene il tendine del capo lungo del bicipite nel solco. Gli studi anatomici recenti la descrivono come fibre superficiali del sottoscapolare, con contributi del sovraspinato e del coraco-omerale, più che come legamento autonomo (Gleason 2006; MacDonald 2007). La lesione di questo tetto, spesso con lesione del sottoscapolare, permette la sublussazione mediale del tendine, visibile in ecografia dinamica e RM.",o:"Tubercolo minore dell’omero (labbro mediale del solco), in continuità con le fibre del sottoscapolare.",ins:"Tubercolo maggiore dell’omero (labbro laterale del solco).",fn:"Mantiene il tendine del capo lungo del bicipite nel solco intertubercolare e ne impedisce la sublussazione mediale.",b:()=>[REAL("trasv_om")]},
{id:"supra",cat:"cuf",name:"Sovraspinato",info:"Passa sotto l’arco coracoacromiale e l’articolazione acromioclavicolare, nello spazio sottoacromiale: è la sede più frequente di tendinopatia, conflitto e rottura della cuffia, soprattutto nella zona critica a circa 1 cm dall’inserzione. Nervo soprascapolare (C5–C6).",o:"Fossa sopraspinata della scapola (due terzi mediali) e fascia sopraspinata.",ins:"Faccetta superiore del tubercolo maggiore dell’omero, con fibre che si fondono con la capsula.",fn:"Abduzione del braccio (primi 15°); centra e stabilizza la testa omerale nella glenoide.",b:()=>[REAL("supra")]},
{id:"infra",cat:"cuf",name:"Sottospinato",info:"Copre in parte la capsula posteriore. Nervo soprascapolare (C5–C6), che passa nell’incisura spinoglenoidea: una cisti paralabrale può comprimerlo e causare atrofia isolata del sottospinato.",o:"Fossa sottospinata (due terzi mediali) e fascia sottospinata.",ins:"Faccetta media del tubercolo maggiore dell’omero.",fn:"Rotazione esterna del braccio; stabilizzatore posteriore dell’articolazione.",b:()=>[REAL("infra")]},
{id:"tmin",cat:"cuf",name:"Piccolo rotondo",info:"Delimita in alto lo spazio quadrangolare. Nervo ascellare (C5–C6), che emerge dallo spazio quadrangolare e gira attorno al collo chirurgico dell’omero con l’arteria circonflessa posteriore. L’atrofia isolata si osserva nella sindrome dello spazio quadrangolare.",o:"Due terzi superiori del margine laterale della scapola (faccia dorsale).",ins:"Faccetta inferiore del tubercolo maggiore dell’omero e capsula articolare.",fn:"Rotazione esterna; debole adduzione.",b:()=>[REAL("tmin")]},
{id:"subs",cat:"cuf",name:"Sottoscapolare",info:"Il più voluminoso della cuffia. Il tendine passa sotto il processo coracoideo e davanti alla capsula; la borsa sottoscapolare comunica con l’articolazione. La lesione è tipica della lussazione anteriore e si associa all’instabilità del capo lungo del bicipite. Nervi sottoscapolari superiore e inferiore (C5–C7).",o:"Fossa sottoscapolare (faccia costale della scapola).",ins:"Tubercolo minore dell’omero e capsula anteriore.",fn:"Rotazione interna; stabilizzatore anteriore dell’articolazione.",b:()=>[REAL("subs")]},
{id:"delt_cl",cat:"cin",name:"Deltoide, parte clavicolare",info:"Fascio anteriore del deltoide. Nervo ascellare (C5–C6), che emerge dallo spazio quadrangolare e gira attorno al collo chirurgico dell’omero con l’arteria circonflessa posteriore. Il solco deltoideo-pettorale, con la vena cefalica, lo separa dal grande pettorale.",o:"Terzo laterale del margine anteriore e della faccia superiore della clavicola.",ins:"Tuberosità deltoidea dell’omero (tendine comune alle tre parti).",fn:"Flessione, abduzione e rotazione interna del braccio.",b:()=>[REAL("delt_cl")]},
{id:"delt_ac",cat:"cin",name:"Deltoide, parte acromiale",info:"Fascio medio, multipennato. Sotto di esso la borsa subacromiale-subdeltoidea e la cuffia dei rotatori. Nervo ascellare (C5–C6), che emerge dallo spazio quadrangolare e gira attorno al collo chirurgico dell’omero con l’arteria circonflessa posteriore.",o:"Margine laterale e faccia superiore dell’acromion.",ins:"Tuberosità deltoidea dell’omero.",fn:"Abduzione del braccio, soprattutto oltre i primi 15°.",b:()=>[REAL("delt_ac")]},
{id:"delt_sp",cat:"cin",name:"Deltoide, parte spinale",info:"Fascio posteriore, adiacente al piccolo rotondo. Nervo ascellare (C5–C6), che emerge dallo spazio quadrangolare e gira attorno al collo chirurgico dell’omero con l’arteria circonflessa posteriore.",o:"Margine inferiore della spina della scapola.",ins:"Tuberosità deltoidea dell’omero.",fn:"Estensione, abduzione e rotazione esterna del braccio.",b:()=>[REAL("delt_sp")]},
{id:"tmaj",cat:"cin",name:"Grande rotondo",info:"Delimita lo spazio quadrangolare (in alto il piccolo rotondo, lateralmente il collo chirurgico, medialmente il capo lungo del tricipite) e lo spazio triangolare. Nervo sottoscapolare inferiore (C5–C6).",o:"Angolo inferiore e terzo inferiore del margine laterale della scapola (faccia dorsale).",ins:"Labbro mediale del solco intertubercolare dell’omero.",fn:"Adduzione, estensione e rotazione interna del braccio.",b:()=>[REAL("tmaj")]},
{id:"pec_cl",cat:"tor",name:"Grande pettorale, parte clavicolare",info:"Le tre parti convergono in un tendine a U che si inserisce con torsione: le fibre inferiori si portano più in alto. Nervi pettorali laterale e mediale (C5–T1).",o:"Metà mediale della clavicola.",ins:"Labbro laterale del solco intertubercolare dell’omero.",fn:"Flessione, adduzione e rotazione interna del braccio.",b:()=>[REAL("pec_cl")]},
{id:"pec_st",cat:"tor",name:"Grande pettorale, parte sternocostale",info:"La rottura, tipica nel sollevamento pesi, interessa il tendine all’inserzione omerale; l’assenza congenita fa parte della sindrome di Poland. Nervi pettorali laterale e mediale (C5–T1).",o:"Faccia anteriore dello sterno e prime sei cartilagini costali.",ins:"Labbro laterale del solco intertubercolare dell’omero.",fn:"Adduzione e rotazione interna del braccio; abbassa il braccio sollevato.",b:()=>[REAL("pec_st")]},
{id:"pec_ab",cat:"tor",name:"Grande pettorale, parte addominale",info:"Parte inferiore del grande pettorale; forma il pilastro anteriore dell’ascella. Nervi pettorali laterale e mediale (C5–T1).",o:"Guaina del muscolo retto dell’addome.",ins:"Labbro laterale del solco intertubercolare dell’omero.",fn:"Adduzione e rotazione interna; abbassa il braccio sollevato.",b:()=>[REAL("pec_ab")]},
{id:"pmin",cat:"tor",name:"Piccolo pettorale",info:"Il fascio vascolonervoso ascellare gli passa sotto: la compressione sotto il suo tendine è una causa di sindrome dello stretto toracico. Nervo pettorale mediale (C8–T1).",o:"Facce esterne delle coste III–V, vicino alle cartilagini.",ins:"Processo coracoideo (margine mediale e faccia superiore).",fn:"Abbassa e protrae la scapola, inclinandola in avanti.",b:()=>[REAL("pmin")]},
{id:"succl",cat:"tor",name:"Succlavio",info:"Piccolo muscolo tra clavicola e prima costa, davanti al fascio neurovascolare. Nervo del succlavio (C5–C6).",o:"Faccia superiore della prima costa, alla giunzione con la cartilagine.",ins:"Solco del succlavio, sulla faccia inferiore del terzo medio della clavicola.",fn:"Abbassa e stabilizza la clavicola nell’articolazione sternoclavicolare.",b:()=>[REAL("succl")]},

/* ============ Texture fibrose (colore + normal map) ============ */
function fiberTextures(){
  const W=512,H=256,prof=new Float32Array(W);
  let x=0;while(x<W){const bw=9+Math.floor(Math.random()*16),base=0.72+Math.random()*0.28;
    for(let i=0;i<bw&&x<W;i++,x++){const e=Math.min(i,bw-1-i),edge=Math.min(1,e/2.2);prof[x]=base*(0.5+0.5*edge)+(Math.random()-0.5)*0.1;}}
  const hgt=new Float32Array(W*H);
  const at=xx=>{xx=((xx%W)+W)%W;const i=Math.floor(xx),f=xx-i;return prof[i]*(1-f)+prof[(i+1)%W]*f;};
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const wv=3*Math.sin(y/H*Math.PI*4+xx*0.025)+1.5*Math.sin(y/H*Math.PI*10+xx*0.07);
    hgt[y*W+xx]=at(xx+wv)+0.035*Math.sin(y*0.9+xx*0.3);}
  const c1=document.createElement('canvas'),c2=document.createElement('canvas');c1.width=c2.width=W;c1.height=c2.height=H;
  const g1=c1.getContext('2d'),g2=c2.getContext('2d'),d1=g1.createImageData(W,H),d2=g2.createImageData(W,H);
  const hv=(xx,y)=>hgt[((y+H)%H)*W+((xx+W)%W)];
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4,h=hv(xx,y);
    const k=Math.round(clamp(0.87+0.13*h,0,1)*255);d1.data[i]=k;d1.data[i+1]=k;d1.data[i+2]=k;d1.data[i+3]=255;
    let nx=(hv(xx-1,y)-hv(xx+1,y))*2.2,ny=(hv(xx,y-1)-hv(xx,y+1))*2.2,nz=1;const l=Math.hypot(nx,ny,nz);
    d2.data[i]=Math.round((nx/l*0.5+0.5)*255);d2.data[i+1]=Math.round((ny/l*0.5+0.5)*255);d2.data[i+2]=Math.round((nz/l*0.5+0.5)*255);d2.data[i+3]=255;}
  g1.putImageData(d1,0,0);g2.putImageData(d2,0,0);
  const t1=new THREE.CanvasTexture(c1),t2=new THREE.CanvasTexture(c2);
  [t1,t2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;});t1.encoding=THREE.sRGBEncoding;
  return {map:t1,normal:t2};
}

let BP=null;
async function loadBP(){const man=JSON.parse(document.getElementById('bpman').textContent);
  const ab=await datiBP('bpdat');
  const by={};man.meshes.forEach(m=>by[m.n]=m);return {man,u8:new Uint8Array(ab),by};}
function REAL(name){
  const m=BP.by[name],mn=BP.man.min,mx=BP.man.max,buf=BP.u8.buffer;
  const q=new Uint16Array(buf,m.p,m.nv*3),pos=new Float32Array(m.nv*3);
  for(let i=0;i<m.nv*3;i++){const k=i%3;pos[i]=mn[k]+q[i]/65535*(mx[k]-mn[k]);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  if(m.t!==undefined)g.userData.tag=new Uint8Array(buf,m.t,m.nv).slice();
  if(m.d!==undefined){const d=new Int8Array(buf,m.d,m.nv*3),f=new Float32Array(m.nv*3);for(let i=0;i<f.length;i++)f[i]=d[i]/127;g.setAttribute('fdir',new THREE.BufferAttribute(f,3));}
  const idx=m.i16?new Uint16Array(buf,m.i,m.ni).slice():new Uint32Array(buf,m.i,m.ni).slice();
  g.setIndex(new THREE.BufferAttribute(idx,1));
  /* normali scritte nel file (int8): capi dello stesso muscolo tagliati da uno strumento conservano le normali di partenza, senza linee dove si fondono */
  if(m.nm!==undefined){const d=new Int8Array(buf,m.nm,m.nv*3),f=new Float32Array(m.nv*3);for(let i=0;i<f.length;i++)f[i]=d[i]/127;g.setAttribute('normal',new THREE.BufferAttribute(f,3));}else g.computeVertexNormals();
  g.userData.real=true;if(m.po)g.userData.po=true;return g;
}

/* shader: fibre muscolari in rilievo lungo la direzione del muscolo + bordi Fresnel */
const NOISE_GLSL=`
float fbH(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float fbN(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(fbH(i),fbH(i+vec3(1,0,0)),f.x),mix(fbH(i+vec3(0,1,0)),fbH(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(fbH(i+vec3(0,0,1)),fbH(i+vec3(1,0,1)),f.x),mix(fbH(i+vec3(0,1,1)),fbH(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbF(vec2 q,float a){return 0.55*fbN(vec3(q*5.5,a*0.22))+0.3*fbN(vec3(q*14.0,a*0.5+7.0))+0.15*fbN(vec3(q*32.0,a*1.1+3.0));}
`;
function shaderize(m,o){
  m.onBeforeCompile=sh=>{
    if(o.fiber){
      sh.uniforms.fO={value:m.userData.fO||new THREE.Vector3()};
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 fdir;\nattribute float tw;\nuniform vec3 fO;\nvarying vec3 vFd;\nvarying vec3 vOP;\nvarying float vTw;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\nvFd=fdir;vOP=position-fO;vTw=tw;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vFd;\nvarying vec3 vOP;\nvarying float vTw;\n'+NOISE_GLSL)
        .replace('#include <color_fragment>',`#include <color_fragment>
  vec3 fF=normalize(vFd+vec3(1e-4,2e-4,-1e-4));vec3 fU=abs(fF.y)<0.9?vec3(0.,1.,0.):vec3(1.,0.,0.);
  vec3 fB1=normalize(cross(fF,fU));vec3 fB2=cross(fF,fB1);float fA=dot(vOP,fF);vec2 fP=vec2(dot(vOP,fB1),dot(vOP,fB2));
  float fH=fbF(fP,fA);diffuseColor.rgb*=mix(0.84+0.3*fH,0.97+0.06*fH,vTw);`)
        .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  {float fe=0.025;float fhx=fbF(fP+vec2(fe,0.),fA),fhy=fbF(fP+vec2(0.,fe),fA);
   vec3 fg=((fhx-fH)*fB1+(fhy-fH)*fB2)/fe;vec3 fgv=(viewMatrix*vec4(fg,0.)).xyz;
   normal=normalize(normal-${o.fiber.toFixed(3)}*(1.0-0.65*vTw)*(fgv-dot(fgv,normal)*normal));}`)
        .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n  roughnessFactor*=mix(1.0,0.55,vTw);');
    }
    if(o.fresnel)sh.fragmentShader=sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
      'float frE=pow(1.0-abs(dot(normalize(normal),normalize(vViewPosition))),2.0);\n\tgl_FragColor = vec4( outgoingLight, clamp(diffuseColor.a+'+o.fresnel.toFixed(2)+'*frE*(1.0-diffuseColor.a)*1.6,0.0,1.0) );');
  };
  m.customProgramCacheKey=()=>'sh'+JSON.stringify(o);return m;
}

/* ============ Finitura superfici: rilievo, colore, sezioni di taglio ============ */
const BONE_A=lin('#dfd0ab'),BONE_B=lin('#bf9f6a'),CORTEX=lin('#f2ead8'),MARROW=lin('#c38f4e'),SPONGY=lin('#dcc08e');
const SECTION={femore:{c:[0,-0.3],sx:1.1,sz:0.9,r:1.3,m:0.6},tibia:{c:[0,-0.3],sx:1.1,sz:0.85,r:1.3,m:0.58},perone:{c:[-2.9,-1.0],sx:1,sz:1,r:0.5,m:0.42}};
function finishGeo(s,g){
  const pos=g.attributes.position,nor=g.attributes.normal,n=pos.count;
  let col=g.attributes.color;
  if(!col){col=new THREE.BufferAttribute(new Float32Array(n*3).fill(1),3);g.setAttribute('color',col);}
  const tag=g.userData.tag;
  if(s.id==='lacerto'&&tag){ /* dissolvenza verso la fascia antibrachiale: il tag (0-255) abbassa l'opacità dei vertici */
    const c4=new Float32Array(n*4);for(let i=0;i<n;i++){c4[4*i]=c4[4*i+1]=c4[4*i+2]=LACERTO_LUCE;c4[4*i+3]=1-LACERTO_FADE*sstep(0,1,tag[i]/255);}
    col=new THREE.BufferAttribute(c4,4);g.setAttribute('color',col);
  }
  if(s.cat==='ossa'&&tag){
    const TH=THMAP[s.id]||0.2;
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let c;
      if(tag[i]>=10){const d=(tag[i]-10)/100;
        if(d<TH-0.05)c=CORTEX.clone().multiplyScalar(0.96+0.06*fbm(x*9,z*9,4));
        else if(d<TH+0.08)c=CORTEX.clone().lerp(SPONGY,sstep(TH-0.05,TH+0.08,d));
        else c=MARROW.clone().lerp(SPONGY,0.35*fbm(x*5,z*5,2)).multiplyScalar(0.8+0.3*fbm(x*10,z*10,1));
      }else{
        const ny=nor.getY(i);const dd=(fbm(x*1.3,y*1.3,z*1.3)-0.5)*0.025+(fbm(x*6,y*6,z*6)-0.5)*0.006;
        pos.setXYZ(i,x+nor.getX(i)*dd,y+ny*dd,z+nor.getZ(i)*dd);
        c=BONE_A.clone().lerp(BONE_B,sstep(0.45,0.8,fbm(x*.6+3,y*.6,z*.6))*0.55).multiplyScalar(0.93+0.08*fbm(x*4,y*4,z*4));
      }
      col.setXYZ(i,c.r,c.g,c.b);}
    g.computeVertexNormals();
  }else if(MUSC.has(s.cat)&&tag){
    const TW=new Float32Array(n);g.setAttribute('tw',new THREE.BufferAttribute(TW,1));
    const belly=lin(MCOL[s.id]||'#9e3e37').multiplyScalar(0.62).lerp(lin('#6b2a22'),0.18);const seed=s.id.length*7.3;
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let c;
      if(tag[i]===250)c=CUTM.clone().multiplyScalar(0.85+0.3*fbm(x*6,z*6,seed));
      else if(tag[i]===251)c=CUTT.clone();
      else{const tw=sstep(0.02,0.98,tag[i]/200);c=belly.clone().lerp(TENDON,tw).multiplyScalar(0.86+0.22*fbm(x*1.7+seed,y*0.6,z*1.7)*(1-0.7*tw));TW[i]=tw;}
      col.setXYZ(i,c.r,c.g,c.b);}
  }else if(s.cat==='ossa'){
    const sec=SECTION[s.id];
    for(let i=0;i<n;i++){
      const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),ny=nor.getY(i);let c;
      if(sec&&Math.abs(y)>20.15&&Math.abs(ny)>0.6){
        const q=Math.hypot((x-sec.c[0])/sec.sx,(z-sec.c[1])/sec.sz)/sec.r;
        if(q<sec.m)c=MARROW.clone().multiplyScalar(0.8+0.35*fbm(x*8,z*8,1));
        else if(q<sec.m+0.1)c=SPONGY.clone().lerp(MARROW,0.5*fbm(x*12,z*12,2));
        else c=CORTEX.clone();
      }else{
        const d=(fbm(x*1.3,y*1.3,z*1.3)-0.5)*0.035+(fbm(x*6,y*6,z*6)-0.5)*0.006+(s.id==='rotula'&&z>3.8?Math.sin(x*11+fbm(x,y*3,z)*3)*0.005:0);
        pos.setXYZ(i,x+nor.getX(i)*d,y+ny*d,z+nor.getZ(i)*d);
        c=BONE_A.clone().lerp(BONE_B,sstep(0.45,0.8,fbm(x*.6+3,y*.6,z*.6))*0.55).multiplyScalar(0.93+0.08*fbm(x*4,y*4,z*4));
      }

    }
    g.computeVertexNormals();
  }else if(s.cat==='adi'){
    for(let i=0;i<n;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);const d=(fbm(x*2.8,y*2.8,z*2.8)-0.5)*0.1;
      pos.setXYZ(i,x+nor.getX(i)*d,y+nor.getY(i)*d,z+nor.getZ(i)*d);const k=0.82+0.3*fbm(x*4,y*4,z*4);col.setXYZ(i,k,k,k);}
    g.computeVertexNormals();
  }else if(g.userData.nets||s.cat==='bor'){
    for(let i=0;i<n;i++){const k=0.95+0.07*fbm(pos.getX(i)*3,pos.getY(i)*3,pos.getZ(i)*3);col.setXYZ(i,k,k,k);}
  }
  return g;
}

/* ============ Occlusione ambientale precalcolata ============ */
function bakeAO(items){
  const VS=0.2,O=BP.man.min.map(v=>v-0.4),NX=Math.ceil((BP.man.max[0]-O[0]+0.4)/VS),NY=Math.ceil((BP.man.max[1]-O[1]+0.4)/VS),NZ=Math.ceil((BP.man.max[2]-O[2]+0.4)/VS),NXY=NX*NY;
  const gD=new Uint8Array(NXY*NZ),gA=new Uint8Array(NXY*NZ);
  const vid=(x,y,z)=>{const i=((x-O[0])/VS)|0,j=((y-O[1])/VS)|0,k=((z-O[2])/VS)|0;return(i<0||j<0||k<0||i>=NX||j>=NY||k>=NZ)?-1:i+NX*j+NXY*k;};
  const SKIP=new Set(['caps','cute','bor','gua','spa']),DEEP=new Set(['ossa','cart','leg','adi']);
  items.forEach(({s,g})=>{if(SKIP.has(s.cat)||s.id==='lacerto')return;const deep=DEEP.has(s.cat);const p=g.attributes.position.array,ix=g.index.array;
    for(let t=0;t<ix.length;t+=3){const a=3*ix[t],b=3*ix[t+1],c=3*ix[t+2];
      const L=Math.max(Math.hypot(p[a]-p[b],p[a+1]-p[b+1],p[a+2]-p[b+2]),Math.hypot(p[a]-p[c],p[a+1]-p[c+1],p[a+2]-p[c+2]),Math.hypot(p[b]-p[c],p[b+1]-p[c+1],p[b+2]-p[c+2]));
      const m=Math.max(1,Math.ceil(L/0.07));
      for(let u=0;u<=m;u++)for(let v=0;v<=m-u;v++){const w=m-u-v;
        const id=vid((p[a]*u+p[b]*v+p[c]*w)/m,(p[a+1]*u+p[b+1]*v+p[c+1]*w)/m,(p[a+2]*u+p[b+2]*v+p[c+2]*w)/m);
        if(id>=0){gA[id]=1;if(deep)gD[id]=1;}}}});
  const dil=G=>{const H=G.slice();for(let id=0;id<G.length;id++)if(G[id]){if(id>0)H[id-1]=1;if(id+1<G.length)H[id+1]=1;if(id>=NX)H[id-NX]=1;if(id+NX<G.length)H[id+NX]=1;if(id>=NXY)H[id-NXY]=1;if(id+NXY<G.length)H[id+NXY]=1;}return H;};
  const GD=dil(gD),GA=dil(gA);
  const DIRS=[];const K=18;for(let i=0;i<K;i++){const y=1-2*(i+0.5)/K,r=Math.sqrt(1-y*y),ph=i*2.39996;DIRS.push([Math.cos(ph)*r,y,Math.sin(ph)*r]);}
  const STEPS=[0.14,0.28,0.45,0.66,0.94,1.3,1.8];
  items.forEach(({s,g})=>{if(SKIP.has(s.cat)||s.id==='lacerto')return;const G=DEEP.has(s.cat)?GD:GA;
    const p=g.attributes.position.array,nm=g.attributes.normal.array,n=p.length/3,ao=new Float32Array(n);
    for(let i=0;i<n;i++){const px=p[3*i],py=p[3*i+1],pz=p[3*i+2],nx=nm[3*i],ny=nm[3*i+1],nz=nm[3*i+2];
      const ox=px+nx*0.18,oy=py+ny*0.18,oz=pz+nz*0.18;let occ=0,tot=0;
      for(const d of DIRS){const c=d[0]*nx+d[1]*ny+d[2]*nz;if(c<0.15)continue;tot+=c;
        for(const st of STEPS){const id=vid(ox+d[0]*st,oy+d[1]*st,oz+d[2]*st);if(id>=0&&G[id]){occ+=c*(1-st/2.3);break;}}}
      ao[i]=tot>0?1-occ/tot:1;}
    const ix=g.index.array;
    for(let pass=0;pass<2;pass++){const sum=new Float32Array(n),cnt=new Float32Array(n);
      for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2];sum[a]+=ao[b]+ao[c];sum[b]+=ao[a]+ao[c];sum[c]+=ao[a]+ao[b];cnt[a]+=2;cnt[b]+=2;cnt[c]+=2;}
      for(let i=0;i<n;i++)ao[i]=(ao[i]*2+sum[i])/(2+cnt[i]);}
    const col=g.attributes.color;
    for(let i=0;i<n;i++){const f=0.28+0.72*Math.pow(clamp(ao[i],0,1),1.25);col.setXYZ(i,col.getX(i)*f,col.getY(i)*f,col.getZ(i)*f);}
    col.needsUpdate=true;});
}

  if(selected.mat)selected.mat.emissive.setHex(0x3b3a14);
  const c=catById[selected.cat];card.style.setProperty('--c',c.color);
  document.getElementById('cName').textContent=selected.name;document.getElementById('cCat').textContent=c.name;fillInfo(selected);card.hidden=false;
}
/* nota didattica + origine, inserzione e funzione (campi o, ins, fn), se presenti */
function fillInfo(s){
  const el=document.getElementById('cInfo');el.textContent='';el.scrollTop=0;
  if(s.info){const p=document.createElement('p');p.textContent=s.info;el.appendChild(p);}
  const R=[['Origine',s.o],['Inserzione',s.ins],['Funzione',s.fn]].filter(r=>r[1]);if(!R.length)return;
  const dl=document.createElement('dl');dl.className='oif';
  R.forEach(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dl.append(dt,dd);});
  el.appendChild(dl);
}
card.querySelector('.x').addEventListener('click',()=>select(null));
document.getElementById('cHide').addEventListener('click',()=>{if(!selected)return;const s=selected;select(null);setVis(s,false);sync();});
/* Isola con le ossa / Ripristina vista: la visibilità di prima è salvata e tornare indietro è un secondo tap sullo stesso pulsante.
   Qualunque altro cambio di visibilità (elenco, categorie, Mostra tutto, Solo ossa, regioni) annulla il ripristino. */
var isoPrev=null,isoBusy=false;const bIso=document.getElementById('cIso');
function isoLbl(){bIso.textContent=isoPrev?'Ripristina vista':'Isola con le ossa';bIso.setAttribute('aria-pressed',!!isoPrev);}
function isola(keep){if(!isoPrev)isoPrev={vis:new Map(S.map(s=>[s,s.visible])),sel:selected&&selected.id};isoBusy=true;S.forEach(s=>setVis(s,keep(s)));isoBusy=false;isoLbl();sync();}
function ripristina(){const p=isoPrev;isoPrev=null;isoBusy=true;p.vis.forEach((v,s)=>setVis(s,v));isoBusy=false;isoLbl();sync();if(!selected&&p.sel&&byId[p.sel]&&byId[p.sel].visible)select(p.sel);}
bIso.addEventListener('click',()=>{if(isoPrev){ripristina();return;}if(!selected)return;const k=selected;isola(s=>s===k||s.cat==='ossa');});

/* ============ Pannello ============ */
function setVis(s,v){if(isoPrev&&!isoBusy){isoPrev=null;isoLbl();}s.visible=v;if(s.group)s.group.visible=v;if(!v&&selected===s)select(null);}
const chipsEl=document.getElementById('chips'),listEl=document.getElementById('list');
/* rotellina del mouse = scorrimento orizzontale delle categorie, se la riga eccede */
chipsEl.addEventListener('wheel',e=>{if(chipsEl.scrollWidth>chipsEl.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){chipsEl.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
CATS.forEach(c=>{
  const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',c.color);b.dataset.cat=c.id;b.innerHTML='<span class="dot"></span>'+c.name;
  b.addEventListener('click',()=>{const it=S.filter(s=>s.cat===c.id);const any=it.some(s=>s.visible);it.forEach(s=>setVis(s,!any));sync();});
  chipsEl.appendChild(b);
  const g=document.createElement('div');g.className='grp';g.style.setProperty('--c',c.color);g.innerHTML='<h3><span class="dot"></span>'+c.name+'</h3>';
  S.filter(s=>s.cat===c.id).forEach(s=>{
    const row=document.createElement('div');row.className='item';const id='chk-'+s.id;
    row.innerHTML='<input type="checkbox" id="'+id+'"><label for="'+id+'">'+s.name+'</label><button class="go">Scheda</button>';
    row.querySelector('.go').setAttribute('aria-label','Scheda: '+s.name);
    row.querySelector('input').addEventListener('change',e=>{setVis(s,e.target.checked);sync();});
    row.querySelector('.go').addEventListener('click',()=>{setVis(s,true);sync();select(s.id);});
    s.chk=row.querySelector('input');g.appendChild(row);
  });
  listEl.appendChild(g);
});
/* smartphone: categorie su 3 righe compatte (senza buchi), scorrevoli in orizzontale: la larghezza minima che le tiene su 3 righe */
(()=>{const mq=matchMedia('(max-width:600px)'),inn=document.createElement('div');inn.className='chips-in';inn.append(...chipsEl.children);chipsEl.appendChild(inn);
const fit=()=>{inn.style.width='';const cw=chipsEl.clientWidth,ch=[...inn.children];if(!mq.matches||!cw||!ch.length)return;
  const g=parseFloat(getComputedStyle(inn).columnGap)||0,max=3*ch[0].offsetHeight+2*g+1;if(inn.offsetHeight<=max)return;
  let w=Math.max(cw,Math.ceil(ch.reduce((a,c)=>a+c.offsetWidth+g,0)/3));
  for(let i=0;i<300;i++){inn.style.width=w+'px';if(inn.offsetHeight<=max)break;w+=6;}};
new ResizeObserver(fit).observe(chipsEl);mq.addEventListener('change',fit);})();
S.forEach(s=>{s.visible=!hiddenDefault(s);});
function sync(){
  CATS.forEach(c=>{const it=S.filter(s=>s.cat===c.id),n=it.filter(s=>s.visible).length;chipsEl.querySelector('[data-cat="'+c.id+'"]').dataset.state=n===0?'off':n===it.length?'on':'part';});
  S.forEach(s=>{s.chk.checked=s.visible;});
}
sync();
document.getElementById('bAll').addEventListener('click',()=>{S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();});
document.getElementById('bBones').addEventListener('click',()=>{S.forEach(s=>setVis(s,s.cat==='ossa'));sync();});
const bT=document.getElementById('bTransp');let transp=false;
bT.addEventListener('click',()=>{transp=!transp;bT.setAttribute('aria-pressed',transp);
  S.forEach(s=>{if((MUSC.has(s.cat)||s.cat==='adi')&&s.mat){const m=s.mat;m.transparent=transp||m.userData.baseTransparent;m.opacity=transp?0.32:m.userData.baseOpacity;m.depthWrite=transp?false:m.userData.baseDepthWrite;m.needsUpdate=true;
    s.group.children.forEach(o=>{o.castShadow=!transp;});}});});

/* ============ Regioni guidate e piano di taglio ============ */
renderer.localClippingEnabled=true;
const clipLocal=new THREE.Plane(new THREE.Vector3(0,1,0),0),clipWorld=new THREE.Plane();let clipOn=false;
function applyClip(){root.updateMatrixWorld();clipWorld.copy(clipLocal).applyMatrix4(root.matrixWorld);}
const capOn={value:0};
const CAPC={ossa:'#c7a066',cart:'#9cc0d0',leg:'#d9d3c3',ret:'#d9d3c3',ten:'#e1dccd',cuf:'#7c2622',cin:'#7c2622',tor:'#7c2622',brac:'#7c2622',adi:'#d8b44a',bor:'#8aa6de',art:'#8a1714',ven:'#2d3b72',ner:'#c9a23a'};
const BELLY={has:()=>true};
function capPatch(s){const m=s.mat;if(!m||m.userData.capP||!CAPC[s.cat])return;m.userData.capP=1;const col=new THREE.Color(MUSC.has(s.cat)&&!BELLY.has(s.id)?'#e3dccb':CAPC[s.cat]);
  const prev=m.onBeforeCompile;m.onBeforeCompile=function(sh,r){if(prev)prev.call(this,sh,r);sh.uniforms.capOn=capOn;sh.uniforms.capCol={value:col};
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform float capOn;uniform vec3 capCol;').replace('#include <dithering_fragment>','#include <dithering_fragment>\nif(!gl_FrontFacing&&capOn>0.5){gl_FragColor=vec4(capCol*0.92,1.0);}');};
  const pk=m.customProgramCacheKey?m.customProgramCacheKey.bind(m):null;m.customProgramCacheKey=()=>(pk?pk():'')+'|cap';m.needsUpdate=true;}
function setClip(on){clipOn=on;applyClip();capOn.value=on?1:0;S.forEach(s=>{if(s.mat){capPatch(s);s.mat.clippingPlanes=on?[clipWorld]:null;s.mat.clipShadows=on;s.mat.needsUpdate=true;}});}
function clipTxt(v){const R=curReg;const d=Math.round(v*10);
  if(R&&R.cn&&R.cn[0]){return d===0?'piano sagittale al centro dell’articolazione':'piano sagittale '+Math.abs(d)+' mm '+(d>0?'mediale':'laterale')+' al centro';}
  return d===0?'livello della rima articolare':Math.abs(d)+' mm '+(d>0?'prossimale':'distale')+' alla rima articolare';}
const BO=['ossa'];
const REG=[];
const regsEl=document.getElementById('regs'),regNote=document.getElementById('regNote'),clipBar=document.getElementById('clipBar'),clipR=document.getElementById('clipR'),clipV=document.getElementById('clipV');
let curReg=null;
function exitReg(){curReg=null;[...regsEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed','false'));regNote.hidden=true;clipBar.hidden=true;setClip(false);setTimeout(measure,50);}
function goReg(R,btn){
  if(curReg===R){exitReg();S.forEach(s=>setVis(s,!hiddenDefault(s)));sync();return;}
  curReg=R;[...regsEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',b===btn));
  const ids=new Set(R.ids);S.forEach(s=>setVis(s,ids.has(s.id)||BO.includes(s.cat)));sync();select(null);
  regNote.textContent=R.note;regNote.hidden=false;
  if(R.clip!=null){const cn=R.cn||[0,1,0];clipLocal.normal.set(cn[0],cn[1],cn[2]);clipR.min=R.cr[0];clipR.max=R.cr[1];clipR.value=R.clip;clipLocal.constant=-R.clip;clipV.textContent=clipTxt(R.clip);clipBar.hidden=false;setClip(true);}
  else{clipBar.hidden=true;setClip(false);}
  const fl=root.rotation.z!==0;root.updateMatrixWorld();
  const tg=root.localToWorld(V(R.v.tg[0],R.v.tg[1],R.v.tg[2]));
  anim={t0:performance.now(),from:{theta:cam.theta,phi:cam.phi,r:cam.r,tg:cam.target.clone()},to:{theta:fl?-R.v.th:R.v.th,phi:fl?-R.v.ph:R.v.ph,r:R.v.r,tg:tg}};
  clearViewPress();setTimeout(measure,50);
}
if(!REG.length)regsEl.style.display='none';REG.forEach(R=>{const b=document.createElement('button');b.textContent=R.n;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>goReg(R,b));regsEl.appendChild(b);});
clipR.addEventListener('input',()=>{const v=+clipR.value;clipLocal.constant=-v;clipV.textContent=clipTxt(v);applyClip();});
document.getElementById('bAll').addEventListener('click',exitReg);
document.getElementById('bBones').addEventListener('click',exitReg);
const sheet=document.getElementById('sheet'),bL=document.getElementById('bList');
bL.addEventListener('click',()=>{const o=sheet.classList.toggle('open');bL.setAttribute('aria-expanded',o);bL.textContent=o?'Chiudi elenco':'Elenco';setTimeout(measure,280);});
function measure(){document.documentElement.style.setProperty('--sheetH',(innerWidth>=900?0:sheet.offsetHeight)+'px');}
addEventListener('resize',measure);measure();
/* smartphone: pannello richiudibile dalla linguetta; chiuso all'avvio, si chiude quando si apre una card */
const compact=matchMedia('(max-width:600px),(orientation:landscape) and (max-height:500px)'),bS=document.getElementById('bSheet');
function setSheet(o){sheet.classList.toggle('collapsed',!o);bS.setAttribute('aria-expanded',o);}
let sw=null,swDone=false;
bS.addEventListener('click',()=>{if(swDone){swDone=false;return;}const o=sheet.classList.contains('collapsed');if(o&&!card.hidden)select(null);setSheet(o);});
/* swipe verso il basso dall'intestazione "Strutture" chiude il pannello */
bS.addEventListener('pointerdown',e=>{swDone=false;sw=compact.matches&&!sheet.classList.contains('collapsed')?{id:e.pointerId,x:e.clientX,y:e.clientY}:null;});
bS.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dy=e.clientY-sw.y;if(dy>28&&dy>Math.abs(e.clientX-sw.x)){sw=null;swDone=true;setSheet(false);}});
bS.addEventListener('pointerup',()=>{sw=null;});bS.addEventListener('pointercancel',()=>{sw=null;});
new MutationObserver(()=>{if(!card.hidden&&compact.matches)setSheet(false);}).observe(card,{attributes:true,attributeFilter:['hidden']});
compact.addEventListener('change',e=>{if(e.matches)setSheet(false);});

/* ============ Loop e costruzione ============ */
let building=true,lastR=0;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function loop(now){
  if(anim){const t=Math.min(1,(now-anim.t0)/650),k=ease(t);
    cam.theta=anim.from.theta+(anim.to.theta-anim.from.theta)*k;cam.phi=anim.from.phi+(anim.to.phi-anim.from.phi)*k;cam.r=anim.from.r+(anim.to.r-anim.from.r)*k;cam.target.lerpVectors(anim.from.tg,anim.to.tg,k);if(t>=1)anim=null;}
  updateCam();if(clipOn)applyClip();if(!building||now-lastR>250){renderer.render(scene,camera);lastR=now;}requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
(async function(){
  const bar=document.getElementById('loadBar'),txt=document.getElementById('loadTxt');
  BP=await loadBP();
  for(let i=0;i<S.length;i++){
    try{buildStruct(S[i]);}catch(err){console.error(S[i].id,err);}
    bar.style.width=Math.round((i+1)/S.length*85)+'%';txt.textContent='Costruzione del modello… '+(i+1)+'/'+S.length;
    await new Promise(r=>setTimeout(r,0));
  }
  txt.textContent='Calcolo di ombre e profondità…';await new Promise(r=>setTimeout(r,30));
  try{bakeAO(built);}catch(err){console.error(err);}
  bar.style.width='100%';building=false;document.getElementById('load').hidden=true;
  /* Ricerca dalla home: ID stabile, applicato solo a costruzione completata. */
  scene.updateMatrixWorld(true);
  const searchId=new URLSearchParams(location.search).get('struttura');
  const found=searchId&&S.find(s=>s.id===searchId);
  if(found&&found.group&&found.group.children.length){
    isola(s=>s===found||s.cat==='ossa');
    select(found.id);sync();
    const box=new THREE.Box3().setFromObject(found.group);
    const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
    const bones=new THREE.Box3();S.filter(s=>s.cat==='ossa'&&s.group).forEach(s=>bones.expandByObject(s.group));
    const boneCenter=bones.getCenter(new THREE.Vector3());
    const dx=center.x-boneCenter.x,dz=center.z-boneCenter.z;
    anim=null;cam.target.copy(center);cam.phi=0.12;
    if(Math.hypot(dx,dz)>0.4)cam.theta=Math.atan2(dx,dz);
    const fov=camera.fov*Math.PI/180;
    const fit=Math.max(size.y,size.x/Math.min(camera.aspect,1),size.z)*0.75/Math.tan(fov/2);
    cam.r=Math.max(cam.baseR*0.28,Math.min(cam.baseR*1.3,fit));
    clearViewPress();
    if(compact.matches)setSheet(false);
  }else if(searchId){
    const notice=document.createElement('p');notice.setAttribute('role','status');
    notice.textContent='Struttura non disponibile. Puoi cercarla nell’elenco.';
    notice.style.cssText='position:fixed;top:100px;left:20px;right:20px;z-index:30;padding:12px;border-radius:12px;background:var(--panel);color:var(--ink)';
    document.body.appendChild(notice);setTimeout(()=>notice.remove(),7000);
  }

})();
window.__dbg={S,setVis,sync,cam,stop:()=>{anim=null;}};
})();

</script>
